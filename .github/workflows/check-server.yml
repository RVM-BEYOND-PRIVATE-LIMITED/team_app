name: Check the server

# A read-only look at the server before the first deploy, and any time after:
# can the deploy log in, which Node runs there, is port 3001 free, can nginx and
# certbot be driven, does the ESS host name point at this server. It changes
# nothing: no file is written, no process is started or stopped, nginx is only
# tested (`nginx -t`), never reloaded.
#
# Run it by hand: Actions, then "Check the server", then "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Read-only server check
    runs-on: ubuntu-latest
    env:
      ESS_HOST: ${{ vars.ESS_HOST }}
    steps:
      - name: Settings present
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          bad=0
          for k in DEPLOY_HOST DEPLOY_USER SSH_PRIVATE_KEY ESS_HOST; do
            v="${!k}"
            if [ -z "$v" ]; then echo "::error::${k} is empty."; bad=1; else echo "  ${k}: set (${#v} chars)"; fi
          done
          case "$SSH_PRIVATE_KEY" in
            *'-----BEGIN '*'PRIVATE KEY-----'*'-----END '*'PRIVATE KEY-----'*) echo "  SSH_PRIVATE_KEY: has its BEGIN and END lines" ;;
            *) echo "::error::SSH_PRIVATE_KEY does not look like a whole private key. Paste it again, BEGIN and END lines included."; bad=1 ;;
          esac
          exit "$bad"

      # The host name must point at the server the deploy logs in to. Compared
      # here without printing the HOST secret.
      - name: The ESS host name points at the server
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
        run: |
          host=$(printf '%s' "$ESS_HOST" | tr '[:upper:]' '[:lower:]')
          ess_ip=$(getent ahostsv4 "$host" | awk '{print $1; exit}')
          server_ip=$(getent ahostsv4 "$DEPLOY_HOST" | awk '{print $1; exit}')
          if [ -z "$ess_ip" ]; then
            echo "::error::${host} does not resolve. Check its DNS record."
            exit 1
          elif [ "$ess_ip" = "$server_ip" ]; then
            echo "${host} resolves to ${ess_ip}, the server the deploy logs in to."
          else
            echo "::error::${host} resolves to ${ess_ip}, which is not the server in the HOST secret."
            exit 1
          fi

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
            echo "Using the pinned host key from SSH_KNOWN_HOSTS."
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2> /dev/null
            echo "SSH_KNOWN_HOSTS is not set. The server's host key fingerprints, to pin it later:"
            ssh-keygen -lf ~/.ssh/known_hosts
          fi

      # Every command below only reads. pm2 is asked for its table, never for
      # `jlist` or `describe`, which would print each process's environment,
      # secrets included. `bash -l` gives the same login environment, and so the
      # same PATH to node and pm2, as the Scheduler's deploy gets.
      - name: Look at the server
        env:
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes -o BatchMode=yes "${DEPLOY_USER}@${DEPLOY_HOST}" 'bash -l -s' << 'ENDSSH'
          set -u
          ok() { echo "  OK    $*"; }
          fail() { echo "::error::$*"; failed=1; }
          failed=0

          echo "Logged in as $(whoami) on $(hostname)."

          if command -v node > /dev/null; then
            major=$(node -p "process.versions.node.split('.')[0]")
            if [ "$major" -ge 20 ]; then ok "Node $(node -v) (the ESS needs 20 or later)"
            else fail "Node $(node -v) is too old: the ESS needs Node 20 or later, and the Scheduler shares this Node."; fi
          else fail "node is not on the PATH for $(whoami)."; fi
          if command -v npm > /dev/null; then ok "npm $(npm -v)"; else fail "npm is not on the PATH."; fi

          if command -v pm2 > /dev/null; then
            ok "pm2 $(pm2 -v 2> /dev/null | tail -1)"
            echo "  pm2 processes now:"
            pm2 ls --no-color 2> /dev/null | sed 's/^/    /'
          else fail "pm2 is not on the PATH."; fi

          if ss -ltn | awk '{print $4}' | grep -Eq '(^|:)3001$'; then
            if pm2 describe team-rvm-ess > /dev/null 2>&1; then ok "port 3001 is the ESS"
            else fail "port 3001 is taken by something other than the ESS."; fi
          else ok "port 3001 is free"; fi
          # Every listening TCP port and the process holding it (the pid matches pm2's table
          # above), so a free port can be chosen without guessing.
          echo "  listening TCP ports:"
          if ports=$(sudo -n ss -ltnp 2> /dev/null); then
            printf '%s\n' "$ports" | awk 'NR > 1 { print "    " $4 "  " $6 }' | sort -u
          else
            ss -ltn | awk 'NR > 1 { print "    " $4 }' | sort -u
          fi

          if sudo -n true 2> /dev/null; then ok "sudo works without a password (the nginx step needs it)"
          else fail "sudo asks for a password, so the deploy cannot write its nginx file."; fi
          if command -v nginx > /dev/null; then ok "$(nginx -v 2>&1)"; else fail "nginx is not installed."; fi
          if out=$(sudo -n nginx -t 2>&1); then ok "nginx -t passes for every site"
          else fail "nginx -t fails right now, before any team_app change:"; printf '%s\n' "$out" | sed 's/^/    /'; fi
          echo "  nginx sites enabled: $(find /etc/nginx/sites-enabled -mindepth 1 -maxdepth 1 -printf '%f ' 2> /dev/null)"
          if command -v certbot > /dev/null; then ok "$(certbot --version 2>&1)"; else fail "certbot is not installed."; fi
          for f in /etc/letsencrypt/options-ssl-nginx.conf /etc/letsencrypt/ssl-dhparams.pem; do
            if sudo -n test -f "$f"; then ok "$f exists"; else fail "$f is missing; the HTTPS file includes it."; fi
          done

          if [ -d "$HOME/team_app" ]; then ok "$HOME/team_app exists (an earlier deploy)"; else ok "$HOME/team_app does not exist yet (first deploy)"; fi
          echo "  free disk in ~: $(df -h ~ | awk 'NR==2 {print $4}')"
          echo "  memory: $(free -m | awk '/^Mem:/ {print $7 " MB available of " $2 " MB"}')"

          echo
          if [ "$failed" -eq 0 ]; then echo "The server is ready for the ESS deploy."; else echo "Fix the errors above before the first deploy."; fi
          exit "$failed"
          ENDSSH
