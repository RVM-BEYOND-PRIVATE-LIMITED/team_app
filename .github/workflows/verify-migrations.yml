name: Verify applied migrations

# Read-only: probes the production PostgREST schema with the deploy's own secrets and reports any
# hr_ess_* table, column or seed the migrations create but the database does not have. It changes
# nothing. Dispatch it from the Actions tab (or `gh workflow run verify-migrations.yml`).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the production schema (read-only)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -u
          base="${SUPABASE_URL%/}/rest/v1"
          auth=(-H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY")
          missing=0

          table() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/$1?limit=1" "${auth[@]}")
            if [ "$code" = "200" ] || [ "$code" = "206" ]; then echo "OK      table $1"
            else echo "MISSING table $1 (HTTP $code)"; missing=$((missing + 1)); fi
          }
          column() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/$1?select=$2&limit=1" "${auth[@]}")
            if [ "$code" = "200" ]; then echo "OK      column $1.$2"
            else echo "MISSING column $1.$2 (HTTP $code)"; missing=$((missing + 1)); fi
          }
          count_at_least() {
            n=$(curl -s "$base/$1?select=$2" "${auth[@]}" | jq 'length')
            if [ "${n:-0}" -ge "$3" ]; then echo "OK      seed $1 ($n)"
            else echo "MISSING seed $1 (found ${n:-0}, expected >= $3)"; missing=$((missing + 1)); fi
          }

          for t in \
            hr_ess_sessions hr_ess_audit hr_ess_data_requests hr_ess_personal_details \
            hr_ess_mock_location_reports hr_ess_request_limits hr_ess_attendance_requests \
            hr_ess_attendance_request_history hr_ess_leave_requests hr_ess_leave_request_history \
            hr_ess_request_archives hr_ess_push_devices hr_ess_notifications \
            hr_ess_notification_settings hr_ess_wall_posts hr_ess_wall_comments \
            hr_ess_wall_poll_options hr_ess_wall_poll_votes hr_ess_wall_reactions \
            hr_ess_wall_mentions hr_ess_wall_wishes hr_ess_wall_reports \
            hr_ess_celebration_optouts hr_ess_announcements hr_ess_announcement_audience \
            hr_ess_announcement_reads hr_ess_helpdesk_categories hr_ess_helpdesk_tickets \
            hr_ess_helpdesk_messages hr_ess_document_types hr_ess_documents \
            hr_ess_change_requests hr_ess_bank_details hr_ess_helpdesk_assignments \
            hr_ess_approval_escalations hr_ess_infra_links hr_ess_wfh_allowances \
            hr_ess_work_experience hr_ess_profile_details hr_ess_leave_approvers \
            hr_ess_leave_final_approvers; do
            table "$t"
          done

          column hr_ess_leave_requests end_day
          column hr_ess_leave_requests portion
          column hr_ess_leave_requests day_count
          column hr_ess_leave_requests working_days
          column hr_ess_leave_requests days_before
          column hr_ess_leave_requests requires_final_approval
          column hr_ess_leave_requests stage
          column hr_ess_leave_requests manager_approved_by_employee_id
          column hr_ess_leave_requests manager_approved_by_name
          column hr_ess_leave_requests manager_approved_at
          column hr_ess_leave_requests manager_remark
          column hr_ess_leave_requests admin_manager_employee_id
          column hr_ess_leave_requests admin_manager_name
          column hr_ess_leave_requests is_teaching
          column hr_ess_leave_requests final_approver_employee_id
          column hr_ess_leave_requests final_approver_name
          column hr_ess_leave_requests substitute_faculty_id
          column hr_ess_leave_requests substitute_faculty_name
          column hr_ess_leave_requests class_timing
          column hr_ess_attendance_requests minutes
          column hr_ess_helpdesk_tickets assigned_at
          column hr_ess_documents remark
          column hr_ess_wall_posts poll_closed_at
          column hr_ess_leave_requests end_day
          column hr_ess_leave_requests portion
          column hr_ess_leave_requests working_days
          column hr_ess_leave_requests stage
          column hr_ess_leave_requests requires_final_approval

          # The routing function is the heart of the 20261114000004 flow: a broken body
          # would otherwise only surface when somebody files leave. Read-only.
          employee=$(curl -s "$base/hr_employees?select=id&is_archived=eq.false&limit=1" "${auth[@]}" | jq -r '.[0].id // empty')
          if [ -n "$employee" ]; then
            routed=$(curl -s -X POST "$base/rpc/hr_ess_leave_route" "${auth[@]}" \
              -H 'Content-Type: application/json' -d "{\"p_employee_id\":\"$employee\"}")
            if echo "$routed" | jq -e 'type == "array" and length == 1 and (.[0].stage == "manager" or .[0].stage == "final") and (.[0] | has("final_approver_employee_id"))' > /dev/null; then
              echo "OK      function hr_ess_leave_route"
            else
              echo "MISSING function hr_ess_leave_route ($routed)"; missing=$((missing + 1))
            fi

            # The Admin Manager's decision RPC. A random request id must answer not_found
            # without writing anything, so this is a read-only check of the signature.
            decided=$(curl -s -X POST "$base/rpc/hr_ess_leave_admin_decide" "${auth[@]}" \
              -H 'Content-Type: application/json' -d "{\"p_request_id\":\"00000000-0000-4000-8000-000000000000\",\"p_decider_employee_id\":\"$employee\",\"p_decider_user_id\":null,\"p_decider_name\":\"Migration probe\",\"p_approve\":true,\"p_note\":null,\"p_substitute_faculty_id\":null,\"p_substitute_faculty_name\":null,\"p_class_timing\":null,\"p_now\":\"2026-10-27T00:00:00Z\"}")
            if echo "$decided" | jq -e '.outcome == "not_found"' > /dev/null; then
              echo "OK      function hr_ess_leave_admin_decide"
            else
              echo "MISSING function hr_ess_leave_admin_decide ($decided)"; missing=$((missing + 1))
            fi
          fi

          count_at_least hr_ess_document_types slug 9
          count_at_least hr_ess_request_limits type 6
          count_at_least hr_ess_helpdesk_categories slug 10
          count_at_least hr_ess_leave_final_approvers branch_id 4

          posh=$(curl -s "$base/hr_ess_helpdesk_categories?select=queue_roles&slug=eq.posh" "${auth[@]}" \
            | jq -e '.[0].queue_roles | index("internal_committee") != null' > /dev/null && echo yes || echo no)
          if [ "$posh" = "yes" ]; then echo "OK      seed POSH queue is internal_committee"
          else echo "MISSING seed POSH queue is internal_committee"; missing=$((missing + 1)); fi

          echo "---"
          echo "$missing missing check(s)"
          test "$missing" -eq 0
