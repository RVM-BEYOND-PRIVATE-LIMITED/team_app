name: CI

# Every pull request and every push (ADR-0011). Deploying is deploy-ess.yml's job, not this one's.
on:
  pull_request:
  push:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ess-api:
    name: ESS API on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 because the server's Node version is not confirmed yet, so the oldest supported one
        # is tested; 24 is the LTS the service is meant to move to (ADR-0017).
        node: [20, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --workspace apps/ess-api

      # Includes tests/contract.test.js, which holds the ESS's replies against
      # packages/contracts/openapi.yaml. The checks that compare the ESS's copies of Scheduler code
      # with Scheduler_Backend skip themselves here: CI cannot read that private repository, so
      # they run on a developer's machine with SCHEDULER_BACKEND_DIR set (ADR-0008).
      - name: Test
        run: npm test --workspace apps/ess-api

  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Redocly CLI comes from the lockfile, so the version that lints here is the one every
      # developer has. The ruleset (recommended-strict) is in packages/contracts/redocly.yaml.
      - name: Install
        run: npm ci

      - name: Lint packages/contracts/openapi.yaml
        run: npm run lint --workspace @team-rvm/contracts

  # The ESS's nginx file and the script the deploy installs it with, run against a real nginx in
  # a container through every case the deploy can meet (ADR-0019). The Scheduler's deploy stops
  # when `nginx -t` fails for any site, so a broken file from here must never reach the server.
  nginx:
    name: nginx ${{ matrix.nginx }} file & script
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The nginx of Ubuntu 22.04 (1.18) and of 24.04 (1.24): the server runs one of them, and
        # the file uses nothing newer than 1.18.
        nginx: ['1.18', '1.24']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: shellcheck
        run: shellcheck apps/ess-api/deploy/*.sh

      - name: Run the nginx cases
        run: |
          docker run --rm -v "$PWD:/work:ro" "nginx:${{ matrix.nginx }}-alpine" sh -c \
            "apk add --no-cache bash openssl curl > /dev/null && bash /work/apps/ess-api/deploy/test-nginx.sh"
