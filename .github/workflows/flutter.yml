name: Flutter

# The Team RVM app and its shared packages (flutter_app/): analyze, test, and a
# release build that is measured against the size limit (team_app #50, item 11).
# A pull request into any branch runs it when it touches flutter_app/ or this
# file; so does a push to main.
on:
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter.yml'
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter.yml'

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: flutter-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Flutter the app is built with (3.35.7, Dart 3.9). Installed from its git
  # tag, so no third-party action is needed.
  FLUTTER_VERSION: '3.35.7'

jobs:
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: |
          flutter --disable-analytics
          flutter --version

      # One lockfile for the whole workspace (flutter_app/pubspec.lock); CI uses it as it is.
      - name: Get packages
        run: flutter pub get --enforce-lockfile

      - name: Analyze the app and every package
        run: |
          status=0
          for dir in rvm_team_app packages/*/; do
            dir=${dir%/}
            echo "::group::flutter analyze $dir"
            (cd "$dir" && flutter analyze) || { echo "::error::flutter analyze failed in $dir"; status=1; }
            echo "::endgroup::"
          done
          exit $status

      - name: Test the app and every package
        run: |
          status=0
          for dir in rvm_team_app packages/*/; do
            dir=${dir%/}
            if [ ! -d "$dir/test" ]; then
              echo "$dir has no tests."
              continue
            fi
            echo "::group::flutter test $dir"
            (cd "$dir" && flutter test) || { echo "::error::flutter test failed in $dir"; status=1; }
            echo "::endgroup::"
          done
          exit $status

  release:
    name: Release build and size
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A release APK or the AAB this size or larger fails the job (100 MB).
      SIZE_LIMIT_BYTES: 104857600
    defaults:
      run:
        working-directory: flutter_app/rvm_team_app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        working-directory: ${{ runner.temp }}
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git flutter
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Flutter version
        run: |
          flutter --disable-analytics
          flutter --version

      - name: Get packages
        run: flutter pub get --enforce-lockfile

      # A release build must be signed (android/app/build.gradle.kts stops without
      # android/key.properties). CI builds only to test and measure, so it makes a
      # new key for this run, with a random password that is masked in the log.
      # The real release key never comes near this public repository.
      - name: Make a throwaway signing key
        run: |
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/ci-throwaway.jks" -storetype PKCS12 \
            -alias ci-throwaway -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=CI throwaway key, O=Not for release" \
            -storepass "$password" -keypass "$password"
          {
            echo "storeFile=$RUNNER_TEMP/ci-throwaway.jks"
            echo "storePassword=$password"
            echo "keyAlias=ci-throwaway"
            echo "keyPassword=$password"
          } > android/key.properties

      # GitHub Actions sets CI=true, so build.gradle.kts does not upload this build's
      # R8 mapping to the production Firebase project.
      - name: Build the release APKs (one per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build the release App Bundle
        run: flutter build appbundle --release

      - name: Signed, with no call, phone or microphone permission
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)
          status=0
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "::group::$apk"
            "${tools}apksigner" verify "$apk" || { echo "::error::$apk is not signed."; status=1; }
            permissions=$("${tools}aapt2" dump permissions "$apk")
            echo "$permissions"
            # team_app #50, check 2: the merged release manifest asks for no call,
            # call-log or phone-state permission (test/manifest_permissions_issue50_test.dart
            # checks the source manifests).
            if echo "$permissions" | grep -E "android\.permission\.(CALL_PHONE|CALL_PRIVILEGED|READ_CALL_LOG|WRITE_CALL_LOG|PROCESS_OUTGOING_CALLS|ANSWER_PHONE_CALLS|READ_PHONE_STATE|READ_PHONE_NUMBERS)'"; then
              echo "::error::$apk asks for a call, call-log or phone-state permission."
              status=1
            fi
            # team_app #51, item 10: voice typing uses the phone's speech prompt, so
            # no library may add the microphone permission either
            # (test/speech_input_manifest_issue51_test.dart checks the source manifests).
            if echo "$permissions" | grep -E "android\.permission\.RECORD_AUDIO'"; then
              echo "::error::$apk asks for the microphone (RECORD_AUDIO)."
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Sizes (fails at 100 MB)
        run: |
          apks=(build/app/outputs/flutter-apk/app-*-release.apk)
          aab=build/app/outputs/bundle/release/app-release.aab
          if [ ! -f "${apks[0]}" ] || [ ! -f "$aab" ]; then
            echo "::error::The release APKs or the App Bundle were not built."
            exit 1
          fi
          {
            echo "### Team RVM release sizes"
            echo
            echo "| File | Bytes | MB |"
            echo "| --- | ---: | ---: |"
          } >> "$GITHUB_STEP_SUMMARY"
          largest_apk=0
          largest_name=
          for file in "${apks[@]}" "$aab"; do
            bytes=$(stat -c %s "$file")
            mb=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1048576 }')
            echo "$(basename "$file"): $bytes bytes ($mb MB)"
            echo "| $(basename "$file") | $bytes | $mb |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$file" != "$aab" ] && [ "$bytes" -gt "$largest_apk" ]; then
              largest_apk=$bytes
              largest_name=$(basename "$file")
            fi
          done
          aab_bytes=$(stat -c %s "$aab")
          echo "Largest APK: $largest_name, $largest_apk bytes. App Bundle: $aab_bytes bytes. Limit: $SIZE_LIMIT_BYTES bytes."
          status=0
          if [ "$largest_apk" -ge "$SIZE_LIMIT_BYTES" ]; then
            echo "::error::$largest_name is $largest_apk bytes, at or over the $SIZE_LIMIT_BYTES-byte limit."
            status=1
          fi
          if [ "$aab_bytes" -ge "$SIZE_LIMIT_BYTES" ]; then
            echo "::error::app-release.aab is $aab_bytes bytes, at or over the $SIZE_LIMIT_BYTES-byte limit."
            status=1
          fi
          exit $status

      - name: Remove the throwaway key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/ci-throwaway.jks"
