        '204':
          description: |
            Accepted and dropped, with no body. Four reasons share it: the session is still on HR's first-time password; this is not the employee's registered phone (no cookie, an unknown one, someone else's, or one HR reset); the employee is not punched in today (never punched in, punched out, or it is past IST midnight); or the last stored ping is under 60 seconds old.
        '400':
          description: |
            - `LOCATION_MISSING`: the fix is missing or unusable. Sent only after the 204 checks pass.
            - An HTML page, not JSON: the body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                locationMissing:
                  value:
                    error: Location is required to punch. Allow location for this site and try again.
                    code: LOCATION_MISSING
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlPage'
        '401':
          $ref: '#/components/responses/PunchAuthRejected'
        '403':
          $ref: '#/components/responses/PunchIdentityForbidden'
        '429':
          $ref: '#/components/responses/SchedulerApiRateLimited'
        '500':
          description: '"Failed to record location." (no code): an unexpected failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                unexpected:
                  value:
                    error: Failed to record location.
        '503':
          $ref: '#/components/responses/HrUnavailable'
      x-notes:
        - >-
          A 204 is never an error, and the phone, day and throttle cases never answer 403 or 429. When 204s keep coming, reload GET /hr/my-attendance (device.this_phone, today.punched_in) to decide whether to stop tracking.
        - >-
          Stop at the first of: punch-out, the end of the shift plus its grace period (shift.end and shift.grace_minutes in GET /hr/my-attendance), or IST midnight (decision 5).
        - >-
          One fix per request, with no batching and no phone timestamp; batching would need a Scheduler change, which is out of scope (ADR-0018). No User-Agent check and no accuracy limit apply, but latitude, longitude and accuracy_m are required.
        - >-
          The Scheduler stores a mocked fix like any other. What the app does with a mocked ping is still open (decision 6; the proposal is to report it to the ESS for HR).

  /hr/my-attendance/remarks:
    put:
      operationId: saveMyRemark
      tags: ['Scheduler (existing)']
      x-owner: scheduler
      x-source: 'routes/hr.js:66-74,203; controllers/hr/attendancePunchController.js:556-588; services/attendanceRules.js:25-39'
      summary: Add, change or remove your own remark on one of your days
      description: |
        Either token kind. One remark per day, for any day from the 1st of last month up to today (IST). Empty text removes it. The remark is the employee's own word beside the day: it changes nothing about the day, and HR reads it beside HR's remark.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemarkRequest'
            examples:
              save:
                value:
                  day: '2026-10-14'
                  remarks: The bus was late, so I reached at 10:05.
              remove:
                value:
                  day: '2026-10-14'
                  remarks: ''
      responses:
        '200':
          description: 'Saved, or removed (`remarks: null`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemarkSaved'
              examples:
                saved:
                  value:
                    day: '2026-10-14'
                    remarks: The bus was late, so I reached at 10:05.
                    updated_at: '2026-10-16T05:01:33.418227+00:00'
                removed:
                  value:
                    day: '2026-10-14'
                    remarks: null
        '400':
          description: |
            - `VALIDATION_FAILED`: `day` is not YYYY-MM-DD, or the text is over 500 characters.
            - `DAY_OUT_OF_RANGE`: the day is in the future or before the 1st of last month.
            - An HTML page, not JSON: the body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                badDay:
                  value:
                    error: day is required (YYYY-MM-DD).
                    code: VALIDATION_FAILED
                tooLong:
                  value:
                    error: Keep the remark to 500 characters.
                    code: VALIDATION_FAILED
                outOfRange:
                  value:
                    error: You can add a remark to a day of this month or last month, up to today.
                    code: DAY_OUT_OF_RANGE
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlPage'
        '401':
          $ref: '#/components/responses/PunchAuthRejected'
        '403':
          $ref: '#/components/responses/PunchIdentityForbidden'
        '429':
          $ref: '#/components/responses/SchedulerApiRateLimited'
        '500':
          description: '"Failed to save your remark." (no code): an unexpected failure, including a day that matches YYYY-MM-DD but does not exist, such as 2026-02-30.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                unexpected:
                  value:
                    error: Failed to save your remark.
        '503':
          description: |
            - `MODULE_DISABLED`: the HR module is switched off.
            - `MODULE_NOT_INSTALLED`: the remarks table is missing. This one names `20261022000000_hr_attendance_shifts.sql`, although the table comes from `20261023000000_hr_attendance_employee_remarks.sql` (a known defect).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                moduleDisabled:
                  $ref: '#/components/examples/HrModuleDisabled'
                rulesNotInstalled:
                  $ref: '#/components/examples/RulesNotInstalled'
                punchNotInstalled:
                  $ref: '#/components/examples/PunchNotInstalled'
      x-notes:
        - >-
          This works even for a session still on HR's first-time password, unlike the challenge, punch and ping. It is a known gap, and it stays: closing it would need a Scheduler change (ADR-0018). The app should send the person to "Choose your own password" first anyway.
        - >-
          The 500 characters are counted after trimming, as characters rather than bytes.

components:

  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        One header, `Authorization: Bearer <token>`, and two kinds of token, both in the Scheduler's formats. The Scheduler issues them at sign-in; the ESS mints short ones in the same formats for a kept sign-in (below). The app stores whichever it was given last.

        | | Portal JWT | Attendance session |
        | --- | --- | --- |
        | Issued by | `POST /users/login`, or `/users/login/verify` when two-factor is on | `POST /hr/my-attendance/password-login`, `/otp/verify` or `/password` |
        | Who has one | People with a portal login (a `users` row) | Staff with no portal login, on an attendance login HR created |
        | Lifetime | 64 hours, no refresh | 30 days, no refresh |
        | Signed with | HS256 over `JWT_SECRET`; no audience, no issuer | HS256 over a key derived from `JWT_SECRET`; audience `rvm-punch` |
        | Claims | `userId`, `role`, `locationId`, `username`, `locationName`, `isSuperAdmin`; plus `id` (the faculty id) for faculty and HOD | `k: "punch"`, `e` (the hr_employees id), `m: "otp"` or `"pw"` |
        | Works on | Every Scheduler route its role allows, `/hr/my-attendance/*` and the ESS | `/hr/my-attendance/*` and the ESS only |
        | Ended by | Expiry, or the account being deleted. Neither a password change nor leaving the company ends it on the Scheduler | Expiry; a password set or reset (401); HR switching the login off (403 `NO_ATTENDANCE_LOGIN`) |

        - An attendance session sent to any other Scheduler route is refused with 401 "Please authenticate", which the sign-out rule reads as "session over". Never send it outside `/hr/my-attendance/*` and the ESS.
        - The ESS refuses a valid token that is not a staff login with 403 `NOT_AN_EMPLOYEE`: a student token (7 days, `role: "student"`), an admission-undertaking token (issuer `rvmcad-admission-undertaking`), or anything else signed with `JWT_SECRET`.
        - The ESS is stricter about the header than the Scheduler: it takes only `Bearer <token>` exactly, and accepts HS256 only.
        - Do not decide anything from the claims except `exp`. Ask `GET /ess/me` and `GET /ess/me/capabilities`.
        - **Access tokens of a kept sign-in** (`POST /ess/session`, `/ess/session/refresh`) are minted by the ESS in these same two formats and signed the same way, because the Scheduler cannot be changed to accept a new kind (ADR-0006, ADR-0018). They last one hour, carry one more claim, `sid` (the kept sign-in), and keep the original sign-in's `iat`. The Scheduler ignores `sid` and takes them as its own until they expire. The ESS also checks `sid`: once the kept sign-in has ended (signed out, ended from the session list, or refused at a refresh) its access tokens answer 401 `NOT_AUTHENTICATED` on the ESS at once, while on the Scheduler they last out their hour.

  parameters:
    DeviceCookie:
      name: rvm_att_dev
      in: cookie
      required: false
      description: |
        The registered phone's device token, set by the Scheduler on the first accepted punch (see `POST /hr/my-attendance/punch`). Not set by the app: a persistent cookie jar sends it on every `/api/hr/my-attendance` request, because the cookie's path is `/api/hr/my-attendance`. A value that does not match the pattern is ignored, as if no cookie were sent.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{20,200}$'
    PhoneUserAgent:
      name: User-Agent
      in: header
      required: false
      description: |
        While `ATTENDANCE_MOBILE_ONLY` is on (the default; `rules.mobile_only` in `GET /hr/my-attendance` says so) it must contain Android, iPhone, iPad, iPod or Mobile, in any case, or the punch is refused 403 `NOT_MOBILE`. A missing header, and Dart's default "Dart/3.x (dart:io)", are refused. Set it once on the HTTP client.
      schema:
        type: string
        examples:
          - TeamRVM/1.0.0 (Android 14; Mobile)
    Month:
      name: month
      in: query
      required: false
      description: |
        The month for `days`, `holidays` and `my_remarks`, as YYYY-MM. Defaults to the current IST month. A value that does not match YYYY-MM is ignored; a matching but impossible one (2026-13) answers 500.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}$'
        examples:
          - '2026-10'

    EmployeeId:
      name: id
      in: path
      required: true
      description: The employee's `id` (hr_employees). Not a uuid is 400 `VALIDATION_FAILED`.
      schema:
        type: string
        format: uuid
    FromDay:
      name: from
      in: query
      required: false
      description: The first IST day, YYYY-MM-DD.
      schema:
        type: string
        format: date
    ToDay:
      name: to
      in: query
      required: false
      description: The last IST day, YYYY-MM-DD.
      schema:
        type: string
        format: date
    BranchFilter:
      name: branch_id
      in: query
      required: false
      description: An HR branch's `id` (hr_branches).
      schema:
        type: string
        format: uuid
  headers:
    RetryAfter:
      description: Seconds until the bucket that refused this request resets.
      schema:
        type: integer
        minimum: 0
    RateLimitPolicy:
      description: The bucket that counted the request last, as `<limit>;w=<window seconds>`, for example `300;w=60`.
      schema:
        type: string
    RateLimitLimit:
      description: That bucket's limit.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in that bucket's window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until that bucket's window resets.
      schema:
        type: integer
    DeviceCookie:
      description: |
        Only on the punch that registered this phone: `rvm_att_dev=<token>; Path=/api/hr/my-attendance; Max-Age=157680000; HttpOnly; SameSite=Strict; Secure`. Keep it in a persistent cookie jar and never clear it.
      schema:
        type: string
    NoStore:
      description: Always `no-store`; a challenge must never be cached.
      schema:
        type: string
        const: no-store
    WwwAuthenticate:
      description: Always `Bearer` (RFC 6750), naming the scheme that would have worked.
      schema:
        type: string
        const: Bearer

  schemas:

    # ───────────── errors ─────────────

    Error:
      type: object
      description: |
        Every ESS error. `error` is written for staff and is shown as it is; `code` is what the app branches on.
      required: [error, code]
      properties:
        error:
          type: string
          description: A message written for staff. Show it; never parse it.
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
          description: UPPER_SNAKE. Branch on this.

    SchedulerError:
      type: object
      description: |
        A Scheduler error. `error` is written for staff. `code` is present on most errors but not all: each response says which have none. A few refusals add the fields below.
      required: [error]
      properties:
        error:
          type: string
          description: A message written for staff. Show it; never parse it.
        code:
          type: string
          pattern: '^[A-Z0-9_]+$'
          description: Usually UPPER_SNAKE. On the two-factor send failure it can be a database error code instead.
        attempts_left:
          type: integer
          minimum: 1
          description: With `WRONG_CODE` on `otp/verify`, and `WRONG_CREDENTIALS` after a wrong password, the tries left.
        accuracy_m:
          type: integer
          description: With `ACCURACY_LOW`, the accuracy the phone reported, rounded to metres.
        distance_m:
          type: integer
          description: With `OUTSIDE_GEOFENCE`, how far the fix was from the branch, in metres.
        radius_m:
          type: integer
          description: With `OUTSIDE_GEOFENCE`, the branch radius in metres.
        module:
          type: string
          description: With `MODULE_NOT_INSTALLED`, the module (HR).
        migration:
          type: string
          description: With `MODULE_NOT_INSTALLED`, the migration file that creates what is missing.

    HtmlPage:
      type: string
      description: |
        An HTML page, not JSON: nginx while a process restarts, the Scheduler's catch-all for an unknown path, or Express's default error page for malformed JSON. Never treat it as success and never sign out on it.

    # ───────────── ESS ─────────────

    Semver:
      type: [string, 'null']
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
      description: A semantic version such as 1.4.2, or null when not set.

    Health:
      type: object
      required: [ok, server_time, version, min_app_version, latest_app_version, db]
      properties:
        ok:
          type: boolean
          const: true
        server_time:
          type: string
          format: date-time
          description: The server's clock when it answered.
        version:
          type: string
          description: The ESS build that answered.
        min_app_version:
          $ref: '#/components/schemas/Semver'
          description: Older apps must update before going on. Null when not set.
        latest_app_version:
          $ref: '#/components/schemas/Semver'
          description: Older apps may offer an update. Null when not set.
        db:
          type: string
          enum: [ok, unavailable]
          description: The result of a cheap database read with a short timeout.

    Me:
      type: object
      required: [employee, login]
      properties:
        employee:
          $ref: '#/components/schemas/Employee'
        login:
          $ref: '#/components/schemas/Login'

    Employee:
      type: object
      description: The caller's HR record (`hr_employees`). Never carries pay, a phone number or a document path.
      required: [id, full_name, employee_code, designation, employment_status, branch, department, manager]
      properties:
        id:
          type: string
          format: uuid
          description: hr_employees.id. The id every ESS record about this person uses.
        full_name:
          type: string
        employee_code:
          type: [string, 'null']
        designation:
          type: [string, 'null']
        employment_status:
          type: string
          enum: [active, notice_period, probation, confirmed, resigned, fired, terminated]
          description: |
            As stored on the HR record. "exited" never appears, because an employee who has left gets 403 `NOT_ACTIVE`. "notice_period" means serving notice; the last working day is still active. probation, confirmed and resigned are legacy values that no current record carries.
        branch:
          type: [object, 'null']
          description: The HR branch (`hr_branches`), not a Scheduler location.
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        department:
          type: [object, 'null']
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        manager:
          type: [object, 'null']
          description: The reporting manager on the HR record (`manager_id`), who approves this person's requests. Null when none is recorded, in which case HR approves.
          required: [id, full_name]
          properties:
            id:
              type: string
              format: uuid
            full_name:
              type: string

    Login:
      type: object
      required: [kind, role, user_id]
      properties:
        kind:
          type: string
          enum: [portal, attendance]
          description: Which token this request carried.
        role:
          type: [string, 'null']
          enum: [ceo, super_admin, hoo, hod, hod_placement, admin_manager, admin, accounts_admin, hr, hr_executive, faculty, null]
          description: The portal login's role (users.role) as it is now. Null for an attendance session.
        user_id:
          type: [string, 'null']
          format: uuid
          description: users.id of a portal login. Null for an attendance session.

    Capabilities:
      type: object
      required: [tabs, sections, team, approvals, requests, wall, push, integrity]
      properties:
        tabs:
          type: array
          description: The bottom tabs, in display order. All five for every staff login.
          items:
            type: string
            enum: [home, inbox, wall, me, team]
        sections:
          type: object
          required: [time, helpdesk, documents, profile, work]
          properties:
            time:
              type: boolean
              description: Attendance, requests and leave. True for every staff login.
            helpdesk:
              type: boolean
              description: True for every staff login.
            documents:
              type: boolean
              description: True for every staff login.
            profile:
              type: boolean
              description: True for every staff login.
            work:
              type: boolean
              description: The teaching and leadership section. True for faculty, hod, hod_placement, hoo, super_admin and ceo; false for admin, admin_manager, accounts_admin, hr, hr_executive and attendance-only staff.
        team:
          type: object
          required: [has_reports, direct_reports]
          properties:
            has_reports:
              type: boolean
              description: True when direct_reports is above 0.
            direct_reports:
              type: integer
              minimum: 0
              description: Active employees whose manager_id is the caller.
        approvals:
          type: object
          required: [own_reports, any_request, request_types, hr_scope]
          properties:
            own_reports:
              type: boolean
              description: The caller decides their direct reports' requests (true when direct_reports is above 0).
            any_request:
              type: boolean
              description: The caller may decide anyone's request, recorded as HR's decision. True for hr, ceo and super_admin only; never for hr_executive.
            request_types:
              type: array
              description: The request types this person may decide. Every offered type when any_request or own_reports is true; otherwise empty.
              items:
                $ref: '#/components/schemas/RequestType'
            hr_scope:
              type: array
              description: HR review queues. hr gets all four; hr_executive gets documents, profile_changes and helpdesk_hr; everyone else none.
              items:
                type: string
                enum: [attendance, documents, profile_changes, helpdesk_hr]
        requests:
          type: object
          required: [types, payroll_cutoff_day, reach_back_months]
          properties:
            types:
              type: array
              description: Every request type, offered or not, with its monthly limit. One entry per type.
              items:
                $ref: '#/components/schemas/RequestTypePolicy'
            payroll_cutoff_day:
              type: integer
              minimum: 1
              maximum: 28
              description: The day of the current month (IST) on which requests for last month close; 5 (KP, 16 Oct). Whether the 5th itself is still open is to be confirmed with KP (docs/03-decisions.md).
            reach_back_months:
              type: integer
              minimum: 0
              description: How many months back a request may reach besides the current one. 1 (this month and last month).
        wall:
          type: object
          required: [post, announce, moderate]
          properties:
            post:
              type: boolean
              description: Post, comment, react, praise and run polls. True for every staff login.
            announce:
              type: boolean
              description: Post announcements. True for hr, ceo and super_admin.
            moderate:
              type: boolean
              description: Hide anything, with a reason. True for hr.
        push:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
              description: True only when the server has its FIREBASE_* settings (ADR-0016). Until then notifications go to the server log instead.
        integrity:
          type: object
          required: [required]
          properties:
            required:
              type: boolean
              description: Whether a Play Integrity token is required. False until a Play project exists (ADR-0016).

    RequestType:
      type: string
      enum: [on_duty, fix_a_day, excuse_late, short_leave, leave_cl, leave_lwp, wfh]
      description: |
        on_duty: working away from the branch for the day. fix_a_day: correct a day's attendance. excuse_late: excuse a late arrival. short_leave: short leave, counted in minutes (Phase 2). leave_cl: casual leave. leave_lwp: leave without pay. wfh: work from home, not offered.

    RequestTypePolicy:
      type: object
      description: |
        One request type and its monthly limit, per employee per calendar month (KP, 16 Oct). Today: on_duty no limit; fix_a_day 3; excuse_late 3; short_leave 180 minutes (phase 2); leave_cl 1; leave_lwp no limit set (still open); wfh not offered, limit 0.
      required: [type, offered, limit, unit, phase]
      properties:
        type:
          $ref: '#/components/schemas/RequestType'
        offered:
          type: boolean
          description: False means the type is hidden in the app.
        limit:
          type: [integer, 'null']
          minimum: 0
          description: The monthly limit in `unit`. Null means no limit.
        unit:
          type: string
          enum: [count, minutes]
        phase:
          type: integer
          enum: [1, 2]
          description: The build phase that delivers this type (ADR-0013).

    KeepSignInRequest:
      type: object
      required: [install_id]
      properties:
        install_id:
          $ref: '#/components/schemas/InstallId'
        device_label:
          type: [string, 'null']
          maxLength: 80
          description: The phone's name for the session list. Blank means none.

    InstallId:
      type: string
      pattern: '^[A-Za-z0-9._-]{16,128}$'
      description: Random, made once per install (a uuid will do), kept with the tokens, never shown.

    RefreshToken:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: Opaque, 32 random bytes in base64url. Store it like a password; the ESS keeps only its hash.

    RefreshSessionRequest:
      type: object
      required: [refresh_token, install_id]
      properties:
        refresh_token:
          $ref: '#/components/schemas/RefreshToken'
        install_id:
          $ref: '#/components/schemas/InstallId'

    SignOutRequest:
      type: object
      properties:
        refresh_token:
          $ref: '#/components/schemas/RefreshToken'

    SessionTokens:
      type: object
      required: [session, access_token, access_expires_at, refresh_token, login]
      properties:
        session:
          type: object
          required: [id, expires_at]
          properties:
            id:
              type: string
              format: uuid
              description: The kept sign-in, as GET /ess/sessions lists it. The same at every refresh.
            expires_at:
              type: string
              format: date-time
              description: 90 days from this answer, unless a refresh moves it on.
        access_token:
          type: string
          description: A Scheduler-format token (the portal JWT, or the attendance session) for both hosts, valid for an hour. Read its exp, never anything else from it.
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          $ref: '#/components/schemas/RefreshToken'
        login:
          $ref: '#/components/schemas/Login'

    RefreshRefused:
      type: object
      required: [error, code, reason]
      properties:
        error:
          type: string
          description: A message written for staff. Show it; never parse it.
        code:
          type: string
          const: NOT_AUTHENTICATED
        reason:
          type: string
          enum: [unknown, expired, signed_out, reuse, password_changed, login_off, left, unlinked]

    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionSummary'

    SessionSummary:
      type: object
      required: [id, device_label, created_at, last_used_at, expires_at, current]
      properties:
        id:
          type: string
          format: uuid
        device_label:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
          description: When this phone was signed in.
        last_used_at:
          type: string
          format: date-time
          description: The last refresh.
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: The sign-in the request's own token belongs to.

    SignInResolveRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: What the person typed. Matched exactly for a portal username or login phone, so send it as it will be sent to POST /users/login.

    SignInResolution:
      oneOf:
        - type: object
          title: Portal, as typed, at a branch the person chooses
          required: [kind, login_with, location_names]
          properties:
            kind: { type: string, const: portal }
            login_with: { type: string, const: as_typed }
            location_names:
              type: array
              description: Every branch, in the web's order, the same for every account. Any of them signs this account in.
              items: { type: string }
        - type: object
          title: Portal, with the username or login phone
          required: [kind, login_with]
          properties:
            kind: { type: string, const: portal }
            login_with: { type: string, const: username_or_phone }
        - type: object
          title: Attendance
          required: [kind, methods]
          properties:
            kind: { type: string, const: attendance }
            methods:
              type: array
              items: { type: string, enum: [code, password] }
        - type: object
          title: Nobody, or more than one person
          required: [kind]
          properties:
            kind: { type: string, const: unknown }

    EmployeeCard:
      type: object
      description: Who a row is about, as HR's lists show a person, and nothing else from their record.
      required: [id, full_name, employee_code]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        employee_code:
          type: [string, 'null']

    BranchRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    DataRequestCreate:
      type: object
      required: [kind, details]
      properties:
        kind:
          type: string
          enum: [correct, delete]
        details:
          type: string
          minLength: 5
          maxLength: 2000
          description: 5 to 2,000 characters after trimming.

    DataRequestResolve:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [done, rejected]
        note:
          type: [string, 'null']
          maxLength: 1000
          description: Required for a rejection, at least 3 characters. The employee sees it.

    DataRequest:
      type: object
      description: A request to correct or delete one's data, as its owner sees it.
      required: [id, kind, details, status, created_at, resolved_at, resolution_note]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [correct, delete]
        details:
          type: string
        status:
          type: string
          enum: [open, done, rejected]
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, 'null']
          format: date-time
        resolution_note:
          type: [string, 'null']
          description: HR's answer.

    HrDataRequest:
      type: object
      description: A request as HR sees it, with whose it is and who answered it.
      required: [id, kind, details, status, created_at, resolved_at, resolution_note, resolved_by_name, employee]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [correct, delete]
        details:
          type: string
        status:
          type: string
          enum: [open, done, rejected]
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, 'null']
          format: date-time
        resolution_note:
          type: [string, 'null']
        resolved_by_name:
          type: [string, 'null']
          description: The HR person who answered, by name.
        employee:
          oneOf:
            - $ref: '#/components/schemas/EmployeeCard'
            - type: 'null'
          description: Null only if the record can no longer be read.

    PersonalDetails:
      type: object
      description: Every field, null when not recorded.
      required: [date_of_birth, blood_group, address_line1, address_line2, city, state, pincode, emergency_name, emergency_relation, emergency_phone, updated_at, updated_by_name]
      properties:
        date_of_birth:
          type: [string, 'null']
          format: date
        blood_group:
          type: [string, 'null']
          enum: [A+, A-, B+, B-, AB+, AB-, O+, O-, null]
        address_line1:
          type: [string, 'null']
          maxLength: 200
        address_line2:
          type: [string, 'null']
          maxLength: 200
        city:
          type: [string, 'null']
          maxLength: 80
        state:
          type: [string, 'null']
          maxLength: 80
        pincode:
          type: [string, 'null']
          pattern: '^[1-9][0-9]{5}$'
        emergency_name:
          type: [string, 'null']
          maxLength: 100
        emergency_relation:
          type: [string, 'null']
          maxLength: 50
        emergency_phone:
          type: [string, 'null']
          pattern: '^[6-9][0-9]{9}$'
          description: 10 digits, as stored.
        updated_at:
          type: [string, 'null']
          format: date-time
        updated_by_name:
          type: [string, 'null']
          description: Who last wrote the record, by name.

    MyPersonalUpdate:
      type: object
      description: The fields the employee changes. Any of date_of_birth, address_line1, address_line2, city, state or pincode is 403 SENSITIVE_FIELD; any other field is 400.
      minProperties: 1
      properties:
        blood_group:
          type: [string, 'null']
        emergency_name:
          type: [string, 'null']
          maxLength: 100
        emergency_relation:
          type: [string, 'null']
          maxLength: 50
        emergency_phone:
          type: [string, 'null']
          description: An Indian mobile number, with or without +91, a leading 0, spaces or dashes.

    PersonalDetailsUpdate:
      type: object
      description: Any of the ten fields, for HR. Null or an empty string clears one.
      minProperties: 1
      properties:
        date_of_birth:
          type: [string, 'null']
          format: date
        blood_group:
          type: [string, 'null']
        address_line1:
          type: [string, 'null']
          maxLength: 200
        address_line2:
          type: [string, 'null']
          maxLength: 200
        city:
          type: [string, 'null']
          maxLength: 80
        state:
          type: [string, 'null']
          maxLength: 80
        pincode:
          type: [string, 'null']
        emergency_name:
          type: [string, 'null']
          maxLength: 100
        emergency_relation:
          type: [string, 'null']
          maxLength: 50
        emergency_phone:
          type: [string, 'null']

    EmployeePersonal:
      type: object
      required: [employee, personal]
      properties:
        employee:
          $ref: '#/components/schemas/EmployeeCard'
        personal:
          $ref: '#/components/schemas/PersonalDetails'

    AttendanceDay:
      type: object
      required: [server_now, date, day, note, hr_remark, my_remarks]
      properties:
        server_now:
          type: string
          format: date-time
          description: The server's clock when it answered.
        date:
          type: string
          format: date
        day:
          oneOf:
            - $ref: '#/components/schemas/StoredDay'
            - type: 'null'
          description: Null when nothing is recorded for the day yet.
        note:
          type: [string, 'null']
          description: The note on the day's row (hr_staff_attendance.note).
        hr_remark:
          oneOf:
            - type: object
              required: [remarks, updated_at]
              properties:
                remarks:
                  type: string
                updated_at:
                  type: string
                  format: date-time
            - type: 'null'
          description: HR's remark on the day (hr_attendance_remarks).
        my_remarks:
          type: array
          description: The person's own remarks on the day (hr_attendance_employee_remarks); at most one today.
          items:
            type: object
            required: [day, remarks, updated_at]
            properties:
              day:
                type: string
                format: date
              remarks:
                type: string
              updated_at:
                type: string
                format: date-time

    StoredDay:
      type: object
      description: The day's row as the Scheduler stores it (hr_staff_attendance), without its note.
      required: [status, leave_type, source, first_in, last_out, worked_minutes, late_minutes, early_exit_minutes, late_count, late_half_day, late_excused, shift_start, shift_end]
      properties:
        status:
          $ref: '#/components/schemas/DayStatus'
        leave_type:
          type: [string, 'null']
          description: cl, lwp, leave, or an older free-text type.
        source:
          type: [string, 'null']
          enum: [manual, self_punch, override, auto, null]
        first_in:
          type: [string, 'null']
          format: date-time
        last_out:
          type: [string, 'null']
          format: date-time
        worked_minutes:
          type: [integer, 'null']
        late_minutes:
          type: [integer, 'null']
        early_exit_minutes:
          type: [integer, 'null']
        late_count:
          type: [integer, 'null']
        late_half_day:
          type: boolean
        late_excused:
          type: boolean
        shift_start:
          type: [string, 'null']
          description: HH:MM:SS.
        shift_end:
          type: [string, 'null']
          description: HH:MM:SS.

    MockLocationReportRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          const: punch
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
        accuracy_m:
          type: [number, 'null']
          minimum: 0
          maximum: 1000000
        client_at:
          type: [string, 'null']
          description: The phone's clock, ISO 8601. Unreadable is stored as null.
        provider:
          type: [string, 'null']
          maxLength: 80
        app_version:
          type: [string, 'null']
          maxLength: 40
        install_id:
          type: [string, 'null']
          maxLength: 128

    MockLocationReport:
      type: object
      required: [id, reported_at, client_at, kind, latitude, longitude, accuracy_m, provider, app_version, install_id, employee, branch]
      properties:
        id:
          type: string
          format: uuid
        reported_at:
          type: string
          format: date-time
        client_at:
          type: [string, 'null']
          format: date-time
        kind:
          type: string
          const: punch
        latitude:
          type: [number, 'null']
        longitude:
          type: [number, 'null']
        accuracy_m:
          type: [number, 'null']
        provider:
          type: [string, 'null']
        app_version:
          type: [string, 'null']
        install_id:
          type: [string, 'null']
        employee:
          oneOf:
            - $ref: '#/components/schemas/EmployeeCard'
            - type: 'null'
        branch:
          oneOf:
            - $ref: '#/components/schemas/BranchRef'
            - type: 'null'
          description: Where the person was on their HR record when they reported.

    RegisteredPhone:
      type: object
      required: [id, status, bound_at, last_seen_at, revoked_at, revoked_by_name, revoke_reason, employee, branch]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, revoked]
        bound_at:
          type: string
          format: date-time
          description: When its first accepted punch registered it.
        last_seen_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        revoked_by_name:
          type: [string, 'null']
          description: The username of whoever reset it.
        revoke_reason:
          type: [string, 'null']
        employee:
          oneOf:
            - $ref: '#/components/schemas/EmployeeCard'
            - type: 'null'
        branch:
          oneOf:
            - $ref: '#/components/schemas/BranchRef'
            - type: 'null'
          description: The person's branch on their HR record now.

    DeviceResetRequest:
      type: object
      required: [reason]
      properties:
        branch_id:
          type: string
          format: uuid
        employee_ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
        reason:
          type: string
          minLength: 3
          maxLength: 200

    RequestCancel:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 200
          description: HR's reason; it stays on the request and in the audit trail.

    AttendanceRequest:
      type: object
      description: One attendance request as the employee and the approver read it. `employee` is present in an approver's reply, never in the person's own list.
      required: [id, family, type, status, day, reason, place, fix_in, fix_out, created_at, decided_at, decided_by_name, decision_note, cancelled_at, cancelled_by_name, cancel_reason]
      properties:
        id:
          type: string
          format: uuid
        family:
          type: string
          enum: [attendance]
        type:
          type: string
          enum: [on_duty, fix_a_day, excuse_late]
        status:
          type: string
          enum: [pending, approved, rejected, withdrawn, cancelled]
        day:
          type: string
          format: date
        reason:
          type: string
          minLength: 5
          maxLength: 1000
        place:
          type: [string, 'null']
        fix_in:
          type: [string, 'null']
          pattern: '^\d{2}:\d{2}$'
        fix_out:
          type: [string, 'null']
          pattern: '^\d{2}:\d{2}$'
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time
        decided_by_name:
          type: [string, 'null']
        decision_note:
          type: [string, 'null']
        cancelled_at:
          type: [string, 'null']
          format: date-time
        cancelled_by_name:
          type: [string, 'null']
        cancel_reason:
          type: [string, 'null']
        employee:
          $ref: '#/components/schemas/EmployeeCard'

    LeaveRequest:
      type: object
      description: One leave request as the employee and the approver read it. `employee` is present in an approver's reply, never in the person's own list.
      required: [id, family, type, status, day, reason, created_at, decided_at, decided_by_name, decision_note, cancelled_at, cancelled_by_name, cancel_reason]
      properties:
        id:
          type: string
          format: uuid
        family:
          type: string
          enum: [leave]
        type:
          type: string
          enum: [cl, lwp]
        status:
          type: string
          enum: [pending, approved, rejected, withdrawn, cancelled]
        day:
          type: string
          format: date
        reason:
          type: string
          minLength: 5
          maxLength: 1000
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time
        decided_by_name:
          type: [string, 'null']
        decision_note:
          type: [string, 'null']
        cancelled_at:
          type: [string, 'null']
          format: date-time
        cancelled_by_name:
          type: [string, 'null']
        cancel_reason:
          type: [string, 'null']
        employee:
          $ref: '#/components/schemas/EmployeeCard'

    ApprovalLate:
      type: object
      description: The day's late marks, for the Inbox's context (attendance requests only).
      required: [late_minutes, late_count, late_half_day, late_excused]
      properties:
        late_minutes:
          type: [integer, 'null']
        late_count:
          type: [integer, 'null']
        late_half_day:
          type: boolean
        late_excused:
          type: boolean

    ApprovalContext:
      type: object
      description: What the approver needs beside the request itself (task D1).
      required: [type_this_month, month_limit, late, others_off]
      properties:
        type_this_month:
          type: integer
          minimum: 0
          description: This kind of request the person has this month, pending and approved.
        month_limit:
          type: [integer, 'null']
          description: The month's limit for the type; null means no limit.
        late:
          description: The day's late marks; null for a leave request or a day with no row.
          oneOf:
            - $ref: '#/components/schemas/ApprovalLate'
            - type: 'null'
        others_off:
          type: object
          required: [count, names]
          properties:
            count:
              type: integer
              minimum: 0
            names:
              type: array
              maxItems: 5
              items:
                type: string

    InboxAttendanceRequest:
      type: object
      description: An attendance request in an approver's Inbox, with whose it is and its context.
      required: [id, family, type, status, day, reason, place, fix_in, fix_out, created_at, decided_at, decided_by_name, decision_note, cancelled_at, cancelled_by_name, cancel_reason, employee, context]
      properties:
        id:
          type: string
          format: uuid
        family:
          type: string
          enum: [attendance]
        type:
          type: string
          enum: [on_duty, fix_a_day, excuse_late]
        status:
          type: string
          enum: [pending, approved, rejected, withdrawn, cancelled]
        day:
          type: string
          format: date
        reason:
          type: string
          minLength: 5
          maxLength: 1000
        place:
          type: [string, 'null']
        fix_in:
          type: [string, 'null']
          pattern: '^\d{2}:\d{2}$'
        fix_out:
          type: [string, 'null']
          pattern: '^\d{2}:\d{2}$'
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time
        decided_by_name:
          type: [string, 'null']
        decision_note:
          type: [string, 'null']
        cancelled_at:
          type: [string, 'null']
          format: date-time
        cancelled_by_name:
          type: [string, 'null']
        cancel_reason:
          type: [string, 'null']
        employee:
          $ref: '#/components/schemas/EmployeeCard'
        context:
          $ref: '#/components/schemas/ApprovalContext'

    InboxLeaveRequest:
      type: object
      description: A leave request in an approver's Inbox, with whose it is and its context.
      required: [id, family, type, status, day, reason, created_at, decided_at, decided_by_name, decision_note, cancelled_at, cancelled_by_name, cancel_reason, employee, context]
      properties:
        id:
          type: string
          format: uuid
        family:
          type: string
          enum: [leave]
        type:
          type: string
          enum: [cl, lwp]
        status:
          type: string
          enum: [pending, approved, rejected, withdrawn, cancelled]
        day:
          type: string
          format: date
        reason:
          type: string
          minLength: 5
          maxLength: 1000
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time
        decided_by_name:
          type: [string, 'null']
        decision_note:
          type: [string, 'null']
        cancelled_at:
          type: [string, 'null']
          format: date-time
        cancelled_by_name:
          type: [string, 'null']
        cancel_reason:
          type: [string, 'null']
        employee:
          $ref: '#/components/schemas/EmployeeCard'
        context:
          $ref: '#/components/schemas/ApprovalContext'

    ApprovalCounts:
      type: object
      description: What still waits for this caller, archived ones left out.
      required: [attendance, leave, total]
      properties:
        attendance:
          type: integer
          minimum: 0
        leave:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0

    ApprovalsList:
      type: object
      required: [counts, requests, truncated]
      properties:
        counts:
          $ref: '#/components/schemas/ApprovalCounts'
        requests:
          type: array
          maxItems: 100
          items:
            oneOf:
              - $ref: '#/components/schemas/InboxAttendanceRequest'
              - $ref: '#/components/schemas/InboxLeaveRequest'
        truncated:
          type: boolean

    BalanceLine:
      type: object
      required: [type, offered, unit, phase, allowed, used, pending, remaining]
      properties:
        type:
          $ref: '#/components/schemas/RequestType'
        offered:
          type: boolean
        unit:
          type: string
          enum: [count, minutes]
        phase:
          type: integer
          enum: [1, 2]
        allowed:
          type: [integer, 'null']
        used:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        remaining:
