        '201':
          description: Raised, with its deadlines and its `opened` event already in the thread.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpdeskTicketResult'
              examples:
                raised:
                  value:
                    ticket:
                      id: 'cb100000-0000-4000-8000-000000000001'
                      ref: HD-0001
