    patch:
      operationId: resolveDataRequest
      tags: [ESS]
      x-owner: ess
      summary: Mark a request done or rejected
      description: |
        The roles of `GET /ess/hr/data-requests`. Answers an open request:

        - `status`: `done` or `rejected`. `note`: up to 1,000 characters; required for a rejection (at least 3), because the employee is owed the reason. The employee sees the note.
        - Nobody resolves a request about their own data: 409 `OWN_REQUEST`. Another HR person does.
        - A request already answered, including by somebody else a moment ago, is 409 `ALREADY_RESOLVED`.
        - The resolution is recorded in the ESS's audit trail (`hr_ess_audit`): who, which request, which kind and the outcome, never the details. If that row cannot be written the resolution still stands and the entry goes to the server log.
      parameters:
        - name: id
          in: path
          required: true
          description: The request's `id`. Not a uuid is 400 `VALIDATION_FAILED`.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataRequestResolve'
            examples:
              done:
                value: { status: done, note: Corrected in the HR record. }
      responses:
        '200':
          description: Resolved.
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request:
                    $ref: '#/components/schemas/HrDataRequest'
              examples:
                done:
