    post:
      operationId: punch
      tags: ['Scheduler (existing)']
      x-owner: scheduler
      x-source: 'routes/hr.js:66-74,201; controllers/hr/attendancePunchController.js:68-86,141-175,298-485; services/attendancePunch.js:16-90,104-153'
      summary: Punch in or out
      description: |
        Either token kind. Judged in this order; the first failure answers. Every refusal marked * is stored as a refused attempt, which HR sees, before the reply.
        1. Who: 401, or 403 `NOT_LINKED`, `NOT_ACTIVE`, `NO_ATTENDANCE_LOGIN`.
        2. 403 `PASSWORD_CHANGE_REQUIRED`: a password session still on HR's first-time password.
        3. 400 `VALIDATION_FAILED`: `kind` is not "in" or "out".
        4. 403 `NOT_MOBILE`*: the User-Agent is not a phone's.
        5. The phone: 403 `DEVICE_OTHER_EMPLOYEE`* (registered to someone else), 403 `DEVICE_REVOKED`* (HR reset it), 403 `DEVICE_NOT_REGISTERED`* (no cookie, or an unknown one, while the employee already has a registered phone).
        6. The challenge: 400 `CHALLENGE_MISSING`*, `CHALLENGE_INVALID`* (not genuine, or another employee's), `CHALLENGE_EXPIRED`*; 409 `CHALLENGE_REUSED`* (an accepted punch already used it).
        7. The fix: 422 `LOCATION_MISSING`*; 422 `ACCURACY_LOW`* when `accuracy_m` is above `rules.max_accuracy_m` (100 unless the server says otherwise).
        8. The radius, skipped for geofence-exempt staff: 422 `BRANCH_NOT_CONFIGURED`* (no branch, or no coordinates for it), 422 `OUTSIDE_GEOFENCE`*.
        9. In and out alternate, one session a day: 409 `ALREADY_IN`*, 409 `DAY_DONE`* (already punched out today), 409 `NOT_IN`*.

        Then a phone with no registration becomes the employee's phone (Set-Cookie on the reply), the punch is stored, and the day is rolled up into the daily record.

        Flags are recorded and never refuse: `new_device`, `suspicious_accuracy` (accuracy exactly 0), `exempt_outside`, `off_network`, `possible_proxy`.
      parameters:
        - $ref: '#/components/parameters/DeviceCookie'
        - $ref: '#/components/parameters/PhoneUserAgent'
      requestBody:
