                        minutes: null
                        created_at: '2026-10-14T05:00:00+00:00'
                        decided_at: '2026-10-15T05:00:00+00:00'
                        decided_by_name: Priya Sharma
                        decision_note: The branch closed at 17:30 that day. Ask HR to set it.
                        cancelled_at: null
