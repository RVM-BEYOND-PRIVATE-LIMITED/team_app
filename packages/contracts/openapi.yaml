        The eligible students are those with `batch_students.joined_at` set, whose `admissions.joined` agrees (unless the student has no admissions row at all), and who are not on hold on the day. Each carries only `id`, `full_name` (the student's name), `admission_number`, the day's `marked` state and its absent reason and follow-up. `already_marked` says whether the day has any rows; `can_edit` is false for a teaching role once it has (the lock), and always true for an admin role.
