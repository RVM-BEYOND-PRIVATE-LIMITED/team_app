  /ess/me/personal:
    servers:
      - url: 'https://{essHost}/api'
        description: The ESS, on its own host name (ADR-0019).
        variables:
          essHost:
            default: team-api.rvmcad.org
            description: The ESS's own host name, chosen by KP on 16 Oct 2026 (ADR-0019).
    get:
      operationId: getMyPersonal
      tags: [ESS]
      x-owner: ess
      summary: My date of birth, blood group, address and emergency contact (task E9)
      description: |
        Either token kind, with the checks of `GET /ess/me`. Every field, null where nothing is recorded (all of them, before anything is). These live in the ESS's own table (`hr_ess_personal_details`), not on the HR record.
      responses:
        '200':
          description: My personal details.
          content:
            application/json:
              schema:
                type: object
                required: [personal]
                properties:
                  personal:
                    $ref: '#/components/schemas/PersonalDetails'
              examples:
                recorded:
                  $ref: '#/components/examples/MyPersonalDetails'
        '401':
          $ref: '#/components/responses/EssNotAuthenticated'
        '403':
          $ref: '#/components/responses/EssForbidden'
        '429':
          $ref: '#/components/responses/EssRateLimited'
        '503':
          $ref: '#/components/responses/EssUnavailable'
        default:
          $ref: '#/components/responses/EssUnexpected'
    put:
      operationId: updateMyPersonal
      tags: [ESS]
      x-owner: ess
      summary: Change my blood group or emergency contact
      description: |
        Either token kind, with the checks of `GET /ess/me`. The employee changes four fields: `blood_group`, `emergency_name`, `emergency_relation` and `emergency_phone`. Sending any of `date_of_birth`, `address_line1`, `address_line2`, `city`, `state` or `pincode`, even as null, is 403 `SENSITIVE_FIELD`: HR changes those.

        - Fields not sent stay as they are; null or an empty string clears one. At least one field is needed (400 `VALIDATION_FAILED`).
        - `blood_group`: A+, A-, B+, B-, AB+, AB-, O+ or O-, in any case and spacing (stored as written here).
        - `emergency_phone`: an Indian mobile number; +91, a leading 0, spaces and dashes are taken and removed, and the 10 digits are stored.
        - The contact as a whole: a name and a phone together or neither, and a relation only with a name.
        - Only the fields sent are written, so a save never puts back a field somebody else changed meanwhile. If a save made in between leaves the contact half there with this one, nothing is written: 409 `RECORD_CHANGED`; read the record again.
        - The answer is the record as stored, stamped with who wrote it, with any change made meanwhile.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyPersonalUpdate'
            examples:
              contact:
                value: { blood_group: b+, emergency_name: Sunita Yadav, emergency_relation: Mother, emergency_phone: '+91 98765 43210' }
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                type: object
                required: [personal]
                properties:
                  personal:
                    $ref: '#/components/schemas/PersonalDetails'
        '400':
          $ref: '#/components/responses/EssBadPersonalDetails'
        '401':
          $ref: '#/components/responses/EssNotAuthenticated'
        '403':
          description: |
            - `SENSITIVE_FIELD`: a date of birth or an address field was sent. Ask HR.
            - `NOT_AN_EMPLOYEE`, `NOT_LINKED`, `NOT_ACTIVE`, `NO_ATTENDANCE_LOGIN`, `PASSWORD_CHANGE_REQUIRED`: as for `GET /ess/me`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                sensitive:
                  value: { error: Ask HR to change your date of birth or address., code: SENSITIVE_FIELD }
                notAnEmployee:
                  $ref: '#/components/examples/EssNotAnEmployee'
                notLinked:
                  $ref: '#/components/examples/EssNotLinked'
                notActive:
                  $ref: '#/components/examples/EssNotActive'
                noAttendanceLogin:
                  $ref: '#/components/examples/EssNoAttendanceLogin'
                passwordChangeRequired:
                  $ref: '#/components/examples/EssPasswordChangeRequired'
        '409':
          description: '`RECORD_CHANGED`: somebody else saved this record between this save''s read and its write, and the two together would leave half an emergency contact. Nothing was written: read the record again and retry.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                changed:
                  value: { error: Somebody else changed this record while you were saving. Open it again and try once more., code: RECORD_CHANGED }
        '429':
          $ref: '#/components/responses/EssRateLimited'
        '503':
          $ref: '#/components/responses/EssUnavailable'
        default:
          $ref: '#/components/responses/EssUnexpected'

