  /ess/hr/devices/reset:
    servers:
      - url: 'https://{essHost}/api'
        description: The ESS, on its own host name (ADR-0019).
        variables:
          essHost:
            default: team-api.rvmcad.org
            description: The ESS's own host name, chosen by KP on 16 Oct 2026 (ADR-0019).
    post:
      operationId: resetDevices
      tags: [ESS]
      x-owner: ess
      summary: Reset the registered phones of a branch or of a list of people (task B8)
      description: |
        The roles of `GET /ess/hr/devices` (`hr`, `ceo`, `super_admin`, from a portal login: the reset records the `users.id` that made it). Moves people to a new phone at go-live, branch by branch (decision 11).

        Every **active** phone of the people named gets exactly the update the Scheduler's own reset makes (`POST /hr/attendance-admin/devices/{id}/revoke`): status `revoked`, `revoked_at`, `revoked_by`, `revoked_by_name` (the caller's username, or "unknown") and `revoke_reason`. A phone already reset is left as it is. After the reset the person's next accepted punch registers whichever phone they punch from; the reset phone can never punch again. It is the one write the ESS makes to a Scheduler table.

        - Exactly one of `branch_id` (everybody whose HR record is at that branch, leavers included) or `employee_ids` (1 to 500 uuids; repeats and ids nobody has are skipped). Not both, not neither.
        - `reason`: 3 to 200 characters, shown in the phone list and the Scheduler's.
        - The body may be up to 32 kB, for a list of 500 ids.
        - Recorded in `hr_ess_audit`: who, the branch, how many people were asked about, which phones were reset and the reason. If that row cannot be written the reset still stands and the entry goes to the server log.
        - The phones are reset 150 people at a time. If the database fails part-way the answer is 503, the phones already reset stay reset, and they are recorded all the same, marked incomplete. Send the same request again: it resets the rest, and skips those already done.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceResetRequest'
            examples:
              branch:
                value: { branch_id: 1c7e9a2b-3d4f-4a5b-8c6d-0e1f2a3b4c5d, reason: Moving Faridabad to the Team RVM app }
              people:
                value: { employee_ids: [2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e], reason: New phone }
      responses:
        '200':
          description: How many phones were reset, and which. 0 when nobody had an active phone.
          content:
            application/json:
              schema:
                type: object
                required: [reset, device_ids]
                properties:
                  reset:
                    type: integer
                    minimum: 0
                  device_ids:
                    type: array
                    items:
                      type: string
                      format: uuid
              examples:
                two:
                  value:
                    reset: 2
                    device_ids: [6f5e4d3c-2b1a-4098-8f7e-6d5c4b3a2f1e, 7a6b5c4d-3e2f-4a1b-9c0d-8e7f6a5b4c3d]
        '400':
          description: |
            `VALIDATION_FAILED`: the message says which rule. `INVALID_JSON`, `BAD_REQUEST`: a body the ESS cannot read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                target:
                  value: { error: 'Send either branch_id or employee_ids (1 to 500 employee ids), not both.', code: VALIDATION_FAILED }
                reason:
                  value: { error: 'Say why the phones are being reset, in 3 to 200 characters.', code: VALIDATION_FAILED }
                branch:
                  $ref: '#/components/examples/EssBranchId'
                unknownField:
                  $ref: '#/components/examples/EssUnknownField'
        '401':
          $ref: '#/components/responses/EssNotAuthenticated'
        '403':
          $ref: '#/components/responses/EssAttendanceHrForbidden'
        '404':
          $ref: '#/components/responses/EssBranchNotFound'
        '429':
          $ref: '#/components/responses/EssRateLimited'
        '503':
          $ref: '#/components/responses/EssUnavailable'
        default:
          $ref: '#/components/responses/EssUnexpected'

