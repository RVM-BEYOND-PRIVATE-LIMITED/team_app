        variables:
          essHost:
            default: team-api.rvmcad.org
            description: The ESS's own host name, chosen by KP on 16 Oct 2026 (ADR-0019).
    post:
      operationId: resolveSignIn
      tags: [ESS]
      x-owner: ess
      summary: Which sign-in the one sign-in field holds (task A5)
      description: |
        No token. The one field takes a phone number, email, employee code or username (decision 4). This says which of the Scheduler's two sign-ins to use; the password or code itself still goes to the Scheduler.

        - `{ kind: portal, login_with: as_typed, location_names }`: a portal login whose username or login phone is exactly what was typed. Send it, exactly as sent here, as `username` to `POST /users/login`, with the branch the person chooses from `location_names` as `locationName`, as the web's dropdown offers them. Every portal login gets every branch, whatever its role or branch, so the answer says nothing about either; the app may remember the person's last choice on the phone.
        - `{ kind: portal, login_with: username_or_phone }`: a portal login found by its email, or by the employee code, main phone or email on the person's HR record. The portal login takes only a username or login phone: ask for one, then ask here again.
        - `{ kind: attendance, methods }`: an attendance login found by the employee code, main phone or email on the HR record, compared as the attendance sign-in compares them. `code`: a sign-in code can be sent (`POST /hr/my-attendance/otp/request`, with the main phone or the email); `password`: a password exists, the person's own or one HR gave (`POST /hr/my-attendance/password-login`). No methods: the login is switched off or not made yet; send the person to HR.
        - `{ kind: unknown }`: nobody, or more than one person. The same answer, after the same database reads, whatever the reason.

        A person with both kinds of login is answered portal. A login that is not a staff account (the connector identity), not linked to anybody's HR record (a desk login), or belongs to somebody who has left, is not offered. Nothing identifying comes back: no ids, usernames, phones, emails, roles or branches.

        Limited per address (40 in 15 minutes, as the Scheduler's attendance sign-in) and per identifier from any address (10 in 15 minutes; every spelling of one mobile number is one identifier).
