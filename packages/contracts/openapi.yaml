openapi: 3.1.0

info:
  title: Team RVM API
  version: 0.1.0
  summary: Every endpoint the Team RVM Android app calls, new and existing, in one file.
  description: |
    The one contract the Team RVM app is built against (ADR-0010). Two services, on two hosts, answer the app, and every operation says which one owns it, with its tag and with `x-owner`.

    ## Who owns what

    | Tag | `x-owner` | Served by | Base URL | What this file promises |
    | --- | --- | --- | --- | --- |
    | **ESS** | `ess` | team_app (`apps/ess-api`), its own process on its own host name (ADR-0019) | `https://<ESS host>/api`, so its paths start `/api/ess` | How the new employee self-service API behaves. Changing it is a team_app PR that updates this file in the same PR. |
    | **Scheduler (existing)** | `scheduler` | Scheduler_Backend, the live system of record | `https://scheduler.rvmcad.org/api` | How the Scheduler's code behaves at commit `c28b9ca` (15 Oct 2026), exactly as it is. Nothing here implies a change: Team RVM changes nothing in the Scheduler (ADR-0018). `POST /users/reset-password` is listed only so the app never calls it. |

    The ESS host name is not chosen yet: KP picks it and adds the DNS record (ADR-0019). The server variable `essHost` holds the ADR's example, `team-api.rvmcad.org`.

    The app calls the Scheduler directly for sign-in and punching (ADR-0006). The ESS never relays a Scheduler call, and one sign-in token works on both hosts. The punch cookie belongs to the Scheduler's host.

    ## Rules that hold everywhere

    - **Errors** are JSON: `{ "error": "<message written for staff>", "code": "UPPER_SNAKE" }`. Show `error` as it is and decide on `code`, never on the text, which may be reworded. Every ESS error has a `code`. Some Scheduler errors have none, and each response below says which.
    - **Days** are IST (`Asia/Kolkata`) dates, `YYYY-MM-DD`, and turn over at IST midnight. **Instants** are ISO 8601 with an offset (the Scheduler often sends `+00:00`); always parse the offset.
    - **Requests** send `Content-Type: application/json` and `Authorization: Bearer <token>`, spelt exactly so: the Scheduler removes only `Bearer ` with a capital B and one space.

    ## When to sign out

    Sign out only when a reply says the token itself is finished:
    - **ESS:** 401 with code `NOT_AUTHENTICATED`. The ESS answers 401 for nothing else, and never for a database outage (that is 503 `UNAVAILABLE`).
    - **Scheduler:** 401 whose `error` is exactly "No token provided" or "Please authenticate" (these two carry no code), or 401 with code `NOT_AUTHENTICATED`.

    Every other 401 means something else, for example "Invalid password" at sign-in.

    **Check once before signing out on "Please authenticate".** The Scheduler sends it for a bad or expired token, and also when its own database lookup fails. Call `GET /ess/me` with the same token and sign out only if that answers 401 `NOT_AUTHENTICATED`. Any other answer (200, 403, 429, 503, no answer, or a reply that is not JSON) means keep the session and say that something went wrong. A token whose `exp` claim has passed is finished whatever a server says; the app may read `exp` from the token without verifying it.

    ## Replies that are not JSON

    - nginx answers 502 or 504 with an HTML page while either process restarts or is down.
    - The Scheduler answers an unknown `GET` path with **200 and the web app's HTML page** (its catch-all, `server.js:212-220`), and an unknown path for any other method with a 404 HTML page. That includes an ESS path sent to the Scheduler's host by mistake: `/api/ess` is not on `scheduler.rvmcad.org`.
    - The Scheduler answers malformed JSON with Express's default 400 HTML page, and a body over 100 kB with a 413 HTML page: `server.js` has no JSON error handler.

    Treat any reply whose `Content-Type` is not `application/json` as "the server is restarting": never as success, and never as a reason to sign out. The ESS itself always answers JSON, including 404 `NOT_FOUND` for an address it does not have.

    ## Rate limits

    - **Scheduler:** counted per IP address, so a whole office on one Wi-Fi shares every bucket. All of `/api` allows 300 requests a minute; the sign-in routes have tighter buckets, listed on each operation. Its 429 bodies carry no code, except the attendance sign-in bucket's `RATE_LIMITED` and the refusals each operation names. Replies carry `RateLimit-Policy`, `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset` (IETF draft 6) from the last bucket that counted the request, and a 429 carries `Retry-After` in seconds. The buckets live in memory, so they also reset when the Scheduler restarts.
    - **ESS:** 600 requests a minute per IP address on every path, counted before the token is checked, and 120 a minute per employee after it. A 429 has code `RATE_LIMITED`, with the same draft-6 headers and `Retry-After`.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://scheduler.rvmcad.org/api
    description: The Scheduler, in production (the only environment), for every path here except /ess/*. Each ESS path names its own server.

security:
  - bearer: []

tags:
  - name: ESS
    description: |
      New employee self-service endpoints, served by team_app (`apps/ess-api`) as its own process on its own host name, under `/api/ess`. Every operation here has `x-owner: ess`.
  - name: Scheduler (existing)
    description: |
      Endpoints of the live Scheduler (Scheduler_Backend) that the app calls directly, documented exactly as they behave at commit `c28b9ca`, with no change implied. Every operation here has `x-owner: scheduler`. Team RVM changes nothing in the Scheduler (ADR-0018); if the Scheduler ever changes one of these on its own, this file is updated to match.

paths:

  # ════════════════════════════ ESS ════════════════════════════

  /ess/health:
    servers:
      - url: 'https://{essHost}/api'
        description: The ESS, on its own host name (ADR-0019).
        variables:
          essHost:
            default: team-api.rvmcad.org
            description: Not chosen yet. KP picks the name and adds the DNS record (ADR-0019); team-api.rvmcad.org is the ADR's example.
    get:
      operationId: getHealth
      tags: [ESS]
      x-owner: ess
      summary: Check the ESS, the server clock and the allowed app versions
      description: |
        No token. Call it when the app starts and when it comes back to the foreground.

        - `server_time` is the server's clock. Punch times are always the server's, so warn the person when the phone's clock is far off.
        - `min_app_version`: an app older than this must update before it goes on. `latest_app_version`: an app older than this may offer an update. Either is null when it is not set.
        - `db` comes from a cheap read with a short timeout. When the read fails the answer is still 200, with `db: "unavailable"`; the endpoints behind a token then answer 503 `UNAVAILABLE` until it recovers.
        - It still answers when the ESS is switched off (`ESS_ENABLED=false`), so the version check keeps working; the endpoints behind a token then answer 503 `MODULE_DISABLED`.
      security: []
      responses:
        '200':
          description: The ESS is running. Look at `db` before relying on the endpoints behind it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                healthy:
                  summary: Everything up
                  value:
                    ok: true
                    server_time: '2026-10-16T04:30:00.000Z'
                    version: 0.1.0
                    min_app_version: 1.0.0
                    latest_app_version: 1.2.0
                    db: ok
                databaseDown:
                  summary: The database check failed
                  value:
                    ok: true
                    server_time: '2026-10-16T04:30:00.000Z'
                    version: 0.1.0
                    min_app_version: null
                    latest_app_version: null
                    db: unavailable
        '429':
          $ref: '#/components/responses/EssRateLimited'
        default:
          $ref: '#/components/responses/EssUnexpected'
      x-notes:
        - >-
          Call the ESS host, never scheduler.rvmcad.org: there this path reaches the Scheduler's catch-all, which answers 200 with an HTML page. Trust the reply only when Content-Type is application/json and ok is true.
        - >-
          A 502 or 504 HTML page comes from nginx: the ESS is restarting or down. Keep the session and try again later.
        - >-
          Compare versions as semver (1.10.0 is newer than 1.9.0), never as strings.

  /ess/me:
    servers:
      - url: 'https://{essHost}/api'
        description: The ESS, on its own host name (ADR-0019).
        variables:
          essHost:
            default: team-api.rvmcad.org
            description: Not chosen yet. KP picks the name and adds the DNS record (ADR-0019); team-api.rvmcad.org is the ADR's example.
    get:
      operationId: getMe
      tags: [ESS]
      x-owner: ess
      summary: Who is signed in
      description: |
        Either token kind. Returns the caller's HR record and the login they used.

        The caller is found in this order, and the first failure answers:
        1. **The token.** No token, a bad signature, an expired token or a wrong algorithm: 401 `NOT_AUTHENTICATED`. A valid token that is not a staff login (a student token, an admission-undertaking token, anything else signed with `JWT_SECRET`): 403 `NOT_AN_EMPLOYEE`.
        2. **The HR record.** A portal login is matched to its HR record through `hr_employees.user_id`; none linked is 403 `NOT_LINKED`. Before that, its account must be a staff one: the connector account (role `bot_readonly`) is 403 `NOT_AN_EMPLOYEE`. An attendance session names its employee directly.
        3. **Still employed.** Archived, `employment_status` "exited", or a `date_of_exit` before today (IST): 403 `NOT_ACTIVE`. This is the Scheduler's punch rule (`controllers/hr/attendancePunchController.js:88-129`): someone on notice stays active up to and including their last working day.
        4. **Attendance session only.** The attendance login is missing or switched off: 403 `NO_ATTENDANCE_LOGIN`. The session was issued before the login's `sessions_valid_from`, because a password was set or reset since: 401 `NOT_AUTHENTICATED`. The switch-off is checked first, so a switched-off login answers 403 even though its old sessions also predate the cut-off (`services/attendanceAccounts.js:39-53`).

        A token whose account has since been deleted (the `users` row, or the attendance session's employee row) counts as rejected: 401 `NOT_AUTHENTICATED`, as on the Scheduler.

        Before any of this, every request passes the per-IP limit (429 `RATE_LIMITED`) and the ESS switch (503 `MODULE_DISABLED`); the per-employee limit comes after step 4.

        Everything is read again on every request, so an exit, a new manager or a new role shows on the next call, without signing in again.
      responses:
        '200':
          description: The caller's HR record and login.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                portalLogin:
                  summary: A faculty member signed in with a portal login
                  value:
                    employee:
                      id: 9b2f4c1e-5a3d-4e8f-9c21-7d6e5f4a3b2c
                      full_name: Ravi Kumar
                      employee_code: RVM-0142
                      designation: Faculty, AutoCAD
                      employment_status: active
                      branch:
                        id: 1c7e9a2b-3d4f-4a5b-8c6d-0e1f2a3b4c5d
                        name: Faridabad
                      department:
                        id: 5e6f7a8b-9c0d-4e1f-a2b3-c4d5e6f7a8b9
                        name: CAD
                      manager:
                        id: 0a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                        full_name: Neha Singh
                    login:
                      kind: portal
                      role: faculty
                      user_id: 6d5c4b3a-2f1e-4d0c-9b8a-7f6e5d4c3b2a
                attendanceSession:
                  summary: A member of staff with no portal login, on an attendance session
                  value:
                    employee:
                      id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                      full_name: Suresh Yadav
                      employee_code: RVM-0217
                      designation: Office Assistant
                      employment_status: notice_period
                      branch:
                        id: 1c7e9a2b-3d4f-4a5b-8c6d-0e1f2a3b4c5d
                        name: Faridabad
                      department: null
                      manager: null
                    login:
                      kind: attendance
                      role: null
                      user_id: null
        '401':
          $ref: '#/components/responses/EssNotAuthenticated'
        '403':
          $ref: '#/components/responses/EssForbidden'
        '429':
          $ref: '#/components/responses/EssRateLimited'
        '503':
          $ref: '#/components/responses/EssUnavailable'
        default:
          $ref: '#/components/responses/EssUnexpected'
      x-notes:
        - >-
          This is the check to make before signing out on the Scheduler's "Please authenticate": sign out only if this answers 401 NOT_AUTHENTICATED.
        - >-
          login.role is the role on the users row as it is now, not the claim inside the token, so a role change shows without signing in again.
        - >-
          Decide what to show from GET /ess/me/capabilities, never from login.role.
        - >-
          NOT_LINKED here matches the Scheduler's GET /hr/my-attendance answering linked: false. HR fixes both with one link (hr_employees.user_id).

  /ess/me/capabilities:
    servers:
      - url: 'https://{essHost}/api'
        description: The ESS, on its own host name (ADR-0019).
        variables:
          essHost:
            default: team-api.rvmcad.org
            description: Not chosen yet. KP picks the name and adds the DNS record (ADR-0019); team-api.rvmcad.org is the ADR's example.
    get:
      operationId: getMyCapabilities
      tags: [ESS]
      x-owner: ess
      summary: What the signed-in person may see and do
      description: |
        Either token kind, with the same checks as `GET /ess/me`. The app draws its tabs, sections and approval screens from this answer and never works the rules out for itself.

        The rules (KP, 16 Oct 2026; `docs/03-decisions.md`):

        | Role | `sections.work` | `approvals.any_request` | `approvals.hr_scope` | `wall.announce` | `wall.moderate` |
        | --- | --- | --- | --- | --- | --- |
        | faculty, hod, hod_placement, hoo | true | false | none | false | false |
        | ceo, super_admin | true | true | none | true | false |
        | admin, admin_manager, accounts_admin | false | false | none | false | false |
        | hr | false | true | attendance, documents, profile_changes, helpdesk_hr | true | true |
        | hr_executive | false | false, always | documents, profile_changes, helpdesk_hr | false | false |
        | attendance-only staff (no portal role) | false | false | none | false | false |

        For every staff login:
        - `tabs` holds all five, and `sections.time`, `sections.helpdesk`, `sections.documents` and `sections.profile` are true.
        - `team.direct_reports` counts the active employees (active by the `NOT_ACTIVE` rule) whose `manager_id` is the caller. `team.has_reports` and `approvals.own_reports` are true when it is above 0.
        - `approvals.request_types` lists every offered request type when `any_request` or `own_reports` is true, and is empty otherwise. This holds for an hr_executive with direct reports too.
        - An attendance session carries no portal role, so it gets the attendance-only row whatever role the person's portal account has.
        - `requests` comes from the one policy module the request endpoints will enforce, so the numbers here are the numbers that apply.
        - `wall.post` is true.
        - `push.enabled` is true only when the server has its `FIREBASE_*` settings (ADR-0016); until then notifications are written to the server log, not sent. `integrity.required` is false: there is no Play project yet, so no Play Integrity token is asked for.
      responses:
        '200':
          description: What this person may see and do.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
              examples:
                facultyWithReports:
                  summary: A faculty member with two direct reports
                  value:
                    tabs: [home, inbox, wall, me, team]
                    sections:
                      time: true
                      helpdesk: true
                      documents: true
                      profile: true
                      work: true
                    team:
                      has_reports: true
                      direct_reports: 2
                    approvals:
                      own_reports: true
                      any_request: false
                      request_types: [on_duty, fix_a_day, excuse_late, short_leave, leave_cl, leave_lwp]
                      hr_scope: []
                    requests:
                      types:
                        - { type: on_duty, offered: true, limit: null, unit: count, phase: 1 }
                        - { type: fix_a_day, offered: true, limit: 3, unit: count, phase: 1 }
                        - { type: excuse_late, offered: true, limit: 3, unit: count, phase: 1 }
                        - { type: short_leave, offered: true, limit: 180, unit: minutes, phase: 2 }
                        - { type: leave_cl, offered: true, limit: 1, unit: count, phase: 1 }
                        - { type: leave_lwp, offered: true, limit: null, unit: count, phase: 1 }
                        - { type: wfh, offered: false, limit: 0, unit: count, phase: 1 }
                      payroll_cutoff_day: 5
                      reach_back_months: 1
                    wall:
                      post: true
                      announce: false
                      moderate: false
                    push:
                      enabled: false
                    integrity:
                      required: false
                hr:
                  summary: HR, with no direct reports
                  value:
                    tabs: [home, inbox, wall, me, team]
                    sections:
                      time: true
                      helpdesk: true
                      documents: true
                      profile: true
                      work: false
                    team:
                      has_reports: false
                      direct_reports: 0
                    approvals:
                      own_reports: false
                      any_request: true
                      request_types: [on_duty, fix_a_day, excuse_late, short_leave, leave_cl, leave_lwp]
                      hr_scope: [attendance, documents, profile_changes, helpdesk_hr]
                    requests:
                      types:
                        - { type: on_duty, offered: true, limit: null, unit: count, phase: 1 }
                        - { type: fix_a_day, offered: true, limit: 3, unit: count, phase: 1 }
                        - { type: excuse_late, offered: true, limit: 3, unit: count, phase: 1 }
                        - { type: short_leave, offered: true, limit: 180, unit: minutes, phase: 2 }
                        - { type: leave_cl, offered: true, limit: 1, unit: count, phase: 1 }
                        - { type: leave_lwp, offered: true, limit: null, unit: count, phase: 1 }
                        - { type: wfh, offered: false, limit: 0, unit: count, phase: 1 }
                      payroll_cutoff_day: 5
                      reach_back_months: 1
                    wall:
                      post: true
                      announce: true
                      moderate: true
                    push:
                      enabled: false
                    integrity:
                      required: false
                attendanceOnly:
                  summary: Attendance-only staff with no direct reports
                  value:
                    tabs: [home, inbox, wall, me, team]
                    sections:
                      time: true
                      helpdesk: true
                      documents: true
                      profile: true
                      work: false
                    team:
                      has_reports: false
                      direct_reports: 0
                    approvals:
                      own_reports: false
                      any_request: false
                      request_types: []
                      hr_scope: []
                    requests:
                      types:
                        - { type: on_duty, offered: true, limit: null, unit: count, phase: 1 }
                        - { type: fix_a_day, offered: true, limit: 3, unit: count, phase: 1 }
                        - { type: excuse_late, offered: true, limit: 3, unit: count, phase: 1 }
                        - { type: short_leave, offered: true, limit: 180, unit: minutes, phase: 2 }
                        - { type: leave_cl, offered: true, limit: 1, unit: count, phase: 1 }
                        - { type: leave_lwp, offered: true, limit: null, unit: count, phase: 1 }
                        - { type: wfh, offered: false, limit: 0, unit: count, phase: 1 }
                      payroll_cutoff_day: 5
                      reach_back_months: 1
                    wall:
                      post: true
                      announce: false
                      moderate: false
                    push:
                      enabled: false
                    integrity:
                      required: false
        '401':
          $ref: '#/components/responses/EssNotAuthenticated'
        '403':
          $ref: '#/components/responses/EssForbidden'
        '429':
          $ref: '#/components/responses/EssRateLimited'
        '503':
          $ref: '#/components/responses/EssUnavailable'
        default:
          $ref: '#/components/responses/EssUnexpected'
      x-notes:
        - >-
          Fetch it after every sign-in and when the app comes back to the foreground: a new role, a new report or an exit changes it without a new token.
        - >-
          Hide a request type whose offered is false (work from home today). The limits are per employee per calendar month; null means no limit.

  # ═══════════════════ Scheduler: portal sign-in ═══════════════════

  /users/login:
    post:
      operationId: signInPortal
      tags: ['Scheduler (existing)']
      x-owner: scheduler
      x-source: 'routes/user.js:25; controllers/userController.js:263-538; server.js:60-66,119,125'
      summary: Sign in with a portal login
      description: |
        No token. For people with a portal login (a `users` row). Answers with the portal JWT, or with a two-factor challenge when the account has two-factor on.

        How the account is found:
        1. `locationName` must be a branch name the Scheduler knows, or the answer is 404 "Location not found.".
        2. Every account whose username or login phone is exactly `username` is a candidate. None: 404 "User not found. Please check your credentials.".
        3. A single candidate wins. Otherwise the one at the chosen branch, then the one with no branch (HR, the CEO and the like), then a role that sees every branch. Still undecided: the password decides, and if it cannot, 409.
        4. The password is checked. If it is wrong for the chosen account but right for exactly one other candidate, that account signs in instead. Otherwise 401 "Invalid password".
        5. Two-factor on, with a verified email: 200 with a challenge, and the token comes from `POST /users/login/verify`.

        The token lasts 64 hours and cannot be refreshed. Neither a password change nor leaving the company ends it on the Scheduler, and changing that is out of scope (ADR-0018). The ESS refuses an employee who has left (403 `NOT_ACTIVE`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalLoginRequest'
            examples:
              byUsername:
                summary: Username and branch
                value:
                  username: ravi.kumar
                  password: correct horse battery
                  locationName: Faridabad
      responses:
        '200':
          description: Signed in, or a two-factor challenge to finish at `POST /users/login/verify`. Tell them apart by `two_factor_required`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PortalSession'
                  - $ref: '#/components/schemas/TwoFactorChallenge'
              examples:
                signedIn:
                  summary: Signed in
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.PAYLOAD.SIGNATURE
                    user:
                      userId: 6d5c4b3a-2f1e-4d0c-9b8a-7f6e5d4c3b2a
                      username: ravi.kumar
                      role: faculty
                      locationId: 1
                      locationName: Faridabad
                twoFactor:
                  summary: Right password; the account wants the emailed code too
                  value:
                    two_factor_required: true
                    challenge_id: 4a3b2c1d-0e9f-4a8b-9c7d-6e5f4a3b2c1d
                    sent_to: ra•••@rvmcad.org
                    expires_at: '2026-10-16T04:40:00.000+00:00'
                    location_name: Faridabad
        '400':
          description: |
            - "Username, password, and locationName are required" (no code): one of the three is missing or empty.
            - An HTML page, not JSON: the body is not valid JSON (Express's default handler).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                missingField:
                  value:
                    error: Username, password, and locationName are required
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlPage'
        '401':
          description: |
            "Invalid password" (no code): the identifier is known and the password is wrong. This is a failed sign-in, not a session ending: there is no session yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                wrongPassword:
                  value:
                    error: Invalid password
        '403':
          description: |
            "This account cannot sign in. It is a connector identity, not a login." (no code): the reporting bot's account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                connector:
                  value:
                    error: This account cannot sign in. It is a connector identity, not a login.
        '404':
          description: |
            No code on either:
            - "Location not found.": `locationName` is not a branch the Scheduler knows. Also what a database outage looks like here, because the branch is looked up first.
            - "User not found. Please check your credentials.": no account has that username or login phone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                unknownBranch:
                  value:
                    error: Location not found.
                unknownAccount:
                  value:
                    error: User not found. Please check your credentials.
        '409':
          description: |
            "More than one account answers to that name. ..." (no code): several accounts share the identifier, and neither the branch nor the password picks one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                ambiguous:
                  value:
                    error: More than one account answers to that name. Select the branch it belongs to, or ask an administrator to give it a distinct username.
        '429':
          description: |
            No code on either:
            - "Too many login attempts. Please try again in 15 minutes.": 20 requests in 15 minutes from this IP address, successes included, in a bucket shared with `POST /users/login/verify`.
            - "Too many requests. Please slow down.": 300 requests in a minute from this IP address, across all of `/api`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                loginBucket:
                  $ref: '#/components/examples/LoginRateLimited'
                apiBucket:
                  $ref: '#/components/examples/ApiRateLimited'
        '500':
          description: '"Internal server error" (no code): an unexpected failure, for example the account lookup failing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                unexpected:
                  value:
                    error: Internal server error
        '502':
          description: |
            `MAIL_FAILED`: the password was right and two-factor is on, but the email with the code could not be sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                mailFailed:
                  value:
                    error: 'Two-factor is on for this account but the code could not be sent: The code could not be sent: ZeptoMail answered 500.'
                    code: MAIL_FAILED
        '503':
          description: |
            The password was right and two-factor is on, but no code can be sent:
            - `MAIL_NOT_CONFIGURED`: email is not set up on the server.
            - `TWO_FACTOR_UNAVAILABLE`, or a database error code, when the challenge could not be stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                mailNotConfigured:
                  value:
                    error: 'Two-factor is on for this account but the code could not be sent: Codes are sent by email, and email is not configured on this server yet (missing ZEPTOMAIL_API_TOKEN). Ask whoever runs the server to set ZEPTOMAIL_API_TOKEN and EMAIL_FROM_ADDRESS.'
                    code: MAIL_NOT_CONFIGURED
                challengeNotStored:
                  summary: The database could not be reached while storing the challenge
                  value:
