  /ess/attendance/day:
    servers:
      - url: 'https://{essHost}/api'
        description: The ESS, on its own host name (ADR-0019).
        variables:
          essHost:
            default: team-api.rvmcad.org
            description: The ESS's own host name, chosen by KP on 16 Oct 2026 (ADR-0019).
    get:
      operationId: getMyAttendanceDay
      tags: [ESS]
      x-owner: ess
      summary: One of my days, with the server's clock, the day's note and HR's remark (task B1)
      description: |
        Either token kind, with the checks of `GET /ess/me`. What the Scheduler's `GET /hr/my-attendance` does not send: the server's clock, the note on the day (an override's reason, "No punch", a holiday's name), HR's remark on the day, and the person's own remarks. Always the caller's own day: there is no employee parameter.

        - `date`: YYYY-MM-DD, given once; today (IST) when left out. Any day from the 1st of last month to the last day of this month (IST): the window the person can write a remark in, to the month's end. Outside it: 400 `DAY_OUT_OF_RANGE`. Not a real day: 400 `VALIDATION_FAILED`.
        - `day` is the stored row as the Scheduler keeps it, or null when nothing is recorded for the day yet.
        - `server_now`: the moment of the answer, to tell how far off the phone's clock is.
        - The tables come with the Scheduler's migrations 20261015000004 to 20261023000000; a missing table or column is 503 `MODULE_NOT_INSTALLED`, never a day that looks empty.
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
            examples:
              - '2026-10-15'
      responses:
        '200':
          description: The day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceDay'
              examples:
                lateDay:
                  value:
                    server_now: '2026-10-16T06:30:00.000Z'
                    date: '2026-10-15'
                    day:
                      status: present
                      leave_type: null
                      source: self_punch
                      first_in: '2026-10-15T04:20:00+00:00'
                      last_out: '2026-10-15T12:40:00+00:00'
                      worked_minutes: 500
                      late_minutes: 20
                      early_exit_minutes: 20
                      late_count: 1
                      late_half_day: false
                      late_excused: false
                      shift_start: '09:30:00'
                      shift_end: '18:30:00'
                    note: Bus was late
                    hr_remark:
                      remarks: Spoke to him about the bus.
                      updated_at: '2026-10-15T09:00:00+00:00'
                    my_remarks:
                      - day: '2026-10-15'
                        remarks: The bus broke down.
                        updated_at: '2026-10-15T05:00:00+00:00'
                nothingYet:
                  value:
                    server_now: '2026-10-16T06:30:00.000Z'
                    date: '2026-10-16'
                    day: null
                    note: null
                    hr_remark: null
                    my_remarks: []
        '400':
          description: |
            - `DAY_OUT_OF_RANGE`: a day before the 1st of last month or after the end of this month.
            - `VALIDATION_FAILED`: `date` is not a real day written YYYY-MM-DD, or is given more than once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                outOfRange:
                  value: { error: You can look at a day of this month or last month., code: DAY_OUT_OF_RANGE }
                format:
                  $ref: '#/components/examples/EssDateFormat'
        '401':
          $ref: '#/components/responses/EssNotAuthenticated'
        '403':
          $ref: '#/components/responses/EssForbidden'
        '429':
          $ref: '#/components/responses/EssRateLimited'
        '503':
          $ref: '#/components/responses/EssUnavailable'
        default:
          $ref: '#/components/responses/EssUnexpected'

  /ess/attendance/mock-location:
    servers:
      - url: 'https://{essHost}/api'
        description: The ESS, on its own host name (ADR-0019).
        variables:
          essHost:
            default: team-api.rvmcad.org
            description: The ESS's own host name, chosen by KP on 16 Oct 2026 (ADR-0019).
    post:
      operationId: reportMockLocation
      tags: [ESS]
      x-owner: ess
      summary: Report a punch the phone refused for a mocked location (task B14)
      description: |
        Either token kind, with the checks of `GET /ess/me`. The app refuses a punch whose location the phone says is mocked (decision 6) and reports it here for HR, because the Scheduler's punch cannot take a mock flag. Punches only: `kind` is `punch`; whether mocked pings are reported too is still to be decided.

        - `latitude` and `longitude`: the mocked fix the phone reported, both or neither, in range. `accuracy_m`: metres, 0 to 1,000,000, or null.
        - `client_at`: the phone's clock, kept beside the server's `reported_at` and never trusted; an unreadable value, or one before 1970 or from 2100 on, is stored as null, not refused.
        - `provider` (up to 80 characters), `app_version` (40) and `install_id` (128): optional text.
        - The body takes these fields and no others. There is no employee or branch: the report is the caller's, at the branch on their HR record now.
        - 30 reports a day per person (429 `RATE_LIMITED`, with its own message), counted apart from the ESS-wide limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MockLocationReportRequest'
            examples:
              mocked:
                value:
                  kind: punch
                  latitude: 28.4089
                  longitude: 77.3178
                  accuracy_m: 3.5
                  client_at: '2026-10-16T09:29:58+05:30'
                  provider: fused
                  app_version: 1.0.0+3
                  install_id: 7f3c2a9e-1b4d-4c8a-9e2f-5d6a7b8c9d0e
      responses:
        '201':
          description: Reported.
          content:
            application/json:
              schema:
                type: object
                required: [report]
                properties:
                  report:
                    type: object
                    required: [id, reported_at]
                    properties:
                      id:
                        type: string
                        format: uuid
                      reported_at:
                        type: string
                        format: date-time
                        description: The server's clock.
              examples:
                reported:
                  value:
                    report:
                      id: 8a7b6c5d-4e3f-4a2b-9c1d-0e9f8a7b6c5d
                      reported_at: '2026-10-16T04:00:00+00:00'
        '400':
          description: '`VALIDATION_FAILED`: the message says which rule. `INVALID_JSON`, `BAD_REQUEST`: a body the ESS cannot read.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                kind:
                  value: { error: 'Only mocked punches are reported (kind "punch").', code: VALIDATION_FAILED }
                location:
                  value: { error: 'latitude and longitude must both be valid coordinates or both be left out, and accuracy_m must be a number of metres.', code: VALIDATION_FAILED }
                text:
                  value: { error: 'provider can be up to 80 characters, app_version up to 40 and install_id up to 128.', code: VALIDATION_FAILED }
                unknownField:
                  $ref: '#/components/examples/EssUnknownField'
        '401':
          $ref: '#/components/responses/EssNotAuthenticated'
        '403':
          $ref: '#/components/responses/EssForbidden'
        '429':
          description: |
            `RATE_LIMITED`: 30 reports from this person in 24 hours ("Too many reports from this phone today"), or the ESS-wide limits. Wait for `Retry-After` seconds; do not retry in a loop.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                reports:
                  value: { error: Too many reports from this phone today. Try again tomorrow., code: RATE_LIMITED }
                rateLimited:
                  $ref: '#/components/examples/EssRateLimited'
        '503':
          $ref: '#/components/responses/EssUnavailable'
        default:
          $ref: '#/components/responses/EssUnexpected'

