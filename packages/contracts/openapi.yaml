    Directory:
      type: object
      required: [people, truncated]
      properties:
        people:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/PersonCard'
        truncated:
          type: boolean

    TeamPerson:
      type: object
      required: [id, full_name, employee_code, designation, department, branch, email, phone, employment_status, notice_period, state, late, late_minutes, first_in, last_out]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        employee_code: { type: [string, 'null'] }
        designation: { type: [string, 'null'] }
        department:
          oneOf:
            - $ref: '#/components/schemas/BranchRef'
            - type: 'null'
        branch:
          oneOf:
            - $ref: '#/components/schemas/BranchRef'
            - type: 'null'
        email: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        employment_status: { type: [string, 'null'] }
        notice_period: { type: boolean }
        state:
          type: string
          enum: [in, done, not_in, on_leave, week_off, holiday]
        late: { type: boolean }
        late_minutes: { type: [integer, 'null'] }
        first_in: { type: [string, 'null'] }
        last_out: { type: [string, 'null'] }

    TeamToday:
      type: object
      required: [scope, date, filter, counts, people]
      properties:
        scope:
          type: [string, 'null']
          enum: [reports, branch, null]
        date: { type: string, format: date }
        filter:
          type: string
          enum: [all, not_in, late, on_leave]
        counts:
          type: object
          required: [all, not_in, late, on_leave]
          properties:
            all: { type: integer, minimum: 0 }
            not_in: { type: integer, minimum: 0 }
            late: { type: integer, minimum: 0 }
            on_leave: { type: integer, minimum: 0 }
        people:
          type: array
          items:
            $ref: '#/components/schemas/TeamPerson'

    OffThisWeek:
      type: object
      required: [week, scope, people]
      properties:
        week:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        scope:
          type: [string, 'null']
          enum: [reports, peers, null]
        people:
          type: array
          items:
            type: object
            required: [id, full_name, employee_code, designation, department, branch, email, phone, employment_status, notice_period, days]
            properties:
              id: { type: string, format: uuid }
              full_name: { type: string }
              employee_code: { type: [string, 'null'] }
              designation: { type: [string, 'null'] }
              department:
                oneOf:
                  - $ref: '#/components/schemas/BranchRef'
                  - type: 'null'
              branch:
                oneOf:
                  - $ref: '#/components/schemas/BranchRef'
                  - type: 'null'
              email: { type: [string, 'null'] }
              phone: { type: [string, 'null'] }
              employment_status: { type: [string, 'null'] }
              notice_period: { type: boolean }
              days:
                type: array
                items: { type: string, format: date }

    UserRole:
      type: string
      enum: [ceo, super_admin, hoo, hod, hod_placement, admin_manager, admin, accounts_admin, hr, hr_executive, faculty]
      description: A Scheduler portal role (users.role) that can sign in. Students have their own token, and the connector account cannot sign in.

    PortalLoginRequest:
      type: object
      required: [username, password, locationName]
      properties:
        username:
          type: string
          minLength: 1
          description: The username or the login phone number, matched exactly as stored. Not an email, not an employee code.
        password:
          type: string
          minLength: 1
        locationName:
          type: string
          minLength: 1
          description: A branch name exactly as the Scheduler stores it (the web offers Faridabad, Pune, Ahmedabad and Lucknow). It decides between accounts that share an identifier, and goes into the token.

    PortalSession:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: The portal JWT. 64 hours, no refresh.
        user:
          type: object
          required: [userId, username, role, locationId, locationName]
          properties:
            userId:
              type: string
              format: uuid
            username:
              type: [string, 'null']
              description: Null for an account that signs in by phone only.
            role:
              $ref: '#/components/schemas/UserRole'
            locationId:
              type: [integer, 'null']
              description: The account's Scheduler branch; null for accounts with no branch.
            locationName:
              type: [string, 'null']
              description: The branch name that was typed (sign-in) or echoed (verify), not checked against locationId.

    TwoFactorChallenge:
      type: object
      required: [two_factor_required, challenge_id, sent_to, expires_at, location_name]
      properties:
        two_factor_required:
          type: boolean
          const: true
        challenge_id:
          type: string
          format: uuid
        sent_to:
          type: string
          description: The email the code went to, masked, for example ra•••@rvmcad.org.
        expires_at:
          type: string
          format: date-time
        location_name:
          type: string
          description: The branch name from the sign-in, to send back to `/users/login/verify`.

    LoginVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^\s*(\d\s*){6}$'
          description: The six digits from the email; spaces are ignored.
        location_name:
          type: [string, 'null']
          description: The challenge's location_name, sent back unchanged.

    ForgotPasswordRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          description: A username or the account's email. A missing or unknown one still answers 200.

    ForgotPasswordConfirmRequest:
      type: object
      required: [identifier, code, new_password]
      properties:
        identifier:
          type: string
          description: The same identifier as the request step.
        code:
          type: string
          pattern: '^\s*(\d\s*){6}$'
        new_password:
          type: string
          minLength: 8
        confirm_password:
          type: string
          description: Optional. When present it must equal new_password.

    OkMessage:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
          const: true
        message:
          type: string

    MessageOnly:
      type: object
      required: [message]
      properties:
        message:
          type: string

    LegacyResetPasswordRequest:
      type: object
      description: The legacy reset's body at `c28b9ca`; the endpoint is still live. Never send it.
      required: [username, phone_number, new_password]
      properties:
        username:
          type: string
        phone_number:
          type: string
        locationName:
          type: string
        new_password:
          type: string

    AttendancePasswordLoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          description: The main phone on the HR record (+91, 91 or a leading 0 allowed), the email on it, or the employee code (any case).
        password:
          type: string
          minLength: 1

    AttendanceCodeRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 1
          description: The main phone on the HR record (a ten-digit Indian mobile; +91, 91 or a leading 0 allowed), or the email on it.

    AttendanceCodeSent:
      type: object
      required: [challenge_id, channel, sent_to, expires_at, ttl_minutes, sandbox]
      properties:
        challenge_id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [sms, email]
        sent_to:
          type: string
          description: Where the code went, masked (••••••2345, or ra•••@rvmcad.org).
        expires_at:
          type: string
          format: date-time
        ttl_minutes:
          type: integer
          description: How long the code lives, in minutes. Always 10 at c28b9ca.
        sandbox:
          type: boolean
          description: True when the server is in console mode and the code was logged, not delivered.

    AttendanceCodeVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^\s*(\d\s*){6}$'
          description: The six digits; spaces are ignored.

    AttendanceSession:
      type: object
      required: [token, expires_in_days, employee, password_set, temporary]
      properties:
        token:
          type: string
          description: The attendance session. Opens /hr/my-attendance/* and /ess/* only.
        expires_in_days:
          type: integer
          description: How long the session lasts, in days. Always 30 at c28b9ca.
        employee:
          type: object
          required: [full_name]
          properties:
            full_name:
              type: string
        password_set:
          type: boolean
          description: False when the login has no password at all; offer to set one.
        temporary:
          type: boolean
          description: True while the password is still the one HR gave.

    AttendanceSetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: At least 8 characters and at most 72 bytes; not one character repeated; not containing the main phone's ten digits; not HR's first-time password.

    AttendancePasswordSet:
      type: object
      required: [token, password_set]
      properties:
        token:
          type: string
          description: A fresh 30-day attendance session. Every older session of this login no longer works.
        password_set:
          type: boolean
          const: true

    MyAttendance:
      oneOf:
        - $ref: '#/components/schemas/MyAttendanceUnlinked'
        - $ref: '#/components/schemas/MyAttendanceMustSetPassword'
        - $ref: '#/components/schemas/MyAttendanceMonth'

    MyAttendanceUnlinked:
      type: object
      description: A portal login with no HR record linked.
      required: [linked, message]
      properties:
        linked:
          type: boolean
          const: false
        message:
          type: string

    MyAttendanceMustSetPassword:
      type: object
      description: A password session still on HR's first-time password. Show only "Choose your own password".
      required: [linked, must_set_password, employee]
      properties:
        linked:
          type: boolean
          const: true
        must_set_password:
          type: boolean
          const: true
        employee:
          type: object
          required: [id, full_name, employee_code]
          properties:
            id:
              type: string
              format: uuid
            full_name:
              type: string
            employee_code:
              type: [string, 'null']

    MyAttendanceMonth:
      type: object
      required: [linked, employee, branch, shift, week_off_days, holidays, upcoming_holidays, my_remarks, today, device, rules, month, days]
      properties:
        linked:
          type: boolean
          const: true
        employee:
          type: object
          required: [id, full_name, employee_code, geofence_exempt]
          properties:
            id:
              type: string
              format: uuid
            full_name:
              type: string
            employee_code:
              type: [string, 'null']
            geofence_exempt:
              type: boolean
              description: Field staff. The radius is not enforced; the location is still recorded.
        branch:
          type: [object, 'null']
          required: [id, name, latitude, longitude, radius_m, configured]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            latitude:
              type: [number, 'null']
            longitude:
              type: [number, 'null']
            radius_m:
              type: integer
              description: The geofence radius in metres (25 to 2000; 150 unless HR set it).
            configured:
              type: boolean
              description: False until HR sets the branch's location; punches are then refused BRANCH_NOT_CONFIGURED unless geofence-exempt.
        shift:
          type: [object, 'null']
          description: The employee's shift. Null when they are not on one (they are marked by hand) or before migration 20261022000000.
          required: [name, start, end, grace_minutes]
          properties:
            name:
              type: string
            start:
              type: string
              pattern: '^\d{2}:\d{2}$'
              description: HH:MM, IST.
            end:
              type: string
              pattern: '^\d{2}:\d{2}$'
              description: HH:MM, IST.
            grace_minutes:
              type: integer
        week_off_days:
          type: [array, 'null']
          description: Weekly offs, 0 = Sunday to 6 = Saturday. Null before migration 20261022000000.
          items:
            type: integer
            minimum: 0
            maximum: 6
        holidays:
          type: array
          description: The month's holidays for the employee's branch or for every branch.
          items:
            $ref: '#/components/schemas/Holiday'
        upcoming_holidays:
          type: array
          description: The next holidays from today, up to 120 days ahead and at most 12.
          maxItems: 12
          items:
            $ref: '#/components/schemas/Holiday'
        my_remarks:
          type: array
          description: The employee's own remarks on the month's days.
          items:
            type: object
            required: [day, remarks, updated_at]
            properties:
              day:
                type: string
                format: date
              remarks:
                type: string
              updated_at:
                type: string
                format: date-time
        today:
          $ref: '#/components/schemas/Today'
        device:
          type: object
          required: [this_phone, has_registered_phone, registered_at]
          properties:
            this_phone:
              type: string
              enum: [own, other, revoked, unknown]
              description: What the rvm_att_dev cookie on this request says about this phone.
            has_registered_phone:
              type: boolean
              description: Whether the employee has an active registered phone, this one or another.
            registered_at:
              type: [string, 'null']
              format: date-time
        rules:
          type: object
          required: [max_accuracy_m, mobile_only]
          properties:
            max_accuracy_m:
              type: number
              description: A fix vaguer than this is refused ACCURACY_LOW.
            mobile_only:
              type: boolean
              description: Whether a punch needs a phone User-Agent.
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
        days:
          type: array
          description: The month's day rows, oldest first.
          items:
            $ref: '#/components/schemas/DayRow'

    Holiday:
      type: object
      required: [day, name]
      properties:
        day:
          type: string
          format: date
        name:
          type: string

    DayStatus:
      type: string
      enum: [present, absent, half_day, leave, week_off, holiday]

    Today:
      type: object
      description: Today (IST), from today's accepted punches and today's day row.
      required: [day, punched_in, done, first_in, last_out, punches, worked_minutes, kind, holiday, status, late_minutes, early_exit_minutes, late_count, late_half_day, late_excused]
      properties:
        day:
          type: string
          format: date
        punched_in:
          type: boolean
          description: The last accepted punch today was an in.
        done:
          type: boolean
          description: Punched out; no more punches until IST midnight (DAY_DONE).
        first_in:
          type: [string, 'null']
          format: date-time
        last_out:
          type: [string, 'null']
          format: date-time
        punches:
          type: array
          items:
            type: object
            required: [kind, at, distance_m]
            properties:
              kind:
                type: string
                enum: [in, out]
              at:
                type: string
                format: date-time
              distance_m:
                type: [number, 'null']
        worked_minutes:
          type: integer
          minimum: 0
          description: Counts up to the moment of the request while punched in.
        kind:
          type: string
          enum: [no_shift, holiday, week_off, working]
          description: What today is on the shift rules. no_shift means the employee is not on a shift and is marked by hand.
        holiday:
          type: [string, 'null']
          description: Today's holiday name.
        status:
          oneOf:
            - $ref: '#/components/schemas/DayStatus'
            - type: 'null'
        late_minutes:
          type: [integer, 'null']
        early_exit_minutes:
          type: [integer, 'null']
        late_count:
          type: [integer, 'null']
          description: Which late arrival of the month today is.
        late_half_day:
          type: boolean
          description: Today became a half day as the month's third late arrival.
        late_excused:
          type: boolean

    DayRow:
      type: object
      description: |
        One day's record (hr_staff_attendance). The fields from late_minutes on arrive with migration 20261022000000 and are missing before it.
      required: [day, status, leave_type, source, first_in, last_out, worked_minutes]
      properties:
        day:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/DayStatus'
        leave_type:
          type: [string, 'null']
          description: cl, lwp, leave, or an older free-text type.
        source:
          type: string
          enum: [manual, self_punch, override, auto]
          description: Who wrote the row. override is HR's word on the day; auto is the nightly job.
        first_in:
          type: [string, 'null']
          format: date-time
        last_out:
          type: [string, 'null']
          format: date-time
        worked_minutes:
          type: [integer, 'null']
        late_minutes:
          type: [integer, 'null']
        early_exit_minutes:
          type: [integer, 'null']
        late_count:
          type: [integer, 'null']
        late_half_day:
          type: boolean
        late_excused:
          type: boolean
        shift_start:
          type: [string, 'null']
          description: HH:MM:SS, the shift the day is judged by.
        shift_end:
          type: [string, 'null']
          description: HH:MM:SS.

    PunchChallenge:
      type: object
      required: [nonce, expires_at]
      properties:
        nonce:
          type: string
          description: Send it unchanged as the punch's nonce.
        expires_at:
          type: string
          format: date-time
          description: Two minutes after issue.

    PunchRequest:
      type: object
      required: [kind, nonce, latitude, longitude, accuracy_m]
      properties:
        kind:
          type: string
          enum: [in, out]
        nonce:
          type: string
          description: The nonce from GET /hr/my-attendance/challenge, unchanged.
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracy_m:
          type: number
          minimum: 0
          description: The fix's horizontal accuracy in metres. Required.
        client_at:
          type: string
          format: date-time
          description: The phone's clock at the fix. Kept beside the server time and never trusted.
        note:
          type: string
          description: The employee's own word on the punch, for HR. Trimmed and cut to 200 characters without an error; never changes how the punch is judged.

    PunchAccepted:
      type: object
      required: [kind, at, distance_m, inside_geofence, flags, device_registered, today]
      properties:
        kind:
          type: string
          enum: [in, out]
        at:
          type: string
          format: date-time
          description: The server's time of the punch.
        distance_m:
          type: [integer, 'null']
          description: Metres from the branch; null when the branch has no location (geofence-exempt staff).
        inside_geofence:
          type: [boolean, 'null']
        flags:
          type: array
          items:
            type: string
            enum: [new_device, suspicious_accuracy, exempt_outside, off_network, possible_proxy]
        device_registered:
          type: boolean
          description: True when this punch registered the phone and set the rvm_att_dev cookie.
        today:
          type: object
          description: The day after this punch. The fields after punched_in are missing before migration 20261022000000 or when the day has no row.
          required: [worked_minutes, punched_in]
          properties:
            worked_minutes:
              type: integer
              minimum: 0
            punched_in:
              type: boolean
            status:
              $ref: '#/components/schemas/DayStatus'
            late_minutes:
              type: [integer, 'null']
            early_exit_minutes:
              type: [integer, 'null']
            late_count:
              type: [integer, 'null']
            late_half_day:
              type: boolean

    PingRequest:
      type: object
      required: [latitude, longitude, accuracy_m]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracy_m:
          type: number
          minimum: 0

    PingStored:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    RemarkRequest:
      type: object
      required: [day]
      properties:
        day:
          type: string
          format: date
          description: From the 1st of last month to today, IST.
        remarks:
          type: [string, 'null']
          description: Up to 500 characters after trimming. Empty, null or missing removes the remark.

    RemarkSaved:
      type: object
      required: [day, remarks]
      properties:
        day:
          type: string
          format: date
        remarks:
          type: [string, 'null']
          description: Null when the remark was removed.
        updated_at:
          type: string
          format: date-time
          description: Present when the remark was saved.

    WallAttachmentInput:
      type: object
      description: |
        One file, as the app sends it: base64 and its content type. Up to five per post, praise or announcement, each up to 1 MB decoded (F9). The bytes go to the ESS's own private bucket; the reply carries a fresh 300-second signed link, never the stored path.
      required: [data_base64, content_type]
      properties:
        data_base64:
          type: string
          minLength: 16
          maxLength: 2100000
          description: The file, base64. The app compresses a photo under 1 MB before sending it.
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp, application/pdf]
        name:
          type: string
          maxLength: 120
          description: What the file is called, for the app to show. Optional.

    WallAttachment:
      type: object
      required: [name, content_type, url]
      properties:
        name:
          type: [string, 'null']
        content_type:
          type: [string, 'null']
        url:
          type: [string, 'null']
          description: A 300-second signed link into the ESS's private bucket. Null while the bucket cannot be reached; the app then shows the post without its picture.

    WallPerson:
      type: object
      description: Somebody a Wall row refers to (its author, who it is about, somebody mentioned).
      required: [id, full_name, employee_code]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        employee_code:
          type: [string, 'null']
        designation:
          type: [string, 'null']

    WallReactionCounts:
      type: object
      description: How many of each of the six reactions a post or comment has. A reaction nobody used is absent.
      additionalProperties: false
      properties:
        like: { type: integer, minimum: 1 }
        love: { type: integer, minimum: 1 }
        laugh: { type: integer, minimum: 1 }
        clap: { type: integer, minimum: 1 }
        insightful: { type: integer, minimum: 1 }
        curious: { type: integer, minimum: 1 }

    WallReactionKind:
      type: string
      enum: [like, love, laugh, clap, insightful, curious]
      description: One of the six (F2).

    WallReactionPerson:
      type: object
      required: [id, full_name, employee_code, reacted_at]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: [string, 'null']
        employee_code:
          type: [string, 'null']
        reacted_at:
          type: string
          format: date-time

    WallReactionGroup:
      type: object
      required: [reaction, count, people]
      properties:
        reaction:
          $ref: '#/components/schemas/WallReactionKind'
        count:
          type: integer
          minimum: 1
        people:
          type: array
          description: Who reacted this way, newest first. "Tapping the count shows who reacted" (F2).
          items:
            $ref: '#/components/schemas/WallReactionPerson'

    WallReactionsList:
      type: object
      required: [reactions, total]
      properties:
        reactions:
          type: array
          description: One entry per reaction that has people, in the six's order.
          items:
            $ref: '#/components/schemas/WallReactionGroup'
        total:
          type: integer
          minimum: 0

    WallReactionState:
      type: object
      required: [counts, total]
      properties:
        counts:
          $ref: '#/components/schemas/WallReactionCounts'
        total:
          type: integer
          minimum: 0
        my_reaction:
          type: [string, 'null']
          enum: [like, love, laugh, clap, insightful, curious, null]
          description: The caller's own reaction, or null. One person has one reaction per post or comment.

    WallPollOption:
      type: object
      required: [id, label, position, votes]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        position:
          type: integer
          minimum: 0
          maximum: 9
        votes:
          type: integer
          minimum: 0

    WallPoll:
      type: object
      description: A poll's own block (F4). `my_option_ids` is the caller's own vote and nothing about anybody else's; an anonymous poll never names a voter, HR included.
      required: [multiple, anonymous, closes_on, closed, options_locked, total_votes, my_option_ids, options]
      properties:
        multiple:
          type: boolean
          description: Whether more than one option may be chosen. False means single choice.
        anonymous:
          type: boolean
          description: True means nobody, HR included, can see who voted what.
        closes_on:
          type: string
          format: date
          description: The closing day, inclusive; a vote on that day still counts.
        closed:
          type: boolean
          description: True once the closing day has passed or the author closed it early.
        closed_at:
          type: [string, 'null']
          format: date-time
          description: When its author closed it early; null when it closed by its own date.
        options_locked:
          type: boolean
          description: True from the first vote on; the option set is fixed (F4).
        total_votes:
          type: integer
          minimum: 0
          description: Every vote cast, so a multiple-choice poll counts one person more than once.
        my_option_ids:
          type: array
          items:
            type: string
            format: uuid
        options:
          type: array
          items:
            $ref: '#/components/schemas/WallPollOption'

    WallComment:
      type: object
      description: 'One comment or reply (F2). One level only: a reply''s `replies` is always empty. A hidden comment carries `hidden: true` and no words (F7) for everybody but HR and its author; a deleted one carries `deleted: true`.'
      properties:
        id:
          type: string
          format: uuid
        post_id:
          type: string
          format: uuid
        parent_id:
          type: [string, 'null']
          format: uuid
          description: The comment this one replies to; null for a comment on the post.
        author:
          oneOf:
            - $ref: '#/components/schemas/WallPerson'
            - type: 'null'
          description: Null for a deleted or hidden-out-of-sight row.
        mine:
          type: boolean
        body:
          type: [string, 'null']
          description: Null when the comment is hidden and the caller may not see it.
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/WallPerson'
        reactions:
          $ref: '#/components/schemas/WallReactionState'
        my_reaction:
          type: [string, 'null']
          enum: [like, love, laugh, clap, insightful, curious, null]
        reply_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        edited:
          type: boolean
        hidden:
          type: boolean
        deleted:
          type: boolean
        deleted_at:
          type: string
          format: date-time
        replies:
          type: array
          items:
            $ref: '#/components/schemas/WallComment'

    WallPost:
      type: object
      description: |
        One feed row: a post, a praise, a wish or a poll (F1-F4, F6). A row the caller may not see is 404, never a partial shape. `deleted: true` is the one exception: the author's own deletion leaves a stub so a thread keeps its shape.
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [post, praise, wish, poll]
        scope:
          type: string
          enum: [org, branch]
          description: The organisation's wall, or one branch's.
        branch_id:
          type: [string, 'null']
          format: uuid
          description: The branch a branch post stands on; null for the organisation's wall.
        author:
          description: Null for a deleted row, or one the reader may not see.
          oneOf:
            - $ref: '#/components/schemas/WallPerson'
            - type: 'null'
        mine:
          type: boolean
        body:
          type: [string, 'null']
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/WallAttachment'
        mentions:
          type: array
          items:
            $ref: '#/components/schemas/WallPerson'
        about:
          oneOf:
            - $ref: '#/components/schemas/WallPerson'
            - type: 'null'
          description: Who a praise or a wish is about.
        badge:
          type: [object, 'null']
          properties:
            id: { type: string }
            label: { type: string }
          description: The praise badge, out of the fixed catalogue `GET /ess/wall/settings` lists (F3).
        occasion:
          type: [string, 'null']
          enum: [birthday, anniversary, null]
          description: What a wish is for (F6).
        poll:
          $ref: '#/components/schemas/WallPoll'
        reactions:
          $ref: '#/components/schemas/WallReactionState'
        my_reaction:
          type: [string, 'null']
          enum: [like, love, laugh, clap, insightful, curious, null]
        comment_count:
          type: integer
          minimum: 0
        edited:
          type: boolean
          description: True once the author has edited it inside the 15 minutes (F1).
        edited_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        hidden:
          type: boolean
          description: True when HR hid it (F7). Its author and HR still see the row.
        comments:
          type: array
          description: Only on `GET /ess/wall/posts/{id}`.
          items:
            $ref: '#/components/schemas/WallComment'
        deleted:
          type: boolean
        deleted_at:
          type: string
          format: date-time

    WallFeed:
      type: object
      required: [posts, next_before, truncated]
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/WallPost'
        next_before:
          type: [string, 'null']
          format: date-time
          description: Send it back as `?before=` for the next page. Null on the last page.
        truncated:
          type: boolean

    WallPostCreate:
      type: object
      description: A post, or a poll (F1, F4). Praise and wishes have their own addresses, because they carry their own fields.
      required: [body]
      properties:
        kind:
          type: string
          enum: [post, poll]
          default: post
        body:
          type: string
          minLength: 1
          maxLength: 300
          description: Up to 2,000 characters for a post; a poll's body is its question, 3 to 300.
        scope:
          type: string
          enum: [org, branch]
          default: branch
          description: The build's default is the author's own branch wall; `org` is everybody's. KP to confirm.
        branch_id:
          type: string
          format: uuid
          description: 'Only with `scope: branch`, and only the caller''s own branch.'
        attachments:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/WallAttachmentInput'
        poll:
          type: object
          required: [options, closes_on]
          properties:
            options:
              type: array
              minItems: 2
              maxItems: 10
              items:
                type: string
                minLength: 1
                maxLength: 120
            multiple:
              type: boolean
              default: false
            anonymous:
              type: boolean
              default: false
            closes_on:
              type: string
              format: date
              description: The closing day, not a day in the past and not more than a year ahead.

    WallPostUpdate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000

    WallCommentCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000
        parent_id:
          type: string
          format: uuid
          description: The comment being replied to. A reply of a reply is refused.

    WallCommentUpdate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 1000

    WallCommentReply:
      type: object
      required: [comment]
      properties:
        comment:
          $ref: '#/components/schemas/WallComment'

    WallPostResult:
      type: object
      required: [post]
      properties:
        post:
          $ref: '#/components/schemas/WallPost'

    WallPostThread:
      type: object
      required: [post, truncated]
      properties:
        post:
          $ref: '#/components/schemas/WallPost'
        truncated:
          type: boolean
          description: True when the post has more comments than the page carries (50).

    WallReactionChange:
      type: object
      required: [reaction]
      properties:
        reaction:
          $ref: '#/components/schemas/WallReactionKind'

    PraiseCreate:
      type: object
      required: [employee_id, badge, reason]
      properties:
        employee_id:
          type: string
          format: uuid
          description: The person praised. Yourself is refused.
        badge:
          type: string
          description: One of the fixed catalogue's ids, from `GET /ess/wall/settings`.
        reason:
          type: string
          minLength: 3
          maxLength: 280
        scope:
          type: string
          enum: [org, branch]
          default: org
        branch_id:
          type: string
          format: uuid
        attachments:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/WallAttachmentInput'

    PraiseResult:
      type: object
      required: [post, badge]
      properties:
        post:
          $ref: '#/components/schemas/WallPost'
        badge:
          type: [object, 'null']
          properties:
            id: { type: string }
            label: { type: string }
            for: { type: string }

    PraiseList:
      type: object
      required: [praise, badges]
      properties:
        praise:
          type: array
          items:
            $ref: '#/components/schemas/WallPost'
        badges:
          type: array
          description: The whole fixed catalogue, so the picker needs no second call (F3).
          items:
            type: object
            required: [id, label, for]
            properties:
              id: { type: string }
              label: { type: string }
              for: { type: string }

    WallPollVote:
      type: object
      required: [option_ids]
      properties:
        option_ids:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: string
            format: uuid
          description: One id for a single-choice poll; any number for a multiple-choice one.

    WallPollVoteResult:
      type: object
      required: [poll, my_option_ids]
      properties:
        poll:
          $ref: '#/components/schemas/WallPoll'
        my_option_ids:
          type: array
          items:
            type: string
            format: uuid

    WallPollCloseResult:
      type: object
      required: [poll]
      properties:
        poll:
          $ref: '#/components/schemas/WallPoll'

    WallPollOptionAdd:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120

    WallPollOptionAddResult:
      type: object
      required: [option, poll]
      properties:
        option:
          $ref: '#/components/schemas/WallPollOption'
        poll:
          $ref: '#/components/schemas/WallPoll'

    AudienceScope:
      type: object
      description: |
        Who an announcement reaches (F5). `{"all": true}`, or any of the lists — an OR of the people each names. Nothing means everybody. The audience is resolved once, when the announcement is published: a new branch or a role change afterwards never silently reaches somebody new.
      properties:
        all:
          type: boolean
          const: true
        branch_ids:
          type: array
          items:
            type: string
            format: uuid
        department_ids:
          type: array
          items:
            type: string
            format: uuid
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        employee_ids:
          type: array
          items:
            type: string
            format: uuid

    Announcement:
      type: object
      description: One staff announcement (F5), in the reader's own words. The audience list is never sent; `audience_label` is its staff-facing reading, and the counts are the sender's own.
      required: [id, title, body, attachments, author, mine, needs_ack, closes_on, pinned, publish_at, published_at, created_at, edited, read_at, ack_at]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/WallAttachment'
        author:
          description: Null for a deleted row, or one the reader may not see.
          oneOf:
            - $ref: '#/components/schemas/WallPerson'
            - type: 'null'
        mine:
          type: boolean
        audience_label:
          type: [string, 'null']
          description: 'A staff-facing reading (Everybody, or Branches: Faridabad). Sent to its sender alone.'
        needs_ack:
          type: boolean
        closes_on:
          type: [string, 'null']
          format: date
          description: The day the acknowledgement closes; the same day is still open.
        pinned:
          type: boolean
        publish_at:
          type: [string, 'null']
          format: date-time
          description: When it went out, or when it will.
        published_at:
          type: [string, 'null']
          format: date-time
          description: Null while it is still a draft or a scheduled one.
        created_at:
          type: string
          format: date-time
        edited:
          type: boolean
        read_at:
          type: [string, 'null']
          format: date-time
          description: The caller's own first open, or null.
        ack_at:
          type: [string, 'null']
          format: date-time
        counts:
          $ref: '#/components/schemas/AnnouncementCounts'

    AnnouncementCounts:
      type: object
      description: The sender's own numbers (F5).
      required: [sent, read, acknowledged, not_acknowledged]
      properties:
        sent:
          type: integer
          minimum: 0
          description: How many people the audience resolved to when it was published.
        read:
          type: integer
          minimum: 0
        acknowledged:
          type: integer
          minimum: 0
        not_acknowledged:
          type: integer
          minimum: 0

    AnnouncementCreate:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        body:
          type: string
          minLength: 3
          maxLength: 5000
        audience:
          $ref: '#/components/schemas/AudienceScope'
        attachments:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/WallAttachmentInput'
        needs_ack:
          type: boolean
          default: false
          description: True means a closing date is required, and the audience is asked to acknowledge it.
        closes_on:
          type: string
          format: date
        publish_at:
          type: string
          format: date-time
          description: In the future, to schedule it. Left out, it goes out at once.
        pinned:
          type: boolean
          default: false
          description: Up to three at a time.

    AnnouncementUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        body:
          type: string
          minLength: 3
          maxLength: 5000
        pinned:
          type: boolean

    AnnouncementResult:
      type: object
      required: [announcement]
      properties:
        announcement:
          $ref: '#/components/schemas/Announcement'

    AnnouncementCreated:
      type: object
      required: [announcement, counts, scheduled]
      properties:
        announcement:
          $ref: '#/components/schemas/Announcement'
        counts:
          $ref: '#/components/schemas/AnnouncementCounts'
        scheduled:
          type: boolean
          description: True when it waits for its `publish_at`; the counts are all zero then.

    AnnouncementList:
      type: object
      required: [announcements, truncated]
      properties:
        announcements:
          type: array
          items:
            $ref: '#/components/schemas/Announcement'
        truncated:
          type: boolean

    AnnouncementCountsResult:
      type: object
      required: [counts, closes_on, needs_ack]
      properties:
        counts:
          $ref: '#/components/schemas/AnnouncementCounts'
        closes_on:
          type: [string, 'null']
          format: date
        needs_ack:
          type: boolean

    AcknowledgementSaved:
      type: object
      required: [read_at, ack_at]
      properties:
        read_at:
          type: string
          format: date-time
        ack_at:
          type: string
          format: date-time

    CelebrationPerson:
      type: object
      required: [id, full_name, employee_code, designation, branch_id]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        employee_code:
          type: [string, 'null']
        designation:
          type: [string, 'null']
        branch_id:
          type: [string, 'null']
          format: uuid

    BirthdayCard:
      type: object
      description: A birthday, as day and month only. The year is never stored, sent or derived (F6).
      required: [employee, date_of_birth, on, wished_by_me, wish_count]
      properties:
        employee:
          $ref: '#/components/schemas/CelebrationPerson'
        date_of_birth:
          type: object
          required: [day, month]
          properties:
            day:
              type: integer
              minimum: 1
              maximum: 31
            month:
              type: integer
              minimum: 1
              maximum: 12
        on:
          type: string
          format: date
          description: The day this year's mark falls on, inside the asked window.
        wished_by_me:
          type: boolean
        wish_count:
          type: integer
          minimum: 0

    AnniversaryCard:
      type: object
      required: [employee, date_of_joining, years, on, wished_by_me, wish_count]
      properties:
        employee:
          $ref: '#/components/schemas/CelebrationPerson'
        date_of_joining:
          type: string
          format: date
        years:
          type: integer
          minimum: 0
          description: How many years, not the date of joining's year on its own.
        on:
          type: string
          format: date
        wished_by_me:
          type: boolean
        wish_count:
          type: integer
          minimum: 0

    NewJoinerCard:
      type: object
      required: [employee, date_of_joining, days]
      properties:
        employee:
          $ref: '#/components/schemas/CelebrationPerson'
        date_of_joining:
          type: string
          format: date
        days:
          type: integer
          minimum: 0
          maximum: 15

    Celebrations:
      type: object
      required: [today, window_days, birthdays, anniversaries, new_joiners, birthdays_hidden]
      properties:
        today:
          type: string
          format: date
          description: The server's IST day, so the cards' "today" is never the phone's.
        window_days:
          type: integer
          minimum: 1
          maximum: 90
        birthdays:
          type: array
          items:
            $ref: '#/components/schemas/BirthdayCard'
        anniversaries:
          type: array
          items:
            $ref: '#/components/schemas/AnniversaryCard'
        new_joiners:
          type: array
          items:
            $ref: '#/components/schemas/NewJoinerCard'
        birthdays_hidden:
          type: integer
          minimum: 0
          description: How many people asked to be left off the birthday cards; never who they are.

    WishCreate:
      type: object
      required: [employee_id, occasion, body]
      properties:
        employee_id:
          type: string
          format: uuid
          description: Who the wish is for. Yourself is refused.
        occasion:
          type: string
          enum: [birthday, anniversary]
        body:
          type: string
          minLength: 1
          maxLength: 200

    CelebrationOptout:
      type: object
      required: [celebrations]
      properties:
        celebrations:
          type: object
          required: [hidden]
          properties:
            hidden:
              type: boolean
              description: True means this person's birthday is left off the cards. False is the default, and says so.

    CelebrationOptoutUpdate:
      type: object
      required: [hidden]
      properties:
        hidden:
          type: boolean

    WallReportCreate:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 280
        detail:
          type: string
          maxLength: 500

    WallReportMade:
      type: object
      required: [report]
      properties:
        report:
          type: object
          properties:
            post_id:
              type: [string, 'null']
              format: uuid
            comment_id:
              type: [string, 'null']
              format: uuid
            status:
              type: string
              const: open

    WallReport:
      type: object
      description: One report on HR's queue (F7). The reporter's words are HR's only copy; the post's is never.
      required: [id, target, post_id, comment_id, target_preview, target_deleted, target_hidden, reporter, reason, detail, status, resolved_by_name, resolved_at, resolution_note, created_at]
      properties:
        id:
          type: string
          format: uuid
        target:
          type: string
          enum: [post, comment]
        post_id:
          type: [string, 'null']
          format: uuid
        comment_id:
          type: [string, 'null']
          format: uuid
        target_preview:
          type: [string, 'null']
          description: Up to 140 characters of what was reported. Null once the target row is gone.
        target_deleted:
          type: boolean
        target_hidden:
          type: boolean
        reporter:
          type: object
          required: [id, full_name]
          properties:
            id:
              type: string
              format: uuid
            full_name:
              type: [string, 'null']
        reason:
          type: string
        detail:
          type: [string, 'null']
        status:
          type: string
          enum: [open, hidden, kept]
        resolved_by_name:
          type: [string, 'null']
        resolved_at:
          type: [string, 'null']
          format: date-time
        resolution_note:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time

    WallReportQueue:
      type: object
      required: [reports, truncated]
      properties:
        reports:
          type: array
          items:
            $ref: '#/components/schemas/WallReport'
        truncated:
          type: boolean

    WallReportResolve:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [hidden, kept]
          description: What HR did about it. `hidden` hides the thing; `kept` leaves it.
        note:
          type: string
          maxLength: 200

    WallReportResolved:
      type: object
      required: [report]
      properties:
        report:
          type: object
          required: [id, status, resolved_by_name, resolved_at, resolution_note]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [hidden, kept]
            resolved_by_name:
              type: string
            resolved_at:
              type: string
              format: date-time
            resolution_note:
              type: [string, 'null']

    WallHidden:
      type: object
      description: 'The answer to a hide or a restore: what happened to that one thing (F7).'
      required: [post]
      properties:
        post:
          type: object
          required: [id, hidden]
          properties:
            id:
              type: string
              format: uuid
            hidden:
              type: boolean
            hidden_by_name:
              type: string
            hide_reason:
              type: string

    WallCommentHidden:
      type: object
      required: [comment]
      properties:
        comment:
          type: object
          required: [id, hidden]
          properties:
            id:
              type: string
              format: uuid
            hidden:
              type: boolean
            hidden_by_name:
              type: string
            hide_reason:
              type: string

    WallHideRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 200

    ModerationEntry:
      type: object
      required: [id, at, actor_name, action, target_employee_id, details]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actor_name:
          type: [string, 'null']
        action:
          type: string
          enum: [wall.post.hidden, wall.post.restored, wall.post.deleted, wall.comment.hidden, wall.comment.restored, wall.comment.deleted, wall.report.resolved]
        target_employee_id:
          type: [string, 'null']
          format: uuid
        details:
          type: object
          description: Ids and HR's reason, never a copy of what was hidden.

    ModerationLog:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ModerationEntry'

    WallSettings:
      type: object
      description: |
        The Wall's rules, as the server holds them (F8). Nothing here is a table: a change is a reviewed code change. The app renders its forms from this document, so a form and its refusal can never disagree.
      required: [post, comment, reactions, praise, poll, announcement, moderation, celebrations, email]
      properties:
        post:
          type: object
          required: [everyone, max_attachments, max_body, edit_window_minutes, mentions, scopes]
          properties:
            everyone:
              type: boolean
              description: True for every staff login (decision 8).
            max_attachments: { type: integer }
            max_body: { type: integer }
            edit_window_minutes: { type: integer }
            mentions:
              type: string
              enum: [employee_code]
              description: '@RVM-011: an @ before an employee code.'
            scopes:
              type: array
              items:
                type: string
                enum: [org, branch]
        comment:
          type: object
          required: [everyone, max_body, reply_depth, edit_window_minutes]
          properties:
            everyone: { type: boolean }
            max_body: { type: integer }
            reply_depth:
              type: integer
              const: 1
            edit_window_minutes: { type: integer }
        reactions:
          type: array
          items:
            $ref: '#/components/schemas/WallReactionKind'
        praise:
          type: object
          required: [badges, max_reason, photo, certificate]
          properties:
            badges:
              type: array
              items:
                type: object
                required: [id, label, for]
                properties:
                  id: { type: string }
                  label: { type: string }
                  for: { type: string }
            max_reason: { type: integer }
            photo: { type: boolean }
            certificate:
              type: boolean
              description: False in this phase; letters are Phase 3.
        poll:
          type: object
          required: [min_options, max_options, max_option_chars, multiple, anonymous, closes_within_days]
          properties:
            min_options: { type: integer }
            max_options: { type: integer }
            max_option_chars: { type: integer }
            multiple: { type: boolean }
            anonymous: { type: boolean }
            closes_within_days: { type: integer }
        announcement:
          type: object
          required: [everyone, roles, max_attachments, max_pinned, audience, acknowledgement, scheduled]
          properties:
            everyone:
              type: boolean
              description: 'Always false: only the roles below post announcements (decision 8).'
            roles:
              type: array
              items:
                $ref: '#/components/schemas/UserRole'
            max_attachments: { type: integer }
            max_pinned: { type: integer }
            audience:
              type: object
              required: [scopes, roles]
              properties:
                scopes:
                  type: array
                  items:
                    type: string
                    enum: [all, branch_ids, department_ids, roles, employee_ids]
                roles:
                  type: array
                  items:
                    $ref: '#/components/schemas/UserRole'
            acknowledgement: { type: boolean }
            scheduled: { type: boolean }
        moderation:
          type: object
          required: [roles, reasons, reports]
          properties:
            roles:
              type: array
              items:
                $ref: '#/components/schemas/UserRole'
            reasons:
              type: boolean
              description: 'True: a hide always carries a reason.'
            reports: { type: boolean }
        celebrations:
          type: object
          required: [enabled, opt_out, new_joiner_days]
          properties:
            enabled: { type: boolean }
            opt_out: { type: boolean }
            new_joiner_days: { type: integer }
        email:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
              description: 'False until RVM has a mail provider (KP, 19 Oct): announcement mail is written to the log, as push is.'

    HelpdeskPerson:
      type: object
      description: Somebody a Helpdesk row names (its raiser or its assignee) — as the Wall shows an author.
      required: [id, full_name, employee_code]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        employee_code:
          type: [string, 'null']
        designation:
          type: [string, 'null']

    HelpdeskCategory:
      type: object
      description: One Helpdesk category (G1) — a ticket kind to raise, or a link to a flow that is not a ticket.
      required: [id, slug, name, is_ticket, flow, confidential, allows_hold, priority, first_response_hours, resolution_hours]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: The name the raise form sends back as `category`.
        name:
          type: string
        is_ticket:
          type: boolean
          description: 'True: raisable as a ticket. False: a link — the app opens `flow` instead.'
        flow:
          type: [string, 'null']
          enum: [leave, wfh, attendance_fix, assets, null]
          description: The flow a non-ticket row links to; null on a ticket category.
        confidential:
          type: boolean
          description: 'True (grievance, POSH): never in HR oversight''s lists, and every read by anybody but its raiser is audited.'
        allows_hold:
          type: boolean
          description: 'True: the team may put its tickets on hold.'
        priority:
          $ref: '#/components/schemas/HelpdeskPriority'
        first_response_hours:
          type: integer
          description: The first-response SLA, in working hours.
        resolution_hours:
          type: integer
          description: The resolution SLA, in working hours.

    HelpdeskSettingsCategory:
      type: object
      description: One category as the rules document restates it, for the form's checks.
      required: [id, slug, name, is_ticket, flow, confidential, allows_hold, priority]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        is_ticket:
          type: boolean
        flow:
          type: [string, 'null']
          enum: [leave, wfh, attendance_fix, assets, null]
        confidential:
          type: boolean
        allows_hold:
          type: boolean
        priority:
          $ref: '#/components/schemas/HelpdeskPriority'

    HelpdeskSettings:
      type: object
      description: The rules around a raise (G1), so the app never works them out for itself.
      required: [categories, reopen_days, rating, anonymous, attachments]
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/HelpdeskSettingsCategory'
        reopen_days:
          type: integer
          description: How long after settling a ticket may be reopened (7).
        rating:
          type: object
          required: [min, max]
          properties:
            min: { type: integer }
            max: { type: integer }
        anonymous:
          type: boolean
          description: 'True: the raise form offers `anonymous`.'
        attachments:
          type: boolean
          description: 'True: a raise may carry files.'

    HelpdeskCategories:
      type: object
      required: [categories, settings]
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/HelpdeskCategory'
        settings:
          $ref: '#/components/schemas/HelpdeskSettings'

    HelpdeskPriority:
      type: string
      enum: [low, medium, high, urgent]

    HelpdeskStatus:
      type: string
      description: A ticket's state on the lifecycle (G2).
      enum: [open, in_progress, on_hold, resolved, closed, withdrawn]

    HelpdeskTicket:
      type: object
      description: One ticket, as every read shows it (G2, G4). An anonymous ticket hides `raised_by` from the team; HR's own roles and the raiser see it.
      required: [id, ref, category, priority, subject, body, status, anonymous, raised_by, assignee, attachments, first_response_at, first_response_due_at, resolution_due_at, resolved_at, closed_at, closing_reason, rating, reopened_at, escalation_level, overdue_minutes, created_at, updated_at, mine]
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
          description: The human label (`HD-0001`), handed out by the migration's trigger.
        category:
          $ref: '#/components/schemas/HelpdeskCategory'
        priority:
          $ref: '#/components/schemas/HelpdeskPriority'
        subject:
          type: string
        body:
          type: string
        status:
          $ref: '#/components/schemas/HelpdeskStatus'
        anonymous:
          type: boolean
        raised_by:
          oneOf:
            - $ref: '#/components/schemas/HelpdeskPerson'
            - type: 'null'
          description: Null on an anonymous ticket read by the team.
        assignee:
          oneOf:
            - $ref: '#/components/schemas/HelpdeskPerson'
            - type: 'null'
        attachments:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/WallAttachment'
        first_response_at:
          type: [string, 'null']
          format: date-time
          description: The team's first act — a claim, a comment or a move.
        first_response_due_at:
          type: string
          format: date-time
          description: The first-response deadline, worked out at raise on the raiser's branch's calendar.
        resolution_due_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, 'null']
          format: date-time
        closed_at:
          type: [string, 'null']
          format: date-time
        closing_reason:
          type: [string, 'null']
        rating:
          type: [integer, 'null']
          minimum: 1
          maximum: 5
        reopened_at:
          type: [string, 'null']
          format: date-time
        escalation_level:
          type: integer
          description: 0 on time; 1 (the queue reminded), 2 (HoO) or 3 (CEO) as the job escalates a past-due ticket.
        overdue_minutes:
          type: [integer, 'null']
          description: The working minutes a live ticket is past the deadline it is now breaching; null when on time.
        infra:
          oneOf:
            - $ref: '#/components/schemas/HelpdeskInfraLink'
            - type: 'null'
          description: The Admin Manager's register summary for a lab or facility ticket (G6); null for every other category or when the mirror is still skipped.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        mine:
          type: boolean
          description: 'True: the caller raised it.'

    HelpdeskInfraLink:
      type: object
      description: The summary row in the Admin Manager's infra register that mirrors a lab or facility ticket (G6).
      required: [ticket_no, status, closed_on]
      properties:
        ticket_no:
          type: [integer, 'null']
        status:
          type: string
          enum: [open, closed]
        closed_on:
          type: [string, 'null']
          format: date

    HelpdeskTicketList:
      type: object
      required: [tickets]
      properties:
        tickets:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/HelpdeskTicket'

    HelpdeskMessage:
      type: object
      description: One thread row — a comment somebody wrote, or an `event` the server wrote as the ticket moved.
      required: [id, ticket_id, kind, body, event, details, author, created_at]
      properties:
        id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [comment, event]
        body:
          type: [string, 'null']
          description: A comment's words; null on an event.
        event:
          type: [string, 'null']
          description: 'On an event: opened, claimed, status_changed, withdrawn, closed or reopened.'
        details:
          type: object
          additionalProperties: true
          description: The event's facts (from, to, reason, rating, who claimed).
        author:
          oneOf:
            - $ref: '#/components/schemas/HelpdeskPerson'
            - type: 'null'
          description: A comment's writer; null on an event.
        created_at:
          type: string
          format: date-time

    HelpdeskThread:
      type: object
      required: [ticket, messages]
      properties:
        ticket:
          $ref: '#/components/schemas/HelpdeskTicket'
        messages:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/HelpdeskMessage'

    HelpdeskTicketResult:
      type: object
      required: [ticket]
      properties:
        ticket:
          $ref: '#/components/schemas/HelpdeskTicket'

    HelpdeskMessageResult:
      type: object
      required: [message]
      properties:
        message:
          $ref: '#/components/schemas/HelpdeskMessage'

    HelpdeskQueue:
      type: object
      description: The team's queue (G5) — the tickets of the categories the caller's role serves, and those categories for the filter chips.
      required: [tickets, categories]
      properties:
        tickets:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/HelpdeskTicket'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/HelpdeskCategory'

    HelpdeskAssign:
      type: object
      description: The assignment of a ticket to a named handler (KP 5). The note is optional.
      required: [employee_id]
      properties:
        employee_id:
          type: string
          format: uuid
          description: Who takes the ticket — one of the category's queue roles, checked through their login.
        note:
          type: string
          maxLength: 500
          description: Why, for the history row.

    DocumentType:
      type: object
      description: One document type (KP 1) — the fixed list the migration seeds and policy holds, plus whether it is mandatory and whether only the ESS offers it.
      required: [slug, name, is_mandatory, ess_only, sort]
      properties:
        slug:
          type: string
          description: The name the upload form sends back as `doc_type`.
        name:
          type: string
        is_mandatory:
          type: boolean
          description: 'True: the weekly job reminds anybody whose record lacks it (identity, offer, joining as seeded; KP may change one with an UPDATE).'
        ess_only:
          type: boolean
          description: 'True (`others`): an ESS-only type whose upload must say what the file is, in a remark.'
        sort:
          type: integer
          description: The order the form lists them in.

    Document:
      type: object
      description: 'One document, as every read shows it (KP 1): the facts and the review — never the bucket path (the signed link carries the bytes) and never the reviewer''s user id.'
      required: [id, employee_id, doc_type, file_name, content_type, size_bytes, remark, status, verified_by_name, verified_at, rejection_reason, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        doc_type:
          type: string
          enum: [resume, identity, certificate, offer, joining, experience, exit, other, others]
        file_name:
          type: string
        content_type:
          type: string
          description: 'application/pdf, image/jpeg or image/png — what was uploaded.'
        size_bytes:
          type: integer
          description: Up to 5 MB (5,242,880 bytes).
        remark:
          type: [string, 'null']
          description: What the person said the file is; required for `others`.
        status:
          type: string
          enum: [pending, verified, rejected]
        verified_by_name:
          type: [string, 'null']
          description: Who reviewed it, by name.
        verified_at:
          type: [string, 'null']
          format: date-time
        rejection_reason:
          type: [string, 'null']
          description: Why it was turned away — the employee sees it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DocumentList:
      type: object
      description: The types the upload form reads, and the documents (mine, or one person's at HR's desk).
      required: [types, documents]
      properties:
        types:
          type: array
          items:
            $ref: '#/components/schemas/DocumentType'
        documents:
          type: array
          items:
            $ref: '#/components/schemas/Document'

    DocumentResult:
      type: object
      required: [document]
      properties:
        document:
          $ref: '#/components/schemas/Document'

    DocumentFile:
      type: object
      description: A 300-second signed link to one document's bytes — never the path, never the bytes themselves.
      required: [file]
      properties:
        file:
          type: object
          required: [url, name, content_type, expires_in]
          properties:
            url:
              type: string
            name:
              type: string
            content_type:
              type: string
            expires_in:
              type: integer
              description: Seconds the link stays good (300).

    DocumentUpload:
      type: object
      description: One file per upload (KP 1). The bytes arrive as base64; the ESS stores them in its private bucket under `documents/`.
      required: [doc_type, file_name, content_type, data_base64]
      properties:
        doc_type:
          type: string
          description: A type's slug, from the list every read answers.
        file_name:
          type: string
          maxLength: 200
        content_type:
          type: string
          enum: [application/pdf, image/jpeg, image/png]
        data_base64:
          type: string
          description: The file, base64; up to 5 MB decoded.
        remark:
          type: string
          maxLength: 500
          description: What the file is, 3 to 500 characters — required for `others`.

    DocumentReject:
      type: object
      description: Why a document is turned away (KP 1) — the employee sees it.
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500

    ChangeRequest:
      type: object
      description: One profile-change request (E3) — the ask and HR's answer. The ESS records the decision only; it never writes `hr_employees` (ADR-0003).
      required: [id, employee_id, field, old_value, new_value, reason, status, decided_by_name, decided_at, decision_note, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        field:
          type: string
          enum: [date_of_birth, address, legal_name]
        old_value:
          type: [string, 'null']
          description: What the record says now, or null when the person does not know.
        new_value:
          type: string
          description: What it should read.
        reason:
          type: string
        status:
          type: string
          enum: [open, approved, rejected]
        decided_by_name:
          type: [string, 'null']
        decided_at:
          type: [string, 'null']
          format: date-time
        decision_note:
          type: [string, 'null']
          description: HR's note; a rejection's says why, and the employee sees it.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ChangeRequestList:
      type: object
      required: [requests]
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/ChangeRequest'

    ChangeRequestResult:
      type: object
      required: [request]
      properties:
        request:
          $ref: '#/components/schemas/ChangeRequest'

    ChangeRequestCreate:
      type: object
      description: One ask (E3). `old_value` may be left out — "I do not know what it says now".
      required: [field, new_value, reason]
      properties:
        field:
          type: string
          enum: [date_of_birth, address, legal_name]
        old_value:
          type: string
          maxLength: 500
        new_value:
          type: string
          minLength: 1
          maxLength: 500
        reason:
          type: string
          minLength: 5
          maxLength: 1000

    ChangeRequestDecision:
      type: object
      description: HR's answer (E3). A rejection must say why in the note; an approval's note stays optional.
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        note:
          type: string
          maxLength: 1000

    BankDetails:
      type: object
      description: One person's bank details (KP 3). Its owner reads it whole; HR reads the account number masked to its last four digits.
      required: [bank_name, branch_name, account_number, ifsc_code, upi_id, consent_given_at, consent_name, updated_by_name, created_at, updated_at]
      properties:
        bank_name:
          type: string
        branch_name:
          type: [string, 'null']
        account_number:
          type: string
          description: 8 to 18 digits, whole for its owner; `******` plus the last four for HR.
        ifsc_code:
          type: string
          description: The RBI's shape — four letters, a zero, six letters or digits.
        upi_id:
          type: [string, 'null']
        consent_given_at:
          type: string
          format: date-time
          description: When the owner consented, stamped by the server at the save.
        consent_name:
          type: string
          description: The name the owner typed to consent — the proof the entry was made knowingly.
        updated_by_name:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BankDetailsResult:
      type: object
      description: The row, or `null` while none is saved.
      required: [bank_details]
      properties:
        bank_details:
          oneOf:
            - $ref: '#/components/schemas/BankDetails'
            - type: 'null'

    BankDetailsUpdate:
      type: object
      description: 'The save (KP 3). The consent is the entry''s proof: `consent: true` and the person''s own name.'
      required: [bank_name, account_number, ifsc_code, consent, consent_name]
      properties:
        bank_name:
          type: string
          minLength: 2
          maxLength: 120
        branch_name:
          type: string
          maxLength: 120
        account_number:
          type: string
          description: 8 to 18 digits; spaces are ignored.
        ifsc_code:
          type: string
          description: Four letters, a zero, six letters or digits; lower case is accepted and stored upper.
        upi_id:
          type: string
          maxLength: 60
        consent:
          type: boolean
          description: Must be true; anything else is refused.
        consent_name:
          type: string
          maxLength: 120

    IdCard:
      type: object
      description: The staff ID card (Phase 2C), drawn from the HR record.
      required: [full_name, employee_code, designation, department_name, branch_name, photo_url, verify_url]
      properties:
        full_name:
          type: string
        employee_code:
          type: string
        designation:
          type: [string, 'null']
        department_name:
          type: [string, 'null']
        branch_name:
          type: [string, 'null']
        photo_url:
          type: [string, 'null']
          description: A 300-second signed link, or null for no photo.
        verify_url:
          type: string
          description: The path of the verification link (the app prefixes its base URL); the token is HMAC-signed and good for 90 days.

    IdCardResult:
      type: object
      required: [card]
      properties:
        card:
          $ref: '#/components/schemas/IdCard'

    IdCardVerified:
      type: object
      description: What the card shows, to whoever the holder shows it to — nothing else on the record.
      required: [valid, full_name, employee_code, designation, branch_name]
      properties:
        valid:
          type: boolean
        full_name:
          type: string
        employee_code:
          type: string
        designation:
          type: [string, 'null']
        branch_name:
          type: [string, 'null']

    HelpdeskTicketCreate:
      type: object
      description: A raise (G2). Attachments arrive as the Wall's do — up to five, each up to 1 MB decoded.
      required: [category, subject, body]
      properties:
        category:
          type: string
          description: A ticket category's slug, from `GET /ess/helpdesk/categories`.
        subject:
          type: string
          minLength: 3
          maxLength: 200
        body:
          type: string
          minLength: 3
          maxLength: 2000
        anonymous:
          type: boolean
          default: false
          description: 'True: hide the raiser''s name from the team that answers.'
        attachments:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/WallAttachmentInput'

    HelpdeskCommentCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 2000

    HelpdeskCloseCreate:
      type: object
      description: A raiser's close (G2) — why, and optionally how the answer was.
      required: [closing_reason]
      properties:
        closing_reason:
          type: string
          minLength: 3
          maxLength: 280
        rating:
          type: integer
          minimum: 1
          maximum: 5

    HelpdeskStatusUpdate:
      type: object
      description: A team move (G5). Withdrawal and reopening have their own addresses; `open` is where the claim starts from.
      required: [status]
      properties:
        status:
          type: string
          enum: [in_progress, on_hold, resolved]

