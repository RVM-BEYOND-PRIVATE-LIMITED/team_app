    get:
      operationId: listHelpdeskCategories
      tags: [ESS]
      x-owner: ess
      summary: The Helpdesk's category list and its rules (G1)
      description: |
        Either token kind. The ten rows the migration seeds (six ticket categories and four links to flows that are not tickets), and the rules a raise form reads: the reopen window (7 days), the rating range (1 to 5), and whether anonymous raising and attachments are on.

        A non-ticket row carries its `flow`: the app opens that flow instead of a raise form, and raising on one is 400 `HELPDESK_NOT_A_TICKET` (as `POST /ess/helpdesk/tickets` documents). The categories are fixed in code and seeded by the migration, so the form and the server's refusals can never disagree.
      responses:
        '200':
          description: The categories and the rules document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HelpdeskCategories'
              examples:
                defaults:
                  value:
                    categories:
                      - { id: 'ca100000-0000-4000-8000-000000000001', slug: it_lab, name: 'IT and lab equipment', is_ticket: true, flow: null, confidential: false, allows_hold: true, priority: medium, first_response_hours: 8, resolution_hours: 48 }
                      - { id: 'ca100000-0000-4000-8000-000000000006', slug: posh, name: 'POSH complaint', is_ticket: true, flow: null, confidential: true, allows_hold: false, priority: urgent, first_response_hours: 12, resolution_hours: 72 }
                      - { id: 'ca100000-0000-4000-8000-000000000007', slug: leave_link, name: Leave, is_ticket: false, flow: leave, confidential: false, allows_hold: false, priority: medium, first_response_hours: 24, resolution_hours: 72 }
                    settings:
                      categories:
                        - { id: 'ca100000-0000-4000-8000-000000000001', slug: it_lab, name: 'IT and lab equipment', is_ticket: true, flow: null, confidential: false, allows_hold: true, priority: medium }
                        - { id: 'ca100000-0000-4000-8000-000000000006', slug: posh, name: 'POSH complaint', is_ticket: true, flow: null, confidential: true, allows_hold: false, priority: urgent }
                      reopen_days: 7
                      rating: { min: 1, max: 5 }
                      anonymous: true
                      attachments: true
