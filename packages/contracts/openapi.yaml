    post:
      operationId: registerPushDevice
      tags: [ESS]
      x-owner: ess
      summary: Register this phone for push (D5)
      description: |
        Either token kind. Call it after sign-in and on every launch: Firebase can rotate the token. One install is one row — registering a token that another row holds moves it to the caller and lifts any revocation. The token is never sent back.

        Until the `FIREBASE_*` settings exist on the server, pushes are written to the server log instead of being sent (ADR-0016); everything else works.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 20
                  maxLength: 4096
                device_label:
                  type: [string, 'null']
                  maxLength: 80
                install_id:
                  type: [string, 'null']
                  maxLength: 128
            examples:
              pixel:
                value: { token: 'fcm-token-example-0123456789abcdef', device_label: Pixel 8, install_id: install-0123456789abcdef }
      responses:
        '201':
          description: Registered (or re-registered, or moved from another person).
          content:
            application/json:
              schema:
                type: object
                required: [device]
                properties:
                  device:
                    $ref: '#/components/schemas/PushDevice'
              examples:
                registered:
                  value:
                    device:
                      id: 5c4b3a29-1807-4f6e-9d5c-4b3a291807f6
                      platform: android
                      device_label: Pixel 8
                      install_id: install-0123456789abcdef
                      created_at: '2026-10-16T06:30:00+00:00'
                      updated_at: '2026-10-16T06:30:00+00:00'
                      last_seen_at: '2026-10-16T06:30:00+00:00'
        '400':
