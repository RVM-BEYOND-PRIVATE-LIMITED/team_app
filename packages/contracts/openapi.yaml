              $ref: '#/components/examples/EssChangeReason'
            statusFilter:
              $ref: '#/components/examples/EssChangeStatusFilter'
            decision:
              $ref: '#/components/examples/EssChangeDecision'
            note:
              $ref: '#/components/examples/EssChangeNote'
            rejectNote:
              $ref: '#/components/examples/EssChangeRejectNote'
            unknownField:
              $ref: '#/components/examples/EssUnknownField'
            invalidId:
              $ref: '#/components/examples/EssInvalidId'
            invalidJson:
              $ref: '#/components/examples/EssInvalidJson'

    EssChangesConflict:
      description: |
        The request cannot move as asked; nothing is changed.
        - `CHANGE_ALREADY_OPEN`: a second open ask for the same field by the same person.
        - `ALREADY_DECIDED`: a second answer to a request HR has already decided.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            alreadyOpen:
              $ref: '#/components/examples/EssChangeAlreadyOpen'
            alreadyDecided:
              $ref: '#/components/examples/EssAlreadyDecided'

    EssChangeNoSuchRequest:
      description: '`NOT_FOUND`: no change request has this id.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              $ref: '#/components/examples/EssChangeNotFound'

    EssBankBad:
      description: |
        `VALIDATION_FAILED`: the message says which rule — a bank name of 2 to 120, a branch name of up to 120, an account number of 8 to 18 digits, the IFSC's RBI shape, a UPI ID of up to 60, or the consent (`consent: true` and the person's own name in `consent_name`). `INVALID_JSON`, `BAD_REQUEST`: a body the ESS cannot read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            name:
              $ref: '#/components/examples/EssBankName'
            branch:
              $ref: '#/components/examples/EssBankBranch'
            account:
              $ref: '#/components/examples/EssBankAccount'
            ifsc:
              $ref: '#/components/examples/EssBankIfsc'
            upi:
              $ref: '#/components/examples/EssBankUpi'
            consent:
              $ref: '#/components/examples/EssBankConsent'
            consentName:
              $ref: '#/components/examples/EssBankConsentName'
            unknownField:
              $ref: '#/components/examples/EssUnknownField'
            invalidJson:
              $ref: '#/components/examples/EssInvalidJson'

    EssBankNothing:
      description: '`NOT_FOUND`: nobody has saved bank details yet — the person exists, the row does not. The read is still audited.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                error: There is nothing at this address.
                code: NOT_FOUND

    EssIdCardBadToken:
      description: |
        `ID_CARD_BAD_TOKEN`: the verification link is not one of ours — not a token, a forged or mangled one, an expired one (90 days), or one whose holder has left. One answer for every failure, so nobody learns which part failed. This address takes no sign-in; there is nothing to sign out.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badToken:
              $ref: '#/components/examples/EssIdCardBadToken'

    EssIdCardRateLimited:
      description: |
        `RATE_LIMITED`: 30 verification reads a minute from one address, on top of the ESS-wide limits. Wait for `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              $ref: '#/components/examples/EssRateLimited'

    EssClassBad:
      description: |
        `VALIDATION_FAILED`: the message says which rule - a real calendar day, a batch id, a body field, a student once with a true/false mark, an absent reason of 3 to 500 characters, a follow-up of up to 1,000, or a student on this day's roster who is eligible to be marked. `INVALID_JSON`, `BAD_REQUEST`: a body the ESS cannot read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            roster:
              $ref: '#/components/examples/EssClassRoster'
            attendance:
              $ref: '#/components/examples/EssClassAttendance'
            remark:
              $ref: '#/components/examples/EssClassRemark'
            dateFormat:
              $ref: '#/components/examples/EssDateFormat'
            invalidId:
              $ref: '#/components/examples/EssInvalidId'
            unknownField:
              $ref: '#/components/examples/EssUnknownField'
            invalidJson:
              $ref: '#/components/examples/EssInvalidJson'

    EssClassForbidden:
      description: |
        Not a reason to sign out. The token is good; this person cannot mark this batch on this day.
        - `CLASS_ROLE_DENIED`: a role outside teaching (`faculty`, `hod`) and the Scheduler's admin roles (`admin`, `admin_manager`, `hoo`, `accounts_admin`, `ceo`, `super_admin`). An attendance session has no portal role and is refused here too.
        - `CLASS_NOT_YOURS`: another faculty member's batch with no covering substitution, or an admin's batch in another branch.
        - `CLASS_WINDOW`: a day before the batch starts, or after its end date or today (IST).
        - `NOT_AN_EMPLOYEE`, `NOT_LINKED`, `NOT_ACTIVE`, `NO_ATTENDANCE_LOGIN`, `PASSWORD_CHANGE_REQUIRED`: as for `GET /ess/me`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            roleDenied:
              $ref: '#/components/examples/EssClassRoleDenied'
            notYours:
              $ref: '#/components/examples/EssClassNotYours'
            window:
              $ref: '#/components/examples/EssClassWindow'
            notAnEmployee:
              $ref: '#/components/examples/EssNotAnEmployee'
            notLinked:
              $ref: '#/components/examples/EssNotLinked'
            notActive:
              $ref: '#/components/examples/EssNotActive'
            noAttendanceLogin:
              $ref: '#/components/examples/EssNoAttendanceLogin'
            passwordChangeRequired:
              $ref: '#/components/examples/EssPasswordChangeRequired'

    EssClassNotFound:
      description: '`BATCH_NOT_FOUND`: no batch has this id, or it has since gone.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              $ref: '#/components/examples/EssBatchNotFound'

    EssClassConflict:
      description: |
        The day cannot move as asked; nothing is changed.
        - `CLASS_ALREADY_MARKED`: a teaching role saving a batch and day that already has rows. An admin role may correct the day instead.
        - `CLASS_NOT_ABSENT`: a remark for a student who is present, or is not marked at all on that day.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            alreadyMarked:
              $ref: '#/components/examples/EssClassAlreadyMarked'
            notAbsent:
              $ref: '#/components/examples/EssClassNotAbsent'
