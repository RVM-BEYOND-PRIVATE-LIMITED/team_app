  /users/login:
    post:
      operationId: signInPortal
      tags: ['Scheduler (existing)']
      x-owner: scheduler
      x-source: 'routes/user.js:25; controllers/userController.js:263-538; server.js:60-66,119,125'
      summary: Sign in with a portal login
      description: |
        No token. For people with a portal login (a `users` row). Answers with the portal JWT, or with a two-factor challenge when the account has two-factor on.

        How the account is found:
        1. `locationName` must be a branch name the Scheduler knows, or the answer is 404 "Location not found.".
        2. Every account whose username or login phone is exactly `username` is a candidate. None: 404 "User not found. Please check your credentials.".
        3. A single candidate wins. Otherwise the one at the chosen branch, then the one with no branch (HR, the CEO and the like), then a role that sees every branch. Still undecided: the password decides, and if it cannot, 409.
        4. The password is checked. If it is wrong for the chosen account but right for exactly one other candidate, that account signs in instead. Otherwise 401 "Invalid password".
        5. Two-factor on, with a verified email: 200 with a challenge, and the token comes from `POST /users/login/verify`.

        The token lasts 64 hours and cannot be refreshed. Neither a password change nor leaving the company ends it on the Scheduler, and changing that is out of scope (ADR-0018). The ESS refuses an employee who has left (403 `NOT_ACTIVE`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalLoginRequest'
            examples:
              byUsername:
                summary: Username and branch
                value:
                  username: ravi.kumar
                  password: correct horse battery
                  locationName: Faridabad
      responses:
        '200':
          description: Signed in, or a two-factor challenge to finish at `POST /users/login/verify`. Tell them apart by `two_factor_required`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PortalSession'
                  - $ref: '#/components/schemas/TwoFactorChallenge'
              examples:
                signedIn:
                  summary: Signed in
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.PAYLOAD.SIGNATURE
                    user:
                      userId: 6d5c4b3a-2f1e-4d0c-9b8a-7f6e5d4c3b2a
                      username: ravi.kumar
                      role: faculty
                      locationId: 1
                      locationName: Faridabad
                twoFactor:
                  summary: Right password; the account wants the emailed code too
                  value:
                    two_factor_required: true
                    challenge_id: 4a3b2c1d-0e9f-4a8b-9c7d-6e5f4a3b2c1d
                    sent_to: ra•••@rvmcad.org
                    expires_at: '2026-10-16T04:40:00.000+00:00'
                    location_name: Faridabad
        '400':
          description: |
            - "Username, password, and locationName are required" (no code): one of the three is missing or empty.
            - An HTML page, not JSON: the body is not valid JSON (Express's default handler).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                missingField:
                  value:
                    error: Username, password, and locationName are required
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlPage'
        '401':
          description: |
            "Invalid password" (no code): the identifier is known and the password is wrong. This is a failed sign-in, not a session ending: there is no session yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                wrongPassword:
                  value:
                    error: Invalid password
        '403':
          description: |
            "This account cannot sign in. It is a connector identity, not a login." (no code): the reporting bot's account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                connector:
                  value:
                    error: This account cannot sign in. It is a connector identity, not a login.
        '404':
          description: |
            No code on either:
            - "Location not found.": `locationName` is not a branch the Scheduler knows. Also what a database outage looks like here, because the branch is looked up first.
            - "User not found. Please check your credentials.": no account has that username or login phone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                unknownBranch:
                  value:
                    error: Location not found.
                unknownAccount:
                  value:
                    error: User not found. Please check your credentials.
        '409':
          description: |
            "More than one account answers to that name. ..." (no code): several accounts share the identifier, and neither the branch nor the password picks one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                ambiguous:
                  value:
                    error: More than one account answers to that name. Select the branch it belongs to, or ask an administrator to give it a distinct username.
        '429':
          description: |
            No code on either:
            - "Too many login attempts. Please try again in 15 minutes.": 20 requests in 15 minutes from this IP address, successes included, in a bucket shared with `POST /users/login/verify`.
            - "Too many requests. Please slow down.": 300 requests in a minute from this IP address, across all of `/api`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                loginBucket:
                  $ref: '#/components/examples/LoginRateLimited'
                apiBucket:
                  $ref: '#/components/examples/ApiRateLimited'
        '500':
          description: '"Internal server error" (no code): an unexpected failure, for example the account lookup failing.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                unexpected:
                  value:
                    error: Internal server error
        '502':
          description: |
            `MAIL_FAILED`: the password was right and two-factor is on, but the email with the code could not be sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                mailFailed:
                  value:
                    error: 'Two-factor is on for this account but the code could not be sent: The code could not be sent: ZeptoMail answered 500.'
                    code: MAIL_FAILED
        '503':
          description: |
            The password was right and two-factor is on, but no code can be sent:
            - `MAIL_NOT_CONFIGURED`: email is not set up on the server.
            - `TWO_FACTOR_UNAVAILABLE`, or a database error code, when the challenge could not be stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                mailNotConfigured:
                  value:
                    error: 'Two-factor is on for this account but the code could not be sent: Codes are sent by email, and email is not configured on this server yet (missing ZEPTOMAIL_API_TOKEN). Ask whoever runs the server to set ZEPTOMAIL_API_TOKEN and EMAIL_FROM_ADDRESS.'
                    code: MAIL_NOT_CONFIGURED
                challengeNotStored:
                  summary: The database could not be reached while storing the challenge
                  value:
                    error: 'Two-factor is on for this account but the code could not be sent: TypeError: fetch failed'
                    code: TWO_FACTOR_UNAVAILABLE
      x-notes:
        - >-
          The field is called username but takes the username or the login phone number, matched exactly as stored on the users row. A phone typed with +91, a space or a leading 0 does not match one stored as ten digits. Email and employee code are not accepted; when the one sign-in field holds a portal account's email or employee code, the app asks for its username or login phone instead (decision 4, task A5).
        - >-
          There is no public branch list: GET /api/locations needs a token. The web hard-codes Faridabad, Pune, Ahmedabad and Lucknow. An account with no branch (HR, the CEO, a super admin, finance admin) is found from any branch name.
        - >-
          A 404 "Location not found." for a branch that worked before means the database could not be reached: say "try again", not "wrong branch".
        - >-
          Wrong passwords never lock a portal account; only the per-IP bucket applies, and a whole office shares it: about 20 sign-ins in 15 minutes from one office Wi-Fi fill it.
        - >-
          The token's claims (role, locationId, isSuperAdmin) are a snapshot from sign-in. The Scheduler re-reads role and branch from the database on every request, and so does the ESS.

  /users/login/verify:
    post:
      operationId: verifyPortalSignIn
      tags: ['Scheduler (existing)']
      x-owner: scheduler
      x-source: 'routes/user.js:31; controllers/authSecurityController.js:20-31,43-107; services/otp.js:149-192; server.js:60-66,119'
      summary: Finish a two-factor sign-in with the emailed code
      description: |
        No token. The second step when `POST /users/login` answered `two_factor_required: true`. Send the challenge id, the six-digit code from the email, and the `location_name` the challenge carried.

        The code lives 10 minutes and allows 5 wrong tries; the fifth wrong try spends it. Signing in again sends a new code and retires the old one. The token is the same 64-hour portal JWT that `POST /users/login` gives.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginVerifyRequest'
            examples:
              verify:
                value:
                  challenge_id: 4a3b2c1d-0e9f-4a8b-9c7d-6e5f4a3b2c1d
                  code: '482915'
                  location_name: Faridabad
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSession'
              examples:
                signedIn:
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.PAYLOAD.SIGNATURE
                    user:
                      userId: 6d5c4b3a-2f1e-4d0c-9b8a-7f6e5d4c3b2a
                      username: ravi.kumar
                      role: faculty
                      locationId: 1
                      locationName: Faridabad
        '400':
          description: |
            - "The challenge and the code are both required." (no code).
            - `BAD_CODE`: the code is not six digits (spaces are ignored).
            - `NO_LIVE_CODE`: no unspent code for this challenge.
            - `EXPIRED`: the code is older than 10 minutes.
            - `WRONG_CODE`: wrong code; the message says how many tries are left.
            - `ATTEMPTS_EXHAUSTED`: the fifth wrong try; sign in again for a new code.
            - An HTML page, not JSON: the body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                missing:
                  value:
                    error: The challenge and the code are both required.
                badCode:
                  $ref: '#/components/examples/PortalBadCode'
                noLiveCode:
                  $ref: '#/components/examples/PortalNoLiveCode'
                expired:
                  $ref: '#/components/examples/PortalCodeExpired'
                wrongCode:
                  $ref: '#/components/examples/PortalWrongCode'
                exhausted:
                  $ref: '#/components/examples/PortalAttemptsExhausted'
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlPage'
        '404':
          description: '"Account not found." (no code): the account behind the challenge is gone.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                gone:
                  value:
                    error: Account not found.
        '409':
          description: '"Two-factor is not on for this account. Sign in normally." (no code): two-factor was switched off after the challenge was sent.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                twoFactorOff:
                  value:
                    error: Two-factor is not on for this account. Sign in normally.
        '429':
          description: |
            No code on either: the login bucket (20 in 15 minutes per IP address, shared with `POST /users/login`), or 300 a minute across `/api`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                loginBucket:
                  $ref: '#/components/examples/LoginRateLimited'
                apiBucket:
                  $ref: '#/components/examples/ApiRateLimited'
        '500':
          description: '"Could not verify the code." (no code): an unexpected failure, and also any `challenge_id` that is not a uuid, which the database rejects.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                unexpected:
                  value:
                    error: Could not verify the code.
      x-notes:
        - >-
          Send back the location_name the challenge carried. The server does not check it; it only goes into the token and the reply.
        - >-
          WRONG_CODE here has no attempts_left field; the count is only in the message.

