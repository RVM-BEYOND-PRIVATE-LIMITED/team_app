  /ess/attendance-requests:
    servers:
      - url: 'https://{essHost}/api'
        description: The ESS, on its own host name (ADR-0019).
        variables:
          essHost:
            default: team-api.rvmcad.org
            description: The ESS's own host name, chosen by KP on 16 Oct 2026 (ADR-0019).
    post:
      operationId: createMyAttendanceRequest
      tags: [ESS]
      x-owner: ess
      summary: File an attendance request (C1, C3)
      description: |
        Either token kind, with the checks of `GET /ess/me`. Files a request about the caller; the decision is `POST /ess/approvals/attendance/{id}/decide`.

        - `type`: `on_duty` (takes `place`), `fix_a_day` (takes `fix_in` and/or `fix_out`, `HH:MM` 24-hour), `excuse_late`, or `short_leave` (takes `minutes`, whole minutes 1 to 480). Work from home is not offered.
        - `day`: this month or last month. Last month closes at the payroll cut-off: on the 6th and after, it is 409 `REQUEST_CLOSED`; the 5th itself is open.
        - `reason`: 5 to 1,000 characters. Each type takes exactly its own fields: a field of another type is a 400, never ignored.
        - A `fix_a_day` or an `excuse_late` is for a day that has happened; `on_duty` may be filed ahead (its day is written on the day itself).
        - One pending request per type and day: a second is 409 `DUPLICATE_REQUEST`.
        - The month's counter is checked before the row goes in: over the limit HR set is 409 `LIMIT_REACHED`. A short leave counts in minutes against its 180-minute limit. Every form can show allowed, used and remaining from `GET /ess/leave/balances`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, day, reason]
              properties:
                type:
                  type: string
                  enum: [on_duty, fix_a_day, excuse_late, short_leave]
                day:
                  type: string
                  format: date
                reason:
                  type: string
                  minLength: 5
                  maxLength: 1000
                place:
                  type: [string, 'null']
                  maxLength: 120
                  description: On duty only, 1 to 120 characters.
                fix_in:
                  type: [string, 'null']
                  pattern: '^\d{2}:\d{2}$'
                fix_out:
                  type: [string, 'null']
                  pattern: '^\d{2}:\d{2}$'
                minutes:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 480
                  description: Short leave only, whole minutes 1 to 480. Every other type takes none.
            examples:
              onDuty:
                value: { type: on_duty, day: 2026-10-15, reason: College drive at the Pune centre., place: Pune centre }
              fixADay:
                value: { type: fix_a_day, day: 2026-10-15, reason: I forgot to punch out., fix_out: '18:00' }
              shortLeave:
                value: { type: short_leave, day: 2026-10-15, reason: A dental appointment at 10., minutes: 90 }
      responses:
        '201':
          description: Filed. It waits for the approver (the manager on the HR record, or HR).
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request:
                    $ref: '#/components/schemas/AttendanceRequest'
              examples:
                filed:
                  value:
                    request:
                      id: 3f2e1d0c-9b8a-4f7e-8d6c-5b4a3f2e1d0c
                      family: attendance
                      type: on_duty
                      status: pending
                      day: '2026-10-15'
                      reason: College drive at the Pune centre.
                      place: Pune centre
                      fix_in: null
                      fix_out: null
                      minutes: null
                      created_at: '2026-10-14T05:00:00+00:00'
                      decided_at: null
                      decided_by_name: null
                      decision_note: null
                      cancelled_at: null
                      cancelled_by_name: null
                      cancel_reason: null
        '400':
          $ref: '#/components/responses/EssRequestBad'
        '401':
          $ref: '#/components/responses/EssNotAuthenticated'
        '403':
          $ref: '#/components/responses/EssForbidden'
        '409':
          $ref: '#/components/responses/EssRequestConflict'
        '429':
          $ref: '#/components/responses/EssRateLimited'
        '503':
          $ref: '#/components/responses/EssUnavailable'
        default:
          $ref: '#/components/responses/EssUnexpected'
    get:
      operationId: listMyAttendanceRequests
      tags: [ESS]
      x-owner: ess
      summary: My attendance requests
      description: |
        Either token kind. The caller's own requests, newest first, at most 100. Never anybody else's, and never the decider's account id.
      responses:
