    Balances:
      type: object
      required: [month, types]
      properties:
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
        types:
          type: array
          items:
            $ref: '#/components/schemas/BalanceLine'

    RequestLimit:
      type: object
      required: [type, limit_count, limit_minutes, updated_at, updated_by_name]
      properties:
        type:
          $ref: '#/components/schemas/RequestType'
        limit_count:
          type: [integer, 'null']
        limit_minutes:
          type: [integer, 'null']
        updated_at:
          type: string
