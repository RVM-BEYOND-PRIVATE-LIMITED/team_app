                $ref: '#/components/schemas/PersonCard'
        department:
          oneOf:
            - type: object
              required: [id, name, people]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
                people:
                  type: array
                  items:
                    $ref: '#/components/schemas/PersonCard'
