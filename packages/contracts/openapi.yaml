      description: One registered phone. The token is never sent back.
      required: [id, platform, device_label, install_id, created_at, updated_at, last_seen_at]
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum: [android]
        device_label:
          type: [string, 'null']
        install_id:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time

    Notification:
      type: object
      description: One in-app notification. `data` carries the ids a tap needs, never personal data.
      required: [id, category, title, body, data, read_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        category:
          type: string
          enum: [approvals, decisions, priority_tasks]
        title:
          type: string
          minLength: 1
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 1000
        data:
          type: object
        read_at:
          type: [string, 'null']
          format: date-time
