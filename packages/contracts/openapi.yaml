components:

  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        One header, `Authorization: Bearer <token>`, and two kinds of token, both issued by the Scheduler. The app stores whichever its sign-in returned.

        | | Portal JWT | Attendance session |
        | --- | --- | --- |
        | Issued by | `POST /users/login`, or `/users/login/verify` when two-factor is on | `POST /hr/my-attendance/password-login`, `/otp/verify` or `/password` |
        | Who has one | People with a portal login (a `users` row) | Staff with no portal login, on an attendance login HR created |
        | Lifetime | 64 hours, no refresh | 30 days, no refresh |
        | Signed with | HS256 over `JWT_SECRET`; no audience, no issuer | HS256 over a key derived from `JWT_SECRET`; audience `rvm-punch` |
        | Claims | `userId`, `role`, `locationId`, `username`, `locationName`, `isSuperAdmin`; plus `id` (the faculty id) for faculty and HOD | `k: "punch"`, `e` (the hr_employees id), `m: "otp"` or `"pw"` |
        | Works on | Every Scheduler route its role allows, `/hr/my-attendance/*` and the ESS | `/hr/my-attendance/*` and the ESS only |
        | Ended by | Expiry, or the account being deleted. Neither a password change nor leaving the company ends it on the Scheduler | Expiry; a password set or reset (401); HR switching the login off (403 `NO_ATTENDANCE_LOGIN`) |

        - An attendance session sent to any other Scheduler route is refused with 401 "Please authenticate", which the sign-out rule reads as "session over". Never send it outside `/hr/my-attendance/*` and the ESS.
        - The ESS refuses a valid token that is not a staff login with 403 `NOT_AN_EMPLOYEE`: a student token (7 days, `role: "student"`), an admission-undertaking token (issuer `rvmcad-admission-undertaking`), or anything else signed with `JWT_SECRET`.
        - The ESS is stricter about the header than the Scheduler: it takes only `Bearer <token>` exactly, and accepts HS256 only.
        - Do not decide anything from the claims except `exp`. Ask `GET /ess/me` and `GET /ess/me/capabilities`.
        - The refreshable session (task A3) will mint short access tokens in these same two formats, because the Scheduler cannot be changed to accept a new kind (ADR-0006, ADR-0018).

  parameters:
    DeviceCookie:
      name: rvm_att_dev
      in: cookie
      required: false
      description: |
        The registered phone's device token, set by the Scheduler on the first accepted punch (see `POST /hr/my-attendance/punch`). Not set by the app: a persistent cookie jar sends it on every `/api/hr/my-attendance` request, because the cookie's path is `/api/hr/my-attendance`. A value that does not match the pattern is ignored, as if no cookie were sent.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{20,200}$'
    PhoneUserAgent:
      name: User-Agent
      in: header
      required: false
      description: |
        While `ATTENDANCE_MOBILE_ONLY` is on (the default; `rules.mobile_only` in `GET /hr/my-attendance` says so) it must contain Android, iPhone, iPad, iPod or Mobile, in any case, or the punch is refused 403 `NOT_MOBILE`. A missing header, and Dart's default "Dart/3.x (dart:io)", are refused. Set it once on the HTTP client.
      schema:
        type: string
        examples:
          - TeamRVM/1.0.0 (Android 14; Mobile)
    Month:
      name: month
      in: query
      required: false
      description: |
        The month for `days`, `holidays` and `my_remarks`, as YYYY-MM. Defaults to the current IST month. A value that does not match YYYY-MM is ignored; a matching but impossible one (2026-13) answers 500.
      schema:
        type: string
        pattern: '^\d{4}-\d{2}$'
        examples:
          - '2026-10'

  headers:
    RetryAfter:
      description: Seconds until the bucket that refused this request resets.
      schema:
        type: integer
        minimum: 0
    RateLimitPolicy:
      description: The bucket that counted the request last, as `<limit>;w=<window seconds>`, for example `300;w=60`.
      schema:
        type: string
    RateLimitLimit:
      description: That bucket's limit.
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left in that bucket's window.
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until that bucket's window resets.
      schema:
        type: integer
    DeviceCookie:
      description: |
        Only on the punch that registered this phone: `rvm_att_dev=<token>; Path=/api/hr/my-attendance; Max-Age=157680000; HttpOnly; SameSite=Strict; Secure`. Keep it in a persistent cookie jar and never clear it.
      schema:
        type: string
    NoStore:
      description: Always `no-store`; a challenge must never be cached.
      schema:
        type: string
        const: no-store
    WwwAuthenticate:
      description: Always `Bearer` (RFC 6750), naming the scheme that would have worked.
      schema:
        type: string
        const: Bearer

  schemas:

    # ───────────── errors ─────────────

    Error:
      type: object
      description: |
        Every ESS error. `error` is written for staff and is shown as it is; `code` is what the app branches on.
      required: [error, code]
      properties:
        error:
          type: string
          description: A message written for staff. Show it; never parse it.
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
          description: UPPER_SNAKE. Branch on this.

    SchedulerError:
      type: object
      description: |
        A Scheduler error. `error` is written for staff. `code` is present on most errors but not all: each response says which have none. A few refusals add the fields below.
      required: [error]
      properties:
        error:
          type: string
          description: A message written for staff. Show it; never parse it.
        code:
          type: string
          pattern: '^[A-Z0-9_]+$'
          description: Usually UPPER_SNAKE. On the two-factor send failure it can be a database error code instead.
        attempts_left:
          type: integer
          minimum: 1
          description: With `WRONG_CODE` on `otp/verify`, and `WRONG_CREDENTIALS` after a wrong password, the tries left.
        accuracy_m:
          type: integer
          description: With `ACCURACY_LOW`, the accuracy the phone reported, rounded to metres.
        distance_m:
          type: integer
          description: With `OUTSIDE_GEOFENCE`, how far the fix was from the branch, in metres.
        radius_m:
          type: integer
          description: With `OUTSIDE_GEOFENCE`, the branch radius in metres.
        module:
          type: string
          description: With `MODULE_NOT_INSTALLED`, the module (HR).
        migration:
          type: string
          description: With `MODULE_NOT_INSTALLED`, the migration file that creates what is missing.

    HtmlPage:
      type: string
      description: |
        An HTML page, not JSON: nginx while a process restarts, the Scheduler's catch-all for an unknown path, or Express's default error page for malformed JSON. Never treat it as success and never sign out on it.

    # ───────────── ESS ─────────────

    Semver:
      type: [string, 'null']
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
      description: A semantic version such as 1.4.2, or null when not set.

    Health:
      type: object
      required: [ok, server_time, version, min_app_version, latest_app_version, db]
      properties:
        ok:
          type: boolean
          const: true
        server_time:
          type: string
          format: date-time
          description: The server's clock when it answered.
        version:
          type: string
          description: The ESS build that answered.
        min_app_version:
          $ref: '#/components/schemas/Semver'
          description: Older apps must update before going on. Null when not set.
        latest_app_version:
          $ref: '#/components/schemas/Semver'
          description: Older apps may offer an update. Null when not set.
        db:
          type: string
          enum: [ok, unavailable]
          description: The result of a cheap database read with a short timeout.

    Me:
      type: object
      required: [employee, login]
      properties:
        employee:
          $ref: '#/components/schemas/Employee'
        login:
          $ref: '#/components/schemas/Login'

    Employee:
      type: object
      description: The caller's HR record (`hr_employees`). Never carries pay, a phone number or a document path.
      required: [id, full_name, employee_code, designation, employment_status, branch, department, manager]
      properties:
        id:
          type: string
          format: uuid
          description: hr_employees.id. The id every ESS record about this person uses.
        full_name:
          type: string
        employee_code:
          type: [string, 'null']
        designation:
          type: [string, 'null']
        employment_status:
          type: string
          enum: [active, notice_period, probation, confirmed, resigned, fired, terminated]
          description: |
            As stored on the HR record. "exited" never appears, because an employee who has left gets 403 `NOT_ACTIVE`. "notice_period" means serving notice; the last working day is still active. probation, confirmed and resigned are legacy values that no current record carries.
        branch:
          type: [object, 'null']
          description: The HR branch (`hr_branches`), not a Scheduler location.
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        department:
          type: [object, 'null']
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        manager:
          type: [object, 'null']
          description: The reporting manager on the HR record (`manager_id`), who approves this person's requests. Null when none is recorded, in which case HR approves.
          required: [id, full_name]
          properties:
            id:
              type: string
              format: uuid
            full_name:
              type: string

    Login:
      type: object
      required: [kind, role, user_id]
      properties:
        kind:
          type: string
          enum: [portal, attendance]
          description: Which token this request carried.
        role:
          type: [string, 'null']
          enum: [ceo, super_admin, hoo, hod, hod_placement, admin_manager, admin, accounts_admin, hr, hr_executive, faculty, null]
          description: The portal login's role (users.role) as it is now. Null for an attendance session.
        user_id:
          type: [string, 'null']
          format: uuid
          description: users.id of a portal login. Null for an attendance session.

    Capabilities:
      type: object
      required: [tabs, sections, team, approvals, requests, wall, push, integrity]
      properties:
        tabs:
          type: array
          description: The bottom tabs, in display order. All five for every staff login.
          items:
            type: string
            enum: [home, inbox, wall, me, team]
        sections:
          type: object
          required: [time, helpdesk, documents, profile, work]
          properties:
            time:
              type: boolean
              description: Attendance, requests and leave. True for every staff login.
            helpdesk:
              type: boolean
              description: True for every staff login.
            documents:
              type: boolean
              description: True for every staff login.
            profile:
              type: boolean
              description: True for every staff login.
            work:
              type: boolean
              description: The teaching and leadership section. True for faculty, hod, hod_placement, hoo, super_admin and ceo; false for admin, admin_manager, accounts_admin, hr, hr_executive and attendance-only staff.
        team:
          type: object
          required: [has_reports, direct_reports]
          properties:
            has_reports:
              type: boolean
              description: True when direct_reports is above 0.
            direct_reports:
              type: integer
              minimum: 0
              description: Active employees whose manager_id is the caller.
        approvals:
          type: object
          required: [own_reports, any_request, request_types, hr_scope]
          properties:
            own_reports:
              type: boolean
              description: The caller decides their direct reports' requests (true when direct_reports is above 0).
            any_request:
              type: boolean
              description: The caller may decide anyone's request, recorded as HR's decision. True for hr, ceo and super_admin only; never for hr_executive.
            request_types:
              type: array
              description: The request types this person may decide. Every offered type when any_request or own_reports is true; otherwise empty.
              items:
                $ref: '#/components/schemas/RequestType'
            hr_scope:
              type: array
              description: HR review queues. hr gets all four; hr_executive gets documents, profile_changes and helpdesk_hr; everyone else none.
              items:
                type: string
                enum: [attendance, documents, profile_changes, helpdesk_hr]
        requests:
          type: object
          required: [types, payroll_cutoff_day, reach_back_months]
          properties:
            types:
              type: array
              description: Every request type, offered or not, with its monthly limit. One entry per type.
              items:
                $ref: '#/components/schemas/RequestTypePolicy'
            payroll_cutoff_day:
              type: integer
              minimum: 1
              maximum: 28
              description: The day of the current month (IST) on which requests for last month close; 5 (KP, 16 Oct). Whether the 5th itself is still open is to be confirmed with KP (docs/03-decisions.md).
            reach_back_months:
              type: integer
              minimum: 0
              description: How many months back a request may reach besides the current one. 1 (this month and last month).
        wall:
          type: object
          required: [post, announce, moderate]
          properties:
            post:
              type: boolean
              description: Post, comment, react, praise and run polls. True for every staff login.
            announce:
              type: boolean
              description: Post announcements. True for hr, ceo and super_admin.
            moderate:
              type: boolean
              description: Hide anything, with a reason. True for hr.
        push:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
              description: True only when the server has its FIREBASE_* settings (ADR-0016). Until then notifications go to the server log instead.
        integrity:
          type: object
          required: [required]
          properties:
            required:
              type: boolean
              description: Whether a Play Integrity token is required. False until a Play project exists (ADR-0016).

    RequestType:
      type: string
      enum: [on_duty, fix_a_day, excuse_late, short_leave, leave_cl, leave_lwp, wfh]
      description: |
        on_duty: working away from the branch for the day. fix_a_day: correct a day's attendance. excuse_late: excuse a late arrival. short_leave: short leave, counted in minutes (Phase 2). leave_cl: casual leave. leave_lwp: leave without pay. wfh: work from home, not offered.

    RequestTypePolicy:
      type: object
      description: |
        One request type and its monthly limit, per employee per calendar month (KP, 16 Oct). Today: on_duty no limit; fix_a_day 3; excuse_late 3; short_leave 180 minutes (phase 2); leave_cl 1; leave_lwp no limit set (still open); wfh not offered, limit 0.
      required: [type, offered, limit, unit, phase]
      properties:
        type:
          $ref: '#/components/schemas/RequestType'
        offered:
          type: boolean
          description: False means the type is hidden in the app.
        limit:
          type: [integer, 'null']
          minimum: 0
          description: The monthly limit in `unit`. Null means no limit.
        unit:
          type: string
          enum: [count, minutes]
        phase:
          type: integer
          enum: [1, 2]
          description: The build phase that delivers this type (ADR-0013).

    # ───────────── Scheduler: portal sign-in ─────────────

    UserRole:
      type: string
      enum: [ceo, super_admin, hoo, hod, hod_placement, admin_manager, admin, accounts_admin, hr, hr_executive, faculty]
      description: A Scheduler portal role (users.role) that can sign in. Students have their own token, and the connector account cannot sign in.

    PortalLoginRequest:
      type: object
      required: [username, password, locationName]
      properties:
        username:
          type: string
          minLength: 1
          description: The username or the login phone number, matched exactly as stored. Not an email, not an employee code.
        password:
          type: string
          minLength: 1
        locationName:
          type: string
          minLength: 1
          description: A branch name exactly as the Scheduler stores it (the web offers Faridabad, Pune, Ahmedabad and Lucknow). It decides between accounts that share an identifier, and goes into the token.

    PortalSession:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: The portal JWT. 64 hours, no refresh.
        user:
          type: object
          required: [userId, username, role, locationId, locationName]
          properties:
            userId:
              type: string
              format: uuid
            username:
              type: [string, 'null']
              description: Null for an account that signs in by phone only.
            role:
              $ref: '#/components/schemas/UserRole'
            locationId:
              type: [integer, 'null']
              description: The account's Scheduler branch; null for accounts with no branch.
            locationName:
              type: [string, 'null']
              description: The branch name that was typed (sign-in) or echoed (verify), not checked against locationId.

    TwoFactorChallenge:
      type: object
      required: [two_factor_required, challenge_id, sent_to, expires_at, location_name]
      properties:
        two_factor_required:
          type: boolean
          const: true
        challenge_id:
          type: string
          format: uuid
        sent_to:
          type: string
          description: The email the code went to, masked, for example ra•••@rvmcad.org.
        expires_at:
          type: string
          format: date-time
        location_name:
          type: string
          description: The branch name from the sign-in, to send back to `/users/login/verify`.

    LoginVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^\s*(\d\s*){6}$'
          description: The six digits from the email; spaces are ignored.
        location_name:
          type: [string, 'null']
          description: The challenge's location_name, sent back unchanged.

    ForgotPasswordRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          description: A username or the account's email. A missing or unknown one still answers 200.

    ForgotPasswordConfirmRequest:
      type: object
      required: [identifier, code, new_password]
      properties:
        identifier:
          type: string
          description: The same identifier as the request step.
        code:
          type: string
          pattern: '^\s*(\d\s*){6}$'
        new_password:
          type: string
          minLength: 8
        confirm_password:
          type: string
          description: Optional. When present it must equal new_password.

    OkMessage:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
          const: true
        message:
          type: string

    MessageOnly:
      type: object
      required: [message]
      properties:
        message:
          type: string

    LegacyResetPasswordRequest:
      type: object
      description: The retired reset's body at `c28b9ca`. Never send it.
      required: [username, phone_number, new_password]
      properties:
        username:
          type: string
        phone_number:
          type: string
        locationName:
          type: string
        new_password:
          type: string

    # ───────────── Scheduler: attendance sign-in ─────────────

    AttendancePasswordLoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          description: The main phone on the HR record (+91, 91 or a leading 0 allowed), the email on it, or the employee code (any case).
        password:
          type: string
          minLength: 1

    AttendanceCodeRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 1
          description: The main phone on the HR record (a ten-digit Indian mobile; +91, 91 or a leading 0 allowed), or the email on it.

    AttendanceCodeSent:
      type: object
      required: [challenge_id, channel, sent_to, expires_at, ttl_minutes, sandbox]
      properties:
        challenge_id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [sms, email]
        sent_to:
          type: string
          description: Where the code went, masked (••••••2345, or ra•••@rvmcad.org).
        expires_at:
          type: string
          format: date-time
        ttl_minutes:
          type: integer
          description: How long the code lives, in minutes. Always 10 at c28b9ca.
        sandbox:
          type: boolean
          description: True when the server is in console mode and the code was logged, not delivered.

    AttendanceCodeVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^\s*(\d\s*){6}$'
          description: The six digits; spaces are ignored.

    AttendanceSession:
      type: object
      required: [token, expires_in_days, employee, password_set, temporary]
      properties:
        token:
          type: string
          description: The attendance session. Opens /hr/my-attendance/* and /ess/* only.
        expires_in_days:
          type: integer
          description: How long the session lasts, in days. Always 30 at c28b9ca.
        employee:
          type: object
          required: [full_name]
          properties:
            full_name:
              type: string
        password_set:
          type: boolean
          description: False when the login has no password at all; offer to set one.
        temporary:
          type: boolean
          description: True while the password is still the one HR gave.

    AttendanceSetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: At least 8 characters and at most 72 bytes; not one character repeated; not containing the main phone's ten digits; not HR's first-time password.

    AttendancePasswordSet:
      type: object
      required: [token, password_set]
      properties:
        token:
          type: string
          description: A fresh 30-day attendance session. Every older session of this login no longer works.
        password_set:
          type: boolean
          const: true

    # ───────────── Scheduler: attendance ─────────────

    MyAttendance:
      oneOf:
        - $ref: '#/components/schemas/MyAttendanceUnlinked'
        - $ref: '#/components/schemas/MyAttendanceMustSetPassword'
        - $ref: '#/components/schemas/MyAttendanceMonth'

    MyAttendanceUnlinked:
      type: object
      description: A portal login with no HR record linked.
      required: [linked, message]
      properties:
        linked:
          type: boolean
          const: false
        message:
          type: string

    MyAttendanceMustSetPassword:
      type: object
      description: A password session still on HR's first-time password. Show only "Choose your own password".
      required: [linked, must_set_password, employee]
      properties:
        linked:
          type: boolean
          const: true
        must_set_password:
          type: boolean
          const: true
        employee:
          type: object
          required: [id, full_name, employee_code]
          properties:
            id:
              type: string
              format: uuid
            full_name:
              type: string
            employee_code:
              type: [string, 'null']

    MyAttendanceMonth:
      type: object
      required: [linked, employee, branch, shift, week_off_days, holidays, upcoming_holidays, my_remarks, today, device, rules, month, days]
      properties:
        linked:
          type: boolean
          const: true
        employee:
          type: object
          required: [id, full_name, employee_code, geofence_exempt]
          properties:
            id:
              type: string
              format: uuid
            full_name:
              type: string
            employee_code:
              type: [string, 'null']
            geofence_exempt:
              type: boolean
              description: Field staff. The radius is not enforced; the location is still recorded.
        branch:
          type: [object, 'null']
          required: [id, name, latitude, longitude, radius_m, configured]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            latitude:
              type: [number, 'null']
            longitude:
              type: [number, 'null']
            radius_m:
              type: integer
              description: The geofence radius in metres (25 to 2000; 150 unless HR set it).
            configured:
              type: boolean
              description: False until HR sets the branch's location; punches are then refused BRANCH_NOT_CONFIGURED unless geofence-exempt.
        shift:
          type: [object, 'null']
          description: The employee's shift. Null when they are not on one (they are marked by hand) or before migration 20261022000000.
          required: [name, start, end, grace_minutes]
          properties:
            name:
              type: string
            start:
              type: string
              pattern: '^\d{2}:\d{2}$'
              description: HH:MM, IST.
            end:
              type: string
              pattern: '^\d{2}:\d{2}$'
              description: HH:MM, IST.
            grace_minutes:
              type: integer
        week_off_days:
          type: [array, 'null']
          description: Weekly offs, 0 = Sunday to 6 = Saturday. Null before migration 20261022000000.
          items:
            type: integer
            minimum: 0
            maximum: 6
        holidays:
          type: array
          description: The month's holidays for the employee's branch or for every branch.
          items:
            $ref: '#/components/schemas/Holiday'
        upcoming_holidays:
          type: array
          description: The next holidays from today, up to 120 days ahead and at most 12.
          maxItems: 12
          items:
            $ref: '#/components/schemas/Holiday'
        my_remarks:
          type: array
          description: The employee's own remarks on the month's days.
          items:
            type: object
            required: [day, remarks, updated_at]
            properties:
              day:
                type: string
                format: date
              remarks:
                type: string
              updated_at:
                type: string
                format: date-time
        today:
          $ref: '#/components/schemas/Today'
        device:
          type: object
          required: [this_phone, has_registered_phone, registered_at]
          properties:
            this_phone:
              type: string
              enum: [own, other, revoked, unknown]
              description: What the rvm_att_dev cookie on this request says about this phone.
            has_registered_phone:
              type: boolean
              description: Whether the employee has an active registered phone, this one or another.
            registered_at:
              type: [string, 'null']
              format: date-time
        rules:
          type: object
          required: [max_accuracy_m, mobile_only]
          properties:
            max_accuracy_m:
              type: number
              description: A fix vaguer than this is refused ACCURACY_LOW.
            mobile_only:
              type: boolean
              description: Whether a punch needs a phone User-Agent.
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
        days:
          type: array
          description: The month's day rows, oldest first.
          items:
            $ref: '#/components/schemas/DayRow'

    Holiday:
      type: object
      required: [day, name]
      properties:
        day:
          type: string
          format: date
        name:
          type: string

    DayStatus:
      type: string
      enum: [present, absent, half_day, leave, week_off, holiday]

    Today:
      type: object
      description: Today (IST), from today's accepted punches and today's day row.
      required: [day, punched_in, done, first_in, last_out, punches, worked_minutes, kind, holiday, status, late_minutes, early_exit_minutes, late_count, late_half_day, late_excused]
      properties:
        day:
          type: string
          format: date
        punched_in:
          type: boolean
          description: The last accepted punch today was an in.
        done:
          type: boolean
          description: Punched out; no more punches until IST midnight (DAY_DONE).
        first_in:
          type: [string, 'null']
          format: date-time
        last_out:
          type: [string, 'null']
          format: date-time
        punches:
          type: array
          items:
            type: object
            required: [kind, at, distance_m]
            properties:
              kind:
                type: string
                enum: [in, out]
              at:
                type: string
                format: date-time
              distance_m:
                type: [number, 'null']
        worked_minutes:
          type: integer
          minimum: 0
          description: Counts up to the moment of the request while punched in.
        kind:
          type: string
          enum: [no_shift, holiday, week_off, working]
          description: What today is on the shift rules. no_shift means the employee is not on a shift and is marked by hand.
        holiday:
          type: [string, 'null']
          description: Today's holiday name.
        status:
          oneOf:
            - $ref: '#/components/schemas/DayStatus'
            - type: 'null'
        late_minutes:
          type: [integer, 'null']
        early_exit_minutes:
          type: [integer, 'null']
        late_count:
          type: [integer, 'null']
          description: Which late arrival of the month today is.
        late_half_day:
          type: boolean
          description: Today became a half day as the month's third late arrival.
        late_excused:
          type: boolean

    DayRow:
      type: object
      description: |
        One day's record (hr_staff_attendance). The fields from late_minutes on arrive with migration 20261022000000 and are missing before it.
      required: [day, status, leave_type, source, first_in, last_out, worked_minutes]
      properties:
        day:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/DayStatus'
        leave_type:
          type: [string, 'null']
          description: cl, lwp, leave, or an older free-text type.
        source:
          type: string
          enum: [manual, self_punch, override, auto]
          description: Who wrote the row. override is HR's word on the day; auto is the nightly job.
        first_in:
          type: [string, 'null']
          format: date-time
        last_out:
          type: [string, 'null']
          format: date-time
        worked_minutes:
          type: [integer, 'null']
        late_minutes:
          type: [integer, 'null']
        early_exit_minutes:
          type: [integer, 'null']
        late_count:
          type: [integer, 'null']
        late_half_day:
          type: boolean
        late_excused:
          type: boolean
        shift_start:
          type: [string, 'null']
          description: HH:MM:SS, the shift the day is judged by.
        shift_end:
          type: [string, 'null']
          description: HH:MM:SS.

    PunchChallenge:
      type: object
      required: [nonce, expires_at]
      properties:
        nonce:
          type: string
          description: Send it unchanged as the punch's nonce.
        expires_at:
          type: string
          format: date-time
          description: Two minutes after issue.

    PunchRequest:
      type: object
      required: [kind, nonce, latitude, longitude, accuracy_m]
      properties:
        kind:
          type: string
          enum: [in, out]
        nonce:
          type: string
          description: The nonce from GET /hr/my-attendance/challenge, unchanged.
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracy_m:
          type: number
          minimum: 0
          description: The fix's horizontal accuracy in metres. Required.
        client_at:
          type: string
          format: date-time
          description: The phone's clock at the fix. Kept beside the server time and never trusted.
        note:
          type: string
          description: The employee's own word on the punch, for HR. Trimmed and cut to 200 characters without an error; never changes how the punch is judged.

    PunchAccepted:
      type: object
      required: [kind, at, distance_m, inside_geofence, flags, device_registered, today]
      properties:
        kind:
          type: string
          enum: [in, out]
        at:
          type: string
          format: date-time
          description: The server's time of the punch.
        distance_m:
          type: [integer, 'null']
          description: Metres from the branch; null when the branch has no location (geofence-exempt staff).
        inside_geofence:
          type: [boolean, 'null']
        flags:
          type: array
          items:
            type: string
            enum: [new_device, suspicious_accuracy, exempt_outside, off_network, possible_proxy]
        device_registered:
          type: boolean
          description: True when this punch registered the phone and set the rvm_att_dev cookie.
        today:
          type: object
          description: The day after this punch. The fields after punched_in are missing before migration 20261022000000 or when the day has no row.
          required: [worked_minutes, punched_in]
          properties:
            worked_minutes:
              type: integer
              minimum: 0
            punched_in:
              type: boolean
            status:
              $ref: '#/components/schemas/DayStatus'
            late_minutes:
              type: [integer, 'null']
            early_exit_minutes:
              type: [integer, 'null']
            late_count:
              type: [integer, 'null']
            late_half_day:
              type: boolean

    PingRequest:
      type: object
      required: [latitude, longitude, accuracy_m]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracy_m:
          type: number
          minimum: 0

    PingStored:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    RemarkRequest:
      type: object
      required: [day]
      properties:
        day:
          type: string
          format: date
          description: From the 1st of last month to today, IST.
        remarks:
          type: [string, 'null']
          description: Up to 500 characters after trimming. Empty, null or missing removes the remark.

    RemarkSaved:
      type: object
      required: [day, remarks]
      properties:
        day:
          type: string
          format: date
        remarks:
          type: [string, 'null']
          description: Null when the remark was removed.
        updated_at:
          type: string
          format: date-time
          description: Present when the remark was saved.

  examples:

    # ───────────── ESS ─────────────

    EssSignIn:
      summary: No token
      value:
        error: Please sign in.
        code: NOT_AUTHENTICATED
    EssNotAuthenticated:
      summary: An expired token
      value:
        error: Your sign-in has expired. Please sign in again.
        code: NOT_AUTHENTICATED
    EssSignInAgain:
      summary: A forged or malformed token, or one whose account is gone
      value:
        error: Please sign in again.
        code: NOT_AUTHENTICATED
    EssPasswordChanged:
      summary: An attendance session older than the last password change
      value:
        error: Your password was changed. Please sign in again.
        code: NOT_AUTHENTICATED
    EssNotAnEmployee:
      summary: A valid token that is not a staff login
      value:
        error: Team RVM is for staff. Sign in with your staff login.
        code: NOT_AN_EMPLOYEE
    EssNotLinked:
      summary: A portal login with no HR record linked
      value:
        error: Your login is not linked to an employee record yet. Ask HR or the tech team to link it.
        code: NOT_LINKED
    EssNotActive:
      summary: The employee has left
      value:
        error: Your employee record is no longer active, so Team RVM is closed for this login. Ask HR if this is wrong.
        code: NOT_ACTIVE
    EssNoAttendanceLogin:
      summary: The attendance login is missing
      value:
        error: You do not have an attendance login yet. Ask HR to create one for you.
        code: NO_ATTENDANCE_LOGIN
    EssAttendanceLoginOff:
      summary: HR switched the attendance login off
      value:
        error: Your attendance login is turned off. Ask HR.
        code: NO_ATTENDANCE_LOGIN
    EssRateLimited:
      value:
        error: Too many requests. Wait a minute and try again.
        code: RATE_LIMITED
    EssUnavailable:
      summary: The database could not be reached
      value:
        error: The server cannot reach the database right now. Try again in a minute.
        code: UNAVAILABLE
    EssModuleDisabled:
      summary: ESS_ENABLED is "false"
      value:
        error: Team RVM is switched off on the server for now. Try again later.
        code: MODULE_DISABLED
    EssNotInstalled:
      summary: The code is live before its migration
      value:
        error: Team RVM needs a database update that has not been applied yet (it cannot read hr_employees). Ask the tech team.
        code: MODULE_NOT_INSTALLED

    # ───────────── Scheduler ─────────────

    NoTokenProvided:
      summary: No Authorization header (no code)
      value:
        error: No token provided
    PleaseAuthenticate:
      summary: A rejected token, or a failed user lookup (no code)
      value:
        error: Please authenticate
    PunchPleaseSignIn:
      summary: No caller could be identified (defensive)
      value:
        error: Please sign in.
        code: NOT_AUTHENTICATED
    PunchSignInAgain:
      summary: The attendance session's employee record is gone
      value:
        error: Please sign in again.
        code: NOT_AUTHENTICATED
    PunchPasswordChanged:
      summary: The attendance session predates the last password change
      value:
        error: Your password was changed. Please sign in again.
        code: NOT_AUTHENTICATED
    PunchNotLinked:
      value:
        error: Your login is not linked to an employee record yet. Ask HR or the tech team to link it.
        code: NOT_LINKED
    PunchNotActive:
      value:
        error: Your employee record is not active, so punching is closed.
        code: NOT_ACTIVE
    NoAttendanceLoginYet:
      value:
        error: You do not have an attendance login yet. Ask HR to create one for you.
        code: NO_ATTENDANCE_LOGIN
    NoAttendanceLoginOff:
      value:
        error: Your attendance login is turned off. Ask HR.
        code: NO_ATTENDANCE_LOGIN
    HasPortalLogin:
      value:
        error: You have a portal login. Sign in to the portal and use the Punch button at the top.
        code: HAS_PORTAL_LOGIN
    NotMainPhone:
      value:
        error: This number is on your employee record as an extra number, not the main one. Ask HR to set it as your main phone number, or sign in with your email.
        code: NOT_MAIN_PHONE
    PasswordChangeRequired:
      value:
        error: Set your own password first. The password HR gave you only works once.
        code: PASSWORD_CHANGE_REQUIRED
    DeviceNotRegistered:
      value:
        error: Your attendance is registered to a different phone. Ask HR to reset your phone if you have changed it.
        code: DEVICE_NOT_REGISTERED
    HrModuleDisabled:
      summary: HR_MODULE_ENABLED=false
      value:
        error: The HR module is currently disabled.
        code: MODULE_DISABLED
    PunchNotInstalled:
      value:
        error: Punch attendance is not installed yet. Apply migration 20261020000000_hr_attendance_punch.sql.
        code: MODULE_NOT_INSTALLED
        module: HR
        migration: 20261020000000_hr_attendance_punch.sql
    AccountsNotInstalled:
      value:
        error: Attendance logins are not installed yet. Apply migration 20261021000000_hr_attendance_accounts.sql.
        code: MODULE_NOT_INSTALLED
        module: HR
        migration: 20261021000000_hr_attendance_accounts.sql
    RulesNotInstalled:
      value:
        error: Shifts and late rules are not installed yet. Apply migration 20261022000000_hr_attendance_shifts.sql.
        code: MODULE_NOT_INSTALLED
        module: HR
        migration: 20261022000000_hr_attendance_shifts.sql
    ApiRateLimited:
      summary: 300 a minute across /api (no code)
      value:
        error: Too many requests. Please slow down.
    LoginRateLimited:
      summary: 20 in 15 minutes per IP address (no code)
      value:
        error: Too many login attempts. Please try again in 15 minutes.
    CodeRequestsRateLimited:
      summary: 10 in 15 minutes per IP address (no code)
      value:
        error: Too many code requests. Wait fifteen minutes and try again.
    AttendanceSignInRateLimited:
      summary: 40 in 15 minutes per IP address
      value:
        error: Too many sign-in attempts from this network. Wait fifteen minutes and try again.
        code: RATE_LIMITED
    PortalBadCode:
      value:
        error: Enter the six-digit code from the email.
        code: BAD_CODE
    PortalNoLiveCode:
      value:
        error: No code is waiting. Request a new one.
        code: NO_LIVE_CODE
    PortalCodeExpired:
      value:
        error: That code has expired. Request a new one.
        code: EXPIRED
    PortalWrongCode:
      value:
        error: Wrong code. 4 attempts left.
        code: WRONG_CODE
    PortalAttemptsExhausted:
      value:
        error: Too many wrong codes. Request a new one.
        code: ATTEMPTS_EXHAUSTED

  responses:

    # ───────────── ESS ─────────────

    EssNotAuthenticated:
      description: |
        `NOT_AUTHENTICATED`: the token is absent or rejected. That means no token, a bad signature, an expired token, a wrong algorithm, an attendance session issued before its login's `sessions_valid_from`, or a token whose account no longer exists (including a teaching account whose faculty id no longer matches its token). **This is the only reply on which the app signs out.** The ESS never sends it for a database outage.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            noToken:
              $ref: '#/components/examples/EssSignIn'
            expired:
              $ref: '#/components/examples/EssNotAuthenticated'
            rejected:
              $ref: '#/components/examples/EssSignInAgain'
            passwordChanged:
              $ref: '#/components/examples/EssPasswordChanged'

    EssForbidden:
      description: |
        The token is good, but this person cannot use Team RVM as things stand. Show the message; do not sign out on its own.
        - `NOT_AN_EMPLOYEE`: a valid token that is not a staff login (a student or admission-undertaking token), or a portal token whose account is not staff (the connector account).
        - `NOT_LINKED`: a portal login with no linked HR record; HR links it.
        - `NOT_ACTIVE`: the employee has left.
        - `NO_ATTENDANCE_LOGIN`: an attendance session whose login is missing or switched off.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notAnEmployee:
              $ref: '#/components/examples/EssNotAnEmployee'
            notLinked:
              $ref: '#/components/examples/EssNotLinked'
            notActive:
              $ref: '#/components/examples/EssNotActive'
            noAttendanceLogin:
              $ref: '#/components/examples/EssNoAttendanceLogin'
            attendanceLoginOff:
              $ref: '#/components/examples/EssAttendanceLoginOff'

    EssRateLimited:
      description: |
        `RATE_LIMITED`: more than 600 requests in a minute from this IP address (every path, counted before the token is checked), or more than 120 in a minute from this employee (after it). Wait for `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              $ref: '#/components/examples/EssRateLimited'

    EssUnavailable:
      description: |
        Not a reason to sign out; keep the session and try again later.
        - `UNAVAILABLE`: the database could not be reached, or answered something the ESS could not use.
        - `MODULE_DISABLED`: the ESS is switched off (`ESS_ENABLED=false`), checked before the token. The Scheduler's sign-in and punching still work.
        - `MODULE_NOT_INSTALLED`: a table or column this needs is missing, in the window between a deploy and KP applying its migration (ADR-0021).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unavailable:
              $ref: '#/components/examples/EssUnavailable'
            moduleDisabled:
              $ref: '#/components/examples/EssModuleDisabled'
            notInstalled:
              $ref: '#/components/examples/EssNotInstalled'

    EssUnexpected:
      description: |
        Any other failure, in the same `{ error, code }` body. Today these are 404 `NOT_FOUND` for an address the ESS does not have, or a method it does not take there (OPTIONS included); 400 `INVALID_JSON` or `BAD_REQUEST`, 413 `PAYLOAD_TOO_LARGE` and 415 `UNSUPPORTED_MEDIA_TYPE` for a body it cannot read; and 500 `INTERNAL_ERROR` for a fault on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                error: There is nothing at this address.
                code: NOT_FOUND
            internal:
              value:
                error: Something went wrong on the server. Try again, and tell the tech team if it keeps happening.
                code: INTERNAL_ERROR

    # ───────────── Scheduler ─────────────

    PunchAuthRejected:
      description: |
        The session is over, or the token was never good. Sign out on each of these, after the one check that the info section describes for "Please authenticate":
        - "No token provided" (no code): no `Authorization` header, or an empty one.
        - "Please authenticate" (no code): the token is neither a valid attendance session nor a valid portal token (expired, a bad signature, malformed, or its account is gone). An expired attendance session lands here, not on `NOT_AUTHENTICATED`. **Also sent when the Scheduler's user lookup fails during a database outage**, which is why the check comes first.
        - `NOT_AUTHENTICATED` "Please sign in again.": the attendance session's employee record no longer exists.
        - `NOT_AUTHENTICATED` "Your password was changed. Please sign in again.": the attendance session predates the last password set or reset.
        - `NOT_AUTHENTICATED` "Please sign in.": no caller could be identified (defensive; not expected).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchedulerError'
          examples:
            noToken:
              $ref: '#/components/examples/NoTokenProvided'
            pleaseAuthenticate:
              $ref: '#/components/examples/PleaseAuthenticate'
            signInAgain:
              $ref: '#/components/examples/PunchSignInAgain'
            passwordChanged:
              $ref: '#/components/examples/PunchPasswordChanged'
            pleaseSignIn:
              $ref: '#/components/examples/PunchPleaseSignIn'

    PunchIdentityForbidden:
      description: |
        - `NOT_LINKED`: a portal login with no HR record linked.
        - `NOT_ACTIVE`: the employee record is no longer active.
        - `NO_ATTENDANCE_LOGIN`: an attendance session whose login is missing or switched off.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchedulerError'
          examples:
            notLinked:
              $ref: '#/components/examples/PunchNotLinked'
            notActive:
              $ref: '#/components/examples/PunchNotActive'
            noLogin:
              $ref: '#/components/examples/NoAttendanceLoginYet'
            loginOff:
              $ref: '#/components/examples/NoAttendanceLoginOff'

    SchedulerApiRateLimited:
      description: '"Too many requests. Please slow down." (no code): 300 requests in a minute from this IP address, across all of `/api`.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchedulerError'
          examples:
            apiBucket:
              $ref: '#/components/examples/ApiRateLimited'

    HrUnavailable:
      description: |
        Not a reason to sign out.
        - `MODULE_DISABLED`: the HR module is switched off (`HR_MODULE_ENABLED=false`), which switches all of `/hr/my-attendance` off, sign-in included.
        - `MODULE_NOT_INSTALLED`: a table, column or function this needs is missing, in the window between a deploy and KP applying its migration. `migration` names the file.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchedulerError'
          examples:
            moduleDisabled:
              $ref: '#/components/examples/HrModuleDisabled'
            punchNotInstalled:
              $ref: '#/components/examples/PunchNotInstalled'
            accountsNotInstalled:
              $ref: '#/components/examples/AccountsNotInstalled'
