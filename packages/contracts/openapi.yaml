  /hr/my-attendance/punch:
    post:
      operationId: punch
      tags: ['Scheduler (existing)']
      x-owner: scheduler
      x-source: 'routes/hr.js:66-74,201; controllers/hr/attendancePunchController.js:68-86,141-175,298-485; services/attendancePunch.js:16-90,104-153'
      summary: Punch in or out
      description: |
        Either token kind. Judged in this order; the first failure answers. Every refusal marked * is stored as a refused attempt, which HR sees, before the reply.
        1. Who: 401, or 403 `NOT_LINKED`, `NOT_ACTIVE`, `NO_ATTENDANCE_LOGIN`.
        2. 403 `PASSWORD_CHANGE_REQUIRED`: a password session still on HR's first-time password.
        3. 400 `VALIDATION_FAILED`: `kind` is not "in" or "out".
        4. 403 `NOT_MOBILE`*: the User-Agent is not a phone's.
        5. The phone: 403 `DEVICE_OTHER_EMPLOYEE`* (registered to someone else), 403 `DEVICE_REVOKED`* (HR reset it), 403 `DEVICE_NOT_REGISTERED`* (no cookie, or an unknown one, while the employee already has a registered phone).
        6. The challenge: 400 `CHALLENGE_MISSING`*, `CHALLENGE_INVALID`* (not genuine, or another employee's), `CHALLENGE_EXPIRED`*; 409 `CHALLENGE_REUSED`* (an accepted punch already used it).
        7. The fix: 422 `LOCATION_MISSING`*; 422 `ACCURACY_LOW`* when `accuracy_m` is above `rules.max_accuracy_m` (100 unless the server says otherwise).
        8. The radius, skipped for geofence-exempt staff: 422 `BRANCH_NOT_CONFIGURED`* (no branch, or no coordinates for it), 422 `OUTSIDE_GEOFENCE`*.
        9. In and out alternate, one session a day: 409 `ALREADY_IN`*, 409 `DAY_DONE`* (already punched out today), 409 `NOT_IN`*.

        Then a phone with no registration becomes the employee's phone (Set-Cookie on the reply), the punch is stored, and the day is rolled up into the daily record.

        Flags are recorded and never refuse: `new_device`, `suspicious_accuracy` (accuracy exactly 0), `exempt_outside`, `off_network`, `possible_proxy`.
      parameters:
        - $ref: '#/components/parameters/DeviceCookie'
        - $ref: '#/components/parameters/PhoneUserAgent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PunchRequest'
            examples:
              punchIn:
                value:
                  kind: in
                  nonce: eyJlIjoiOWIyZjRjMWUtNWEzZCIsIngiOjE3OTI0fQ.c2lnbmF0dXJlLW9mLXRoZS1wYXlsb2Fk
                  latitude: 28.40912
                  longitude: 77.31801
                  accuracy_m: 12.5
                  client_at: '2026-10-16T09:44:07.000+05:30'
                  note: Bus was late
      responses:
        '201':
          description: 'The punch is recorded. `Set-Cookie` is present only when this punch registered the phone (`device_registered: true`).'
          headers:
            Set-Cookie:
              $ref: '#/components/headers/DeviceCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PunchAccepted'
              examples:
                firstPunchIn:
                  summary: First punch from a phone with no registration
                  value:
                    kind: in
                    at: '2026-10-16T04:14:09.552103+00:00'
                    distance_m: 38
                    inside_geofence: true
                    flags: [new_device]
                    device_registered: true
                    today:
                      worked_minutes: 0
                      punched_in: true
                      status: present
                      late_minutes: null
                      early_exit_minutes: null
                      late_count: null
                      late_half_day: false
                punchOut:
                  summary: Punch-out
                  value:
                    kind: out
                    at: '2026-10-16T12:41:19.006+00:00'
                    distance_m: 41
                    inside_geofence: true
                    flags: []
                    device_registered: false
                    today:
                      worked_minutes: 507
                      punched_in: false
                      status: present
                      late_minutes: null
                      early_exit_minutes: 19
                      late_count: null
                      late_half_day: false
        '400':
          description: |
            - `VALIDATION_FAILED`: `kind` is missing or not "in" or "out" (not stored).
            - `CHALLENGE_MISSING`*, `CHALLENGE_INVALID`*: get a new challenge and try again.
            - `CHALLENGE_EXPIRED`*: more than 2 minutes old; get a new one.
            - An HTML page, not JSON: the body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                badKind:
                  value:
                    error: kind must be "in" or "out".
                    code: VALIDATION_FAILED
                challengeMissing:
                  value:
                    error: The punch could not be verified. Refresh the page and try again.
                    code: CHALLENGE_MISSING
                challengeInvalid:
                  value:
                    error: The punch could not be verified. Refresh the page and try again.
                    code: CHALLENGE_INVALID
                challengeExpired:
                  value:
                    error: That took too long. Tap punch again.
                    code: CHALLENGE_EXPIRED
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlPage'
        '401':
          $ref: '#/components/responses/PunchAuthRejected'
        '403':
          description: |
            - `NOT_LINKED`, `NOT_ACTIVE`, `NO_ATTENDANCE_LOGIN`: who is punching (not stored).
            - `PASSWORD_CHANGE_REQUIRED`: a password session still on HR's first-time password (not stored).
            - `NOT_MOBILE`*: the User-Agent does not name a phone.
            - `DEVICE_OTHER_EMPLOYEE`*: this phone is registered to another employee (flag `shared_device`).
            - `DEVICE_REVOKED`*: HR reset this phone (flag `revoked_device`); it can never punch again.
            - `DEVICE_NOT_REGISTERED`*: the employee already has a registered phone and this request does not carry its cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                notLinked:
                  $ref: '#/components/examples/PunchNotLinked'
                notActive:
                  $ref: '#/components/examples/PunchNotActive'
                noLogin:
                  $ref: '#/components/examples/NoAttendanceLoginYet'
                loginOff:
                  $ref: '#/components/examples/NoAttendanceLoginOff'
                passwordChange:
                  $ref: '#/components/examples/PasswordChangeRequired'
                notMobile:
                  value:
                    error: Punch from your phone. Attendance cannot be marked from a computer.
                    code: NOT_MOBILE
                otherEmployee:
                  value:
                    error: This phone is registered to another employee. Each person punches from their own phone.
                    code: DEVICE_OTHER_EMPLOYEE
                revoked:
                  value:
                    error: HR has reset this phone, so it can no longer punch. Punch from your new phone, or ask HR.
                    code: DEVICE_REVOKED
                notRegistered:
                  $ref: '#/components/examples/DeviceNotRegistered'
        '404':
          description: '`NOT_FOUND`: only on an unexpected database error (Postgres P0002); the message is the database''s.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                databaseNotFound:
                  value:
                    error: Not found
                    code: NOT_FOUND
        '409':
          description: |
            - `CHALLENGE_REUSED`*: an accepted punch already used this challenge, so **the punch is recorded**. Reload `GET /hr/my-attendance`; do not punch again.
            - `ALREADY_IN`*: already punched in.
            - `DAY_DONE`*: already punched out today; the next punch-in is after IST midnight.
            - `NOT_IN`*: a punch-out with no punch-in today.
            - `DEVICE_NOT_REGISTERED`*: two first punches from two phones raced, and the other phone was registered.
            - `HR_RULE_VIOLATION`, `DUPLICATE`: only on an unexpected database error; the message is the database's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                challengeReused:
                  value:
                    error: This punch was already submitted.
                    code: CHALLENGE_REUSED
                alreadyIn:
                  value:
                    error: You are already punched in.
                    code: ALREADY_IN
                dayDone:
                  value:
                    error: You have punched out for today. Punch in again after midnight.
                    code: DAY_DONE
                notIn:
                  value:
                    error: You have not punched in yet.
                    code: NOT_IN
                registrationRace:
                  $ref: '#/components/examples/DeviceNotRegistered'
                databaseRule:
                  summary: Unexpected database error (Postgres 23514 or P0001); illustrative wording
                  value:
                    error: new row for relation "<table>" violates check constraint "<constraint>"
                    code: HR_RULE_VIOLATION
                databaseDuplicate:
                  summary: Unexpected database error (Postgres 23505); illustrative wording
                  value:
                    error: duplicate key value violates unique constraint "<constraint>"
                    code: DUPLICATE
        '422':
          description: |
            - `LOCATION_MISSING`*: `latitude`, `longitude` or `accuracy_m` is missing, not a number, or out of range.
            - `ACCURACY_LOW`*: the fix is vaguer than `rules.max_accuracy_m`; `accuracy_m` gives the reported accuracy, rounded.
            - `BRANCH_NOT_CONFIGURED`*: the employee has no branch, or HR has not set the branch's location.
            - `OUTSIDE_GEOFENCE`*: the fix is outside the branch radius; `distance_m` and `radius_m` say by how much.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                locationMissing:
                  value:
                    error: Location is required to punch. Allow location for this site and try again.
                    code: LOCATION_MISSING
                accuracyLow:
                  value:
                    error: Your location is not precise enough yet. Turn on GPS / precise location, step outside if you can, and try again.
                    code: ACCURACY_LOW
                    accuracy_m: 240
                branchNotConfigured:
                  value:
                    error: Your branch location has not been set up yet. Ask HR to set it.
                    code: BRANCH_NOT_CONFIGURED
                outsideGeofence:
                  value:
                    error: You are not at your branch. Punch when you reach the office.
                    code: OUTSIDE_GEOFENCE
                    distance_m: 420
                    radius_m: 150
        '429':
          $ref: '#/components/responses/SchedulerApiRateLimited'
        '500':
          description: |
            "Failed to record the punch." (no code). This can come **after the punch was stored**, because the day is rolled up after the insert. Reload `GET /hr/my-attendance` before trying again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                unexpected:
                  value:
                    error: Failed to record the punch.
        '503':
          $ref: '#/components/responses/HrUnavailable'
      x-notes:
        - >-
          NOT_MOBILE: send a User-Agent that contains Android (or iPhone, iPad, iPod or Mobile) on every punch. Dart's default "Dart/3.x (dart:io)" is refused, and so is a missing header.
        - >-
          rvm_att_dev: the 201 of the first accepted punch from a phone with no registration sets the cookie rvm_att_dev (Path=/api/hr/my-attendance; Max-Age=157680000, five years; HttpOnly; SameSite=Strict; Secure). Keep it in a persistent cookie jar for scheduler.rvmcad.org, send it on every /api/hr/my-attendance request, and never clear it at sign-out, on an app update or on a new sign-in. Lose it and every later punch gets 403 DEVICE_NOT_REGISTERED until HR resets the phone. The token is never in the body; device_registered says whether it was set.
        - >-
          A phone registered from the browser holds that cookie in the browser, not in the app, so the app gets DEVICE_NOT_REGISTERED until HR resets the phone (decision 11: a bulk reset, branch by branch, at go-live). Wiping the app's data loses the cookie in the same way, and the next punch gets DEVICE_NOT_REGISTERED until HR resets the phone. A cookie HR has reset is refused for good (DEVICE_REVOKED).
        - >-
          CHALLENGE_REUSED means the punch was recorded. After a timeout, a lost reply or a 500, reload GET /hr/my-attendance first. If you must resend, resend the same body with the same nonce: CHALLENGE_REUSED then confirms the punch was stored, and a fresh challenge would risk a second punch.
        - >-
          The fields are latitude and longitude, not lat and lng; a body with lat and lng gets 422 LOCATION_MISSING. accuracy_m is required.
        - >-
          note is trimmed and cut to 200 characters without an error. client_at is kept beside the server time and never trusted; an unparseable value is stored as null, never refused. The punch time is always the server's (at).
        - >-
          OUTSIDE_GEOFENCE applies to punch-out too. Someone who leaves before punching out cannot punch out, and the day closes at midnight as "No punch-out".
        - >-
          The Scheduler cannot tell a mocked location from a real one, and will not be changed to (ADR-0018). The app refuses a mocked fix on the phone and does not send the punch; it reports the attempt to the ESS for HR instead (decision 6; that ESS endpoint comes in a later slice).
        - >-
          The only 429 is the 300-a-minute bucket, with no code.

  /hr/my-attendance/ping:
    post:
      operationId: sendLocationPing
      tags: ['Scheduler (existing)']
      x-owner: scheduler
      x-source: 'routes/hr.js:66-74,202; controllers/hr/attendancePunchController.js:590-612; services/attendancePunch.js:26,143-153'
      summary: Send one location fix while punched in
      description: |
        Either token kind. The trail HR sees while someone is punched in. The app sends one fix every 2 minutes (the cadence is the app's); the server keeps at most one a minute by its own clock.

        Checked in this order: who (401 or 403); 204 when the session is still on HR's first-time password; 204 unless this is the employee's registered phone; 204 unless the employee is punched in today; 400 `LOCATION_MISSING`; 204 when the last stored ping is under 60 seconds old; otherwise the fix is stored and the answer is 201.
      parameters:
        - $ref: '#/components/parameters/DeviceCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PingRequest'
            examples:
              fix:
                value:
                  latitude: 28.40917
                  longitude: 77.31795
                  accuracy_m: 9
      responses:
        '201':
          description: The fix is stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingStored'
              examples:
                stored:
                  value:
                    ok: true
        '204':
          description: |
            Accepted and dropped, with no body. Four reasons share it: the session is still on HR's first-time password; this is not the employee's registered phone (no cookie, an unknown one, someone else's, or one HR reset); the employee is not punched in today (never punched in, punched out, or it is past IST midnight); or the last stored ping is under 60 seconds old.
        '400':
          description: |
            - `LOCATION_MISSING`: the fix is missing or unusable. Sent only after the 204 checks pass.
            - An HTML page, not JSON: the body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                locationMissing:
                  value:
                    error: Location is required to punch. Allow location for this site and try again.
                    code: LOCATION_MISSING
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlPage'
        '401':
          $ref: '#/components/responses/PunchAuthRejected'
        '403':
          $ref: '#/components/responses/PunchIdentityForbidden'
        '429':
          $ref: '#/components/responses/SchedulerApiRateLimited'
        '500':
          description: '"Failed to record location." (no code): an unexpected failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                unexpected:
                  value:
                    error: Failed to record location.
        '503':
          $ref: '#/components/responses/HrUnavailable'
      x-notes:
        - >-
          A 204 is never an error, and the phone, day and throttle cases never answer 403 or 429. When 204s keep coming, reload GET /hr/my-attendance (device.this_phone, today.punched_in) to decide whether to stop tracking.
        - >-
          Stop at the first of: punch-out, the end of the shift plus its grace period (shift.end and shift.grace_minutes in GET /hr/my-attendance), or IST midnight (decision 5).
        - >-
          One fix per request, with no batching and no phone timestamp; batching would need a Scheduler change, which is out of scope (ADR-0018). No User-Agent check and no accuracy limit apply, but latitude, longitude and accuracy_m are required.
        - >-
          The Scheduler stores a mocked fix like any other. What the app does with a mocked ping is still open (decision 6; the proposal is to report it to the ESS for HR).

  /hr/my-attendance/remarks:
    put:
      operationId: saveMyRemark
      tags: ['Scheduler (existing)']
      x-owner: scheduler
      x-source: 'routes/hr.js:66-74,203; controllers/hr/attendancePunchController.js:556-588; services/attendanceRules.js:25-39'
      summary: Add, change or remove your own remark on one of your days
      description: |
        Either token kind. One remark per day, for any day from the 1st of last month up to today (IST). Empty text removes it. The remark is the employee's own word beside the day: it changes nothing about the day, and HR reads it beside HR's remark.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemarkRequest'
            examples:
              save:
                value:
                  day: '2026-10-14'
                  remarks: The bus was late, so I reached at 10:05.
              remove:
                value:
                  day: '2026-10-14'
                  remarks: ''
      responses:
        '200':
          description: 'Saved, or removed (`remarks: null`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemarkSaved'
              examples:
                saved:
                  value:
                    day: '2026-10-14'
                    remarks: The bus was late, so I reached at 10:05.
                    updated_at: '2026-10-16T05:01:33.418227+00:00'
                removed:
                  value:
                    day: '2026-10-14'
                    remarks: null
        '400':
          description: |
            - `VALIDATION_FAILED`: `day` is not YYYY-MM-DD, or the text is over 500 characters.
            - `DAY_OUT_OF_RANGE`: the day is in the future or before the 1st of last month.
            - An HTML page, not JSON: the body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                badDay:
                  value:
                    error: day is required (YYYY-MM-DD).
                    code: VALIDATION_FAILED
                tooLong:
                  value:
                    error: Keep the remark to 500 characters.
                    code: VALIDATION_FAILED
                outOfRange:
                  value:
                    error: You can add a remark to a day of this month or last month, up to today.
                    code: DAY_OUT_OF_RANGE
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlPage'
        '401':
          $ref: '#/components/responses/PunchAuthRejected'
        '403':
          $ref: '#/components/responses/PunchIdentityForbidden'
        '429':
          $ref: '#/components/responses/SchedulerApiRateLimited'
        '500':
          description: '"Failed to save your remark." (no code): an unexpected failure, including a day that matches YYYY-MM-DD but does not exist, such as 2026-02-30.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                unexpected:
                  value:
                    error: Failed to save your remark.
        '503':
          description: |
            - `MODULE_DISABLED`: the HR module is switched off.
            - `MODULE_NOT_INSTALLED`: the remarks table is missing. This one names `20261022000000_hr_attendance_shifts.sql`, although the table comes from `20261023000000_hr_attendance_employee_remarks.sql` (a known defect).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                moduleDisabled:
                  $ref: '#/components/examples/HrModuleDisabled'
                rulesNotInstalled:
                  $ref: '#/components/examples/RulesNotInstalled'
                punchNotInstalled:
                  $ref: '#/components/examples/PunchNotInstalled'
      x-notes:
        - >-
          This works even for a session still on HR's first-time password, unlike the challenge, punch and ping. It is a known gap, and it stays: closing it would need a Scheduler change (ADR-0018). The app should send the person to "Choose your own password" first anyway.
        - >-
          The 500 characters are counted after trimming, as characters rather than bytes.

components:

  securitySchemes:

    bearer:
      type: http
      scheme: bearer
      description: '`Authorization: Bearer <token>`, spelt exactly so: only "Bearer " with a capital B and one space is removed, by both services.'

  parameters:

    BranchFilter:
      name: branch_id
      in: query
      required: false
      description: An HR branch (`hr_branches`), not a Scheduler location.
      schema:
        type: string
        format: uuid

    DeviceCookie:
      name: device_token
      in: cookie
      required: false
      description: The Scheduler's punch cookie, set by its attendance sign-in and sent back on every punch. It belongs to the Scheduler's host; the ESS neither reads nor sets it.
      schema:
        type: string

    PhoneUserAgent:
      name: User-Agent
      in: header
      required: false
      description: The phone's own User-Agent, sent by the app as the punch page's browser sends it. The Scheduler's phone-only reset binds a device to it, so the app sends one that looks like a phone.
      schema:
        type: string

    Month:
      name: month
      in: query
      required: false
      description: 'A calendar month, `YYYY-MM`. Default: the current month (IST).'
      schema:
        type: string
        pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'

    EmployeeId:
      name: id
      in: path
      required: true
      description: The HR record's id (`hr_employees.id`).
      schema:
        type: string
        format: uuid

    FromDay:
      name: from
      in: query
      required: false
      description: The first day, `YYYY-MM-DD`, inclusive.
      schema:
        type: string
        format: date

    ToDay:
      name: to
      in: query
      required: false
      description: The last day, `YYYY-MM-DD`, inclusive.
      schema:
        type: string
        format: date

    ClassBatchId:
      name: id
      in: path
      required: true
      description: The batch's id (`batches.id`).
      schema:
        type: string
        format: uuid

    ClassDay:
      name: date
      in: path
      required: true
      description: 'The day, `YYYY-MM-DD`. Not a future day, and not before the batch starts.'
      schema:
        type: string
        format: date

  headers:

    WwwAuthenticate:
      description: Always `Bearer` on a 401 (RFC 6750), so the app knows which scheme to send.
      schema:
        type: string
        const: Bearer

    RetryAfter:
      description: Seconds to wait before trying again.
      schema:
        type: integer
        minimum: 1

    RateLimitPolicy:
      description: The bucket that counted this request, IETF draft 6 (for example `600;w=60`).
      schema:
        type: string

    RateLimitLimit:
      description: How many requests that bucket allows in its window.
      schema:
        type: integer

    RateLimitRemaining:
      description: How many are left in the window.
      schema:
        type: integer

    RateLimitReset:
      description: Seconds until the window resets.
      schema:
        type: integer

    NoStore:
      description: '`no-store`: a reply is about one person, so nothing may cache it.'
      schema:
        type: string
        const: no-store

    DeviceCookie:
      description: The Scheduler's punch cookie. Set by its attendance sign-in, sent back on every punch, and never touched by the ESS.
      schema:
        type: string

  schemas:

    Error:
      type: object
      description: |
        Every ESS error. `error` is written for staff and is shown as it is; `code` is what the app branches on.
      required: [error, code]
      properties:
        error:
          type: string
          description: A message written for staff. Show it; never parse it.
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$'
          description: UPPER_SNAKE. Branch on this.

    SchedulerError:
      type: object
      description: |
        A Scheduler error. `error` is written for staff. `code` is present on most errors but not all: each response says which have none. A few refusals add the fields below.
      required: [error]
      properties:
        error:
          type: string
          description: A message written for staff. Show it; never parse it.
        code:
          type: string
          pattern: '^[A-Z0-9_]+$'
          description: Usually UPPER_SNAKE. On the two-factor send failure it can be a database error code instead.
        attempts_left:
          type: integer
          minimum: 1
          description: With `WRONG_CODE` on `otp/verify`, and `WRONG_CREDENTIALS` after a wrong password, the tries left.
        accuracy_m:
          type: integer
          description: With `ACCURACY_LOW`, the accuracy the phone reported, rounded to metres.
        distance_m:
          type: integer
          description: With `OUTSIDE_GEOFENCE`, how far the fix was from the branch, in metres.
        radius_m:
          type: integer
          description: With `OUTSIDE_GEOFENCE`, the branch radius in metres.
        module:
          type: string
          description: With `MODULE_NOT_INSTALLED`, the module (HR).
        migration:
          type: string
          description: With `MODULE_NOT_INSTALLED`, the migration file that creates what is missing.

    HtmlPage:
      type: string
      description: |
        An HTML page, not JSON: nginx while a process restarts, the Scheduler's catch-all for an unknown path, or Express's default error page for malformed JSON. Never treat it as success and never sign out on it.

    Semver:
      type: [string, 'null']
      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
      description: A semantic version such as 1.4.2, or null when not set.

    Health:
      type: object
      required: [ok, server_time, version, min_app_version, latest_app_version, db]
      properties:
        ok:
          type: boolean
          const: true
        server_time:
          type: string
          format: date-time
          description: The server's clock when it answered.
        version:
          type: string
          description: The ESS build that answered.
        min_app_version:
          $ref: '#/components/schemas/Semver'
          description: Older apps must update before going on. Null when not set.
        latest_app_version:
          $ref: '#/components/schemas/Semver'
          description: Older apps may offer an update. Null when not set.
        db:
          type: string
          enum: [ok, unavailable]
          description: The result of a cheap database read with a short timeout.

    Me:
      type: object
      required: [employee, login]
      properties:
        employee:
          $ref: '#/components/schemas/Employee'
        login:
          $ref: '#/components/schemas/Login'

    Employee:
      type: object
      description: The caller's HR record (`hr_employees`). Never carries pay, a phone number or a document path.
      required: [id, full_name, employee_code, designation, employment_status, branch, department, manager]
      properties:
        id:
          type: string
          format: uuid
          description: hr_employees.id. The id every ESS record about this person uses.
        full_name:
          type: string
        employee_code:
          type: [string, 'null']
        designation:
          type: [string, 'null']
        employment_status:
          type: string
          enum: [active, notice_period, probation, confirmed, resigned, fired, terminated]
          description: |
            As stored on the HR record. "exited" never appears, because an employee who has left gets 403 `NOT_ACTIVE`. "notice_period" means serving notice; the last working day is still active. probation, confirmed and resigned are legacy values that no current record carries.
        branch:
          type: [object, 'null']
          description: The HR branch (`hr_branches`), not a Scheduler location.
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        department:
          type: [object, 'null']
          required: [id, name]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        manager:
          type: [object, 'null']
          description: The reporting manager on the HR record (`manager_id`), who approves this person's requests. Null when none is recorded, in which case HR approves.
          required: [id, full_name]
          properties:
            id:
              type: string
              format: uuid
            full_name:
              type: string

    Login:
      type: object
      required: [kind, role, user_id]
      properties:
        kind:
          type: string
          enum: [portal, attendance]
          description: Which token this request carried.
        role:
          type: [string, 'null']
          enum: [ceo, super_admin, hoo, hod, hod_placement, admin_manager, admin, accounts_admin, hr, hr_executive, faculty, null]
          description: The portal login's role (users.role) as it is now. Null for an attendance session.
        user_id:
          type: [string, 'null']
          format: uuid
          description: users.id of a portal login. Null for an attendance session.

    Capabilities:
      type: object
      required: [tabs, sections, team, approvals, requests, wall, push, integrity]
      properties:
        tabs:
          type: array
          description: The bottom tabs, in display order. All five for every staff login.
          items:
            type: string
            enum: [home, inbox, wall, me, team]
        sections:
          type: object
          required: [time, helpdesk, documents, profile, work]
          properties:
            time:
              type: boolean
              description: Attendance, requests and leave. True for every staff login.
            helpdesk:
              type: boolean
              description: True for every staff login.
            documents:
              type: boolean
              description: True for every staff login.
            profile:
              type: boolean
              description: True for every staff login.
            work:
              type: boolean
              description: The teaching and leadership section. True for faculty, hod, hod_placement, hoo, super_admin and ceo; false for admin, admin_manager, accounts_admin, hr, hr_executive and attendance-only staff.
        team:
          type: object
          required: [has_reports, direct_reports]
          properties:
            has_reports:
              type: boolean
              description: True when direct_reports is above 0.
            direct_reports:
              type: integer
              minimum: 0
              description: Active employees whose manager_id is the caller.
        approvals:
          type: object
          required: [own_reports, any_request, request_types, hr_scope]
          properties:
            own_reports:
              type: boolean
              description: The caller decides their direct reports' requests (true when direct_reports is above 0).
            any_request:
              type: boolean
              description: The caller may decide anyone's request, recorded as HR's decision. True for hr, ceo and super_admin only; never for hr_executive.
            request_types:
              type: array
              description: The request types this person may decide. Every offered type when any_request or own_reports is true; otherwise empty.
              items:
                $ref: '#/components/schemas/RequestType'
            hr_scope:
              type: array
              description: HR review queues. hr gets all four; hr_executive gets documents, profile_changes and helpdesk_hr; everyone else none.
              items:
                type: string
                enum: [attendance, documents, profile_changes, helpdesk_hr]
        requests:
          type: object
          required: [types, payroll_cutoff_day, reach_back_months]
          properties:
            types:
              type: array
              description: Every request type, offered or not, with its monthly limit. One entry per type.
              items:
                $ref: '#/components/schemas/RequestTypePolicy'
            payroll_cutoff_day:
              type: integer
              minimum: 1
              maximum: 28
              description: The day of the current month (IST) on which requests for last month close; 5 (KP, 16 Oct). Whether the 5th itself is still open is to be confirmed with KP (docs/03-decisions.md).
            reach_back_months:
              type: integer
              minimum: 0
              description: How many months back a request may reach besides the current one. 1 (this month and last month).
        wall:
          type: object
          required: [post, announce, moderate]
          properties:
            post:
              type: boolean
              description: Post, comment, react, praise and run polls. True for every staff login.
            announce:
              type: boolean
              description: Post announcements. True for hr, ceo and super_admin.
            moderate:
              type: boolean
              description: Hide anything, with a reason. True for hr.
        push:
          type: object
          required: [enabled]
          properties:
            enabled:
              type: boolean
              description: True only when the server has its FIREBASE_* settings (ADR-0016). Until then notifications go to the server log instead.
        integrity:
          type: object
          required: [required]
          properties:
            required:
              type: boolean
              description: Whether a Play Integrity token is required. False until a Play project exists (ADR-0016).

    RequestType:
      type: string
      enum: [on_duty, fix_a_day, excuse_late, short_leave, leave_cl, leave_lwp, wfh]
      description: |
        on_duty: working away from the branch for the day. fix_a_day: correct a day's attendance. excuse_late: excuse a late arrival. short_leave: short leave, counted in minutes (Phase 2). leave_cl: casual leave. leave_lwp: leave without pay. wfh: work from home, not offered.

    RequestTypePolicy:
      type: object
      description: |
        One request type and its monthly limit, per employee per calendar month (KP, 16 Oct). Today: on_duty no limit; fix_a_day 3; excuse_late 3; short_leave 180 minutes (phase 2); leave_cl 1; leave_lwp no limit set (still open); wfh not offered, limit 0.
      required: [type, offered, limit, unit, phase]
      properties:
        type:
          $ref: '#/components/schemas/RequestType'
        offered:
          type: boolean
          description: False means the type is hidden in the app.
        limit:
          type: [integer, 'null']
          minimum: 0
          description: The monthly limit in `unit`. Null means no limit.
        unit:
          type: string
          enum: [count, minutes]
        phase:
          type: integer
          enum: [1, 2]
          description: The build phase that delivers this type (ADR-0013).

    KeepSignInRequest:
      type: object
      required: [install_id]
      properties:
        install_id:
          $ref: '#/components/schemas/InstallId'
        device_label:
          type: [string, 'null']
          maxLength: 80
          description: The phone's name for the session list. Blank means none.

    InstallId:
      type: string
      pattern: '^[A-Za-z0-9._-]{16,128}$'
      description: Random, made once per install (a uuid will do), kept with the tokens, never shown.

    RefreshToken:
      type: string
      pattern: '^[A-Za-z0-9_-]{43}$'
      description: Opaque, 32 random bytes in base64url. Store it like a password; the ESS keeps only its hash.

    RefreshSessionRequest:
      type: object
      required: [refresh_token, install_id]
      properties:
        refresh_token:
          $ref: '#/components/schemas/RefreshToken'
        install_id:
          $ref: '#/components/schemas/InstallId'

    SignOutRequest:
      type: object
      properties:
        refresh_token:
          $ref: '#/components/schemas/RefreshToken'

    SessionTokens:
      type: object
      required: [session, access_token, access_expires_at, refresh_token, login]
      properties:
        session:
          type: object
          required: [id, expires_at]
          properties:
            id:
              type: string
              format: uuid
              description: The kept sign-in, as GET /ess/sessions lists it. The same at every refresh.
            expires_at:
              type: string
              format: date-time
              description: 90 days from this answer, unless a refresh moves it on.
        access_token:
          type: string
          description: A Scheduler-format token (the portal JWT, or the attendance session) for both hosts, valid for an hour. Read its exp, never anything else from it.
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          $ref: '#/components/schemas/RefreshToken'
        login:
          $ref: '#/components/schemas/Login'

    RefreshRefused:
      type: object
      required: [error, code, reason]
      properties:
        error:
          type: string
          description: A message written for staff. Show it; never parse it.
        code:
          type: string
          const: NOT_AUTHENTICATED
        reason:
          type: string
          enum: [unknown, expired, signed_out, reuse, password_changed, login_off, left, unlinked]

    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionSummary'

    SessionSummary:
      type: object
      required: [id, device_label, created_at, last_used_at, expires_at, current]
      properties:
        id:
          type: string
          format: uuid
        device_label:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
          description: When this phone was signed in.
        last_used_at:
          type: string
          format: date-time
          description: The last refresh.
        expires_at:
          type: string
          format: date-time
        current:
          type: boolean
          description: The sign-in the request's own token belongs to.

    SignInResolveRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 254
          description: What the person typed. Matched exactly for a portal username or login phone, so send it as it will be sent to POST /users/login.

    SignInResolution:
      oneOf:
        - type: object
          title: Portal, as typed, at a branch the person chooses
          required: [kind, login_with, location_names]
          properties:
            kind: { type: string, const: portal }
            login_with: { type: string, const: as_typed }
            location_names:
              type: array
              description: Every branch, in the web's order, the same for every account. Any of them signs this account in.
              items: { type: string }
        - type: object
          title: Portal, with the username or login phone
          required: [kind, login_with]
          properties:
            kind: { type: string, const: portal }
            login_with: { type: string, const: username_or_phone }
        - type: object
          title: Attendance
          required: [kind, methods]
          properties:
            kind: { type: string, const: attendance }
            methods:
              type: array
              items: { type: string, enum: [code, password] }
        - type: object
          title: Nobody, or more than one person
          required: [kind]
          properties:
            kind: { type: string, const: unknown }

    EmployeeCard:
      type: object
      description: Who a row is about, as HR's lists show a person, and nothing else from their record.
      required: [id, full_name, employee_code]
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        employee_code:
          type: [string, 'null']

    BranchRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    DataRequestCreate:
      type: object
      required: [kind, details]
      properties:
        kind:
          type: string
          enum: [correct, delete]
        details:
          type: string
          minLength: 5
          maxLength: 2000
          description: 5 to 2,000 characters after trimming.

    DataRequestResolve:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [done, rejected]
        note:
          type: [string, 'null']
          maxLength: 1000
          description: Required for a rejection, at least 3 characters. The employee sees it.

    DataRequest:
      type: object
      description: A request to correct or delete one's data, as its owner sees it.
      required: [id, kind, details, status, created_at, resolved_at, resolution_note]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [correct, delete]
        details:
          type: string
        status:
          type: string
          enum: [open, done, rejected]
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, 'null']
          format: date-time
        resolution_note:
          type: [string, 'null']
          description: HR's answer.

    HrDataRequest:
      type: object
      description: A request as HR sees it, with whose it is and who answered it.
      required: [id, kind, details, status, created_at, resolved_at, resolution_note, resolved_by_name, employee]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [correct, delete]
        details:
          type: string
        status:
          type: string
          enum: [open, done, rejected]
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: [string, 'null']
          format: date-time
        resolution_note:
          type: [string, 'null']
        resolved_by_name:
          type: [string, 'null']
          description: The HR person who answered, by name.
        employee:
          oneOf:
            - $ref: '#/components/schemas/EmployeeCard'
            - type: 'null'
          description: Null only if the record can no longer be read.

    PersonalDetails:
      type: object
      description: Every field, null when not recorded.
      required: [date_of_birth, blood_group, address_line1, address_line2, city, state, pincode, emergency_name, emergency_relation, emergency_phone, updated_at, updated_by_name]
      properties:
        date_of_birth:
          type: [string, 'null']
          format: date
        blood_group:
          type: [string, 'null']
          enum: [A+, A-, B+, B-, AB+, AB-, O+, O-, null]
        address_line1:
          type: [string, 'null']
          maxLength: 200
        address_line2:
          type: [string, 'null']
          maxLength: 200
        city:
          type: [string, 'null']
          maxLength: 80
        state:
          type: [string, 'null']
          maxLength: 80
        pincode:
          type: [string, 'null']
          pattern: '^[1-9][0-9]{5}$'
        emergency_name:
          type: [string, 'null']
          maxLength: 100
        emergency_relation:
          type: [string, 'null']
          maxLength: 50
        emergency_phone:
          type: [string, 'null']
          pattern: '^[6-9][0-9]{9}$'
          description: 10 digits, as stored.
        updated_at:
          type: [string, 'null']
          format: date-time
        updated_by_name:
          type: [string, 'null']
          description: Who last wrote the record, by name.

    MyPersonalUpdate:
      type: object
      description: The fields the employee changes. Any of date_of_birth, address_line1, address_line2, city, state or pincode is 403 SENSITIVE_FIELD; any other field is 400.
      minProperties: 1
      properties:
        blood_group:
          type: [string, 'null']
        emergency_name:
          type: [string, 'null']
          maxLength: 100
        emergency_relation:
          type: [string, 'null']
          maxLength: 50
        emergency_phone:
          type: [string, 'null']
          description: An Indian mobile number, with or without +91, a leading 0, spaces or dashes.

    PersonalDetailsUpdate:
      type: object
      description: Any of the ten fields, for HR. Null or an empty string clears one.
      minProperties: 1
      properties:
        date_of_birth:
          type: [string, 'null']
          format: date
        blood_group:
          type: [string, 'null']
        address_line1:
          type: [string, 'null']
          maxLength: 200
        address_line2:
          type: [string, 'null']
          maxLength: 200
        city:
          type: [string, 'null']
          maxLength: 80
        state:
          type: [string, 'null']
          maxLength: 80
        pincode:
          type: [string, 'null']
        emergency_name:
          type: [string, 'null']
          maxLength: 100
        emergency_relation:
          type: [string, 'null']
          maxLength: 50
        emergency_phone:
          type: [string, 'null']

    EmployeePersonal:
      type: object
      required: [employee, personal]
      properties:
        employee:
          $ref: '#/components/schemas/EmployeeCard'
        personal:
          $ref: '#/components/schemas/PersonalDetails'

    AttendanceDay:
      type: object
      required: [server_now, date, day, note, hr_remark, my_remarks]
      properties:
        server_now:
          type: string
          format: date-time
          description: The server's clock when it answered.
        date:
          type: string
          format: date
        day:
          oneOf:
            - $ref: '#/components/schemas/StoredDay'
            - type: 'null'
          description: Null when nothing is recorded for the day yet.
        note:
          type: [string, 'null']
          description: The note on the day's row (hr_staff_attendance.note).
        hr_remark:
          oneOf:
            - type: object
              required: [remarks, updated_at]
              properties:
                remarks:
                  type: string
                updated_at:
                  type: string
                  format: date-time
            - type: 'null'
          description: HR's remark on the day (hr_attendance_remarks).
        my_remarks:
          type: array
          description: The person's own remarks on the day (hr_attendance_employee_remarks); at most one today.
          items:
            type: object
            required: [day, remarks, updated_at]
            properties:
              day:
                type: string
                format: date
              remarks:
                type: string
              updated_at:
                type: string
                format: date-time

    StoredDay:
      type: object
      description: The day's row as the Scheduler stores it (hr_staff_attendance), without its note.
      required: [status, leave_type, source, first_in, last_out, worked_minutes, late_minutes, early_exit_minutes, late_count, late_half_day, late_excused, shift_start, shift_end]
      properties:
        status:
          $ref: '#/components/schemas/DayStatus'
        leave_type:
          type: [string, 'null']
          description: cl, lwp, leave, or an older free-text type.
        source:
          type: [string, 'null']
          enum: [manual, self_punch, override, auto, null]
        first_in:
          type: [string, 'null']
          format: date-time
        last_out:
          type: [string, 'null']
          format: date-time
        worked_minutes:
          type: [integer, 'null']
        late_minutes:
          type: [integer, 'null']
        early_exit_minutes:
          type: [integer, 'null']
        late_count:
          type: [integer, 'null']
        late_half_day:
          type: boolean
        late_excused:
          type: boolean
        shift_start:
          type: [string, 'null']
          description: HH:MM:SS.
        shift_end:
          type: [string, 'null']
          description: HH:MM:SS.

    MockLocationReportRequest:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          const: punch
        latitude:
          type: [number, 'null']
          minimum: -90
          maximum: 90
        longitude:
          type: [number, 'null']
          minimum: -180
          maximum: 180
        accuracy_m:
          type: [number, 'null']
          minimum: 0
          maximum: 1000000
        client_at:
          type: [string, 'null']
          description: The phone's clock, ISO 8601. Unreadable is stored as null.
        provider:
          type: [string, 'null']
          maxLength: 80
        app_version:
          type: [string, 'null']
          maxLength: 40
        install_id:
          type: [string, 'null']
          maxLength: 128

    MockLocationReport:
      type: object
      required: [id, reported_at, client_at, kind, latitude, longitude, accuracy_m, provider, app_version, install_id, employee, branch]
      properties:
        id:
          type: string
          format: uuid
        reported_at:
          type: string
          format: date-time
        client_at:
          type: [string, 'null']
          format: date-time
        kind:
          type: string
          const: punch
        latitude:
          type: [number, 'null']
        longitude:
          type: [number, 'null']
        accuracy_m:
          type: [number, 'null']
        provider:
          type: [string, 'null']
        app_version:
          type: [string, 'null']
        install_id:
          type: [string, 'null']
        employee:
          oneOf:
            - $ref: '#/components/schemas/EmployeeCard'
            - type: 'null'
        branch:
          oneOf:
            - $ref: '#/components/schemas/BranchRef'
            - type: 'null'
          description: Where the person was on their HR record when they reported.

    RegisteredPhone:
      type: object
      required: [id, status, bound_at, last_seen_at, revoked_at, revoked_by_name, revoke_reason, employee, branch]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [active, revoked]
        bound_at:
          type: string
          format: date-time
          description: When its first accepted punch registered it.
        last_seen_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time
        revoked_by_name:
          type: [string, 'null']
          description: The username of whoever reset it.
        revoke_reason:
          type: [string, 'null']
        employee:
          oneOf:
            - $ref: '#/components/schemas/EmployeeCard'
            - type: 'null'
        branch:
          oneOf:
            - $ref: '#/components/schemas/BranchRef'
            - type: 'null'
          description: The person's branch on their HR record now.

    DeviceResetRequest:
      type: object
      required: [reason]
      properties:
        branch_id:
          type: string
          format: uuid
        employee_ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
        reason:
          type: string
          minLength: 3
          maxLength: 200

    RequestCancel:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 200
          description: HR's reason; it stays on the request and in the audit trail.

    AttendanceRequest:
      type: object
      description: One attendance request as the employee and the approver read it. `employee` is present in an approver's reply, never in the person's own list.
      required: [id, family, type, status, day, reason, place, fix_in, fix_out, minutes, created_at, decided_at, decided_by_name, decision_note, cancelled_at, cancelled_by_name, cancel_reason]
      properties:
        id:
          type: string
          format: uuid
        family:
          type: string
          enum: [attendance]
        type:
          type: string
          enum: [on_duty, fix_a_day, excuse_late, short_leave]
        status:
          type: string
          enum: [pending, approved, rejected, withdrawn, cancelled]
        day:
          type: string
          format: date
        reason:
          type: string
          minLength: 5
          maxLength: 1000
        place:
          type: [string, 'null']
        fix_in:
          type: [string, 'null']
          pattern: '^\d{2}:\d{2}$'
        fix_out:
          type: [string, 'null']
          pattern: '^\d{2}:\d{2}$'
        minutes:
          type: [integer, 'null']
          minimum: 1
          maximum: 480
          description: A short leave's minutes; null for every other type.
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time
        decided_by_name:
          type: [string, 'null']
        decision_note:
          type: [string, 'null']
        cancelled_at:
          type: [string, 'null']
          format: date-time
        cancelled_by_name:
          type: [string, 'null']
        cancel_reason:
          type: [string, 'null']
        employee:
          $ref: '#/components/schemas/EmployeeCard'

    LeaveRequest:
      type: object
      description: One leave request as the employee and the approver read it. `employee` is present in an approver's reply, never in the person's own list.
      required: [id, family, type, status, day, reason, created_at, decided_at, decided_by_name, decision_note, cancelled_at, cancelled_by_name, cancel_reason]
      properties:
        id:
          type: string
          format: uuid
        family:
          type: string
          enum: [leave]
        type:
          type: string
          enum: [cl, lwp]
        status:
          type: string
          enum: [pending, approved, rejected, withdrawn, cancelled]
        day:
          type: string
          format: date
        reason:
          type: string
          minLength: 5
          maxLength: 1000
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time
        decided_by_name:
          type: [string, 'null']
        decision_note:
          type: [string, 'null']
        cancelled_at:
          type: [string, 'null']
          format: date-time
        cancelled_by_name:
          type: [string, 'null']
        cancel_reason:
          type: [string, 'null']
        employee:
          $ref: '#/components/schemas/EmployeeCard'

    ApprovalLate:
      type: object
      description: The day's late marks, for the Inbox's context (attendance requests only).
      required: [late_minutes, late_count, late_half_day, late_excused]
      properties:
        late_minutes:
          type: [integer, 'null']
        late_count:
          type: [integer, 'null']
        late_half_day:
          type: boolean
        late_excused:
          type: boolean

    ApprovalContext:
      type: object
      description: What the approver needs beside the request itself (task D1).
      required: [type_this_month, month_limit, late, others_off]
      properties:
        type_this_month:
          type: integer
          minimum: 0
          description: This kind of request the person has this month, pending and approved. For a short leave it is the minutes; for every other type it is the count.
        month_limit:
          type: [integer, 'null']
          description: The month's limit for the type; null means no limit.
        late:
          description: The day's late marks; null for a leave request or a day with no row.
          oneOf:
            - $ref: '#/components/schemas/ApprovalLate'
            - type: 'null'
        others_off:
          type: object
          required: [count, names]
          properties:
            count:
              type: integer
              minimum: 0
            names:
              type: array
              maxItems: 5
              items:
                type: string

    InboxAttendanceRequest:
      type: object
      description: An attendance request in an approver's Inbox, with whose it is and its context.
      required: [id, family, type, status, day, reason, place, fix_in, fix_out, minutes, created_at, decided_at, decided_by_name, decision_note, cancelled_at, cancelled_by_name, cancel_reason, employee, context]
      properties:
        id:
          type: string
          format: uuid
        family:
          type: string
          enum: [attendance]
        type:
          type: string
          enum: [on_duty, fix_a_day, excuse_late, short_leave]
        status:
          type: string
          enum: [pending, approved, rejected, withdrawn, cancelled]
        day:
          type: string
          format: date
        reason:
          type: string
          minLength: 5
          maxLength: 1000
        place:
          type: [string, 'null']
        fix_in:
          type: [string, 'null']
          pattern: '^\d{2}:\d{2}$'
        fix_out:
          type: [string, 'null']
          pattern: '^\d{2}:\d{2}$'
        minutes:
          type: [integer, 'null']
          minimum: 1
          maximum: 480
          description: A short leave's minutes; null for every other type.
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time
        decided_by_name:
          type: [string, 'null']
        decision_note:
          type: [string, 'null']
        cancelled_at:
          type: [string, 'null']
          format: date-time
        cancelled_by_name:
          type: [string, 'null']
        cancel_reason:
          type: [string, 'null']
        employee:
          $ref: '#/components/schemas/EmployeeCard'
        context:
          $ref: '#/components/schemas/ApprovalContext'

    InboxLeaveRequest:
      type: object
      description: A leave request in an approver's Inbox, with whose it is and its context.
      required: [id, family, type, status, day, reason, created_at, decided_at, decided_by_name, decision_note, cancelled_at, cancelled_by_name, cancel_reason, employee, context]
      properties:
        id:
          type: string
          format: uuid
        family:
          type: string
          enum: [leave]
        type:
          type: string
          enum: [cl, lwp]
        status:
          type: string
          enum: [pending, approved, rejected, withdrawn, cancelled]
        day:
          type: string
          format: date
        reason:
          type: string
          minLength: 5
          maxLength: 1000
        created_at:
          type: string
          format: date-time
        decided_at:
          type: [string, 'null']
          format: date-time
        decided_by_name:
          type: [string, 'null']
        decision_note:
          type: [string, 'null']
        cancelled_at:
          type: [string, 'null']
          format: date-time
        cancelled_by_name:
          type: [string, 'null']
        cancel_reason:
          type: [string, 'null']
        employee:
          $ref: '#/components/schemas/EmployeeCard'
        context:
          $ref: '#/components/schemas/ApprovalContext'

    ApprovalCounts:
      type: object
      description: What still waits for this caller, archived ones left out.
      required: [attendance, leave, total]
      properties:
        attendance:
          type: integer
          minimum: 0
        leave:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0

    ApprovalsList:
      type: object
      required: [counts, requests, truncated]
      properties:
        counts:
          $ref: '#/components/schemas/ApprovalCounts'
        requests:
          type: array
          maxItems: 100
          items:
            oneOf:
              - $ref: '#/components/schemas/InboxAttendanceRequest'
              - $ref: '#/components/schemas/InboxLeaveRequest'
        truncated:
          type: boolean

    ApprovalChainLevel:
      type: object
      description: One level of the reporting line, judged for the request's day (D4).
      required: [employee, may_decide, skipped]
      properties:
        employee:
          $ref: '#/components/schemas/EmployeeCard'
        may_decide:
          type: boolean
          description: True for the FIRST level that is not skipped; false for every other.
        skipped:
          description: Why this level cannot decide the request today; null when it may.
          type: [string, 'null']
          enum: [same_person, not_active, on_leave, null]

    ApprovalChain:
      type: object
      description: The request and its reporting line, first manager first.
      required: [request, chain, hr_fallback]
      properties:
        request:
          oneOf:
            - $ref: '#/components/schemas/AttendanceRequest'
            - $ref: '#/components/schemas/LeaveRequest'
        chain:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalChainLevel'
        hr_fallback:
          type: boolean
          description: True when every level is skipped, or there is no line at all -- only HR, the CEO and super admins may decide the request then.

    LeadersOverview:
      type: object
      description: The organisation's numbers for today, in counts only (H5).
      required: [headcount, attendance_today, off_this_week, pending]
      properties:
        headcount:
          type: integer
          minimum: 0
          description: Everybody not archived.
        attendance_today:
          type: object
          description: Today's states over the active people, as Team today reads them. A person the sheet has no row for reads as not_in.
          required: [in, done, not_in, on_leave, week_off, holiday]
          properties:
            in:
              type: integer
              minimum: 0
            done:
              type: integer
              minimum: 0
            not_in:
              type: integer
              minimum: 0
            on_leave:
              type: integer
              minimum: 0
            week_off:
              type: integer
              minimum: 0
            holiday:
              type: integer
              minimum: 0
        off_this_week:
          type: integer
          minimum: 0
          description: Distinct people the sheet records leave for in this IST week (Monday to Sunday).
        pending:
          type: object
          description: What waits in the approval queue, archived ones left out.
          required: [attendance, leave, total, oldest_days]
          properties:
            attendance:
              type: integer
              minimum: 0
            leave:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
            oldest_days:
              type: [integer, 'null']
              minimum: 0
              description: How many whole days the oldest pending request has waited; null when nothing waits.

    BalanceLine:
      type: object
      required: [type, offered, unit, phase, allowed, used, pending, remaining]
      properties:
        type:
          $ref: '#/components/schemas/RequestType'
        offered:
          type: boolean
        unit:
          type: string
          enum: [count, minutes]
        phase:
          type: integer
          enum: [1, 2]
        allowed:
          type: [integer, 'null']
        used:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        remaining:
          type: [integer, 'null']

    Balances:
      type: object
      required: [month, types]
      properties:
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
        types:
          type: array
          items:
            $ref: '#/components/schemas/BalanceLine'

    RequestLimit:
