        Saves one `student_attendance` row per student, on the Scheduler's own key (batch, student, date), with `remarks_updated_by` and `remarks_updated_at`. The same six rules as the roster apply: role, branch, ownership or substitution, the date window, roster membership and eligibility, and the lock. A teaching role that saves a day already marked is 409 `CLASS_ALREADY_MARKED`; an admin role may correct the day. A student not on the roster or not eligible on the day is 400 `VALIDATION_FAILED` with `CLASS_ROSTER`. A present mark, or an absent mark that already carries its reason, resolves that student's unresolved `absent_remarks_missing` alert for the day. The audit entry `class.attendance.marked` carries the batch, the day and the present/absent counts, never a student's name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassAttendanceRequest'
            examples:
              twoStudents:
                value:
                  date: '2026-10-16'
                  attendance:
                    - { student_id: 9e000000-0000-4000-8000-000000000001, present: true }
                    - { student_id: 9e000000-0000-4000-8000-000000000002, present: false, absent_reason: 'Fever, informed the office.', follow_up_comment: Call the parent. }
      responses:
        '200':
          description: The saved day and its counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassMarkSaved'
              examples:
                saved:
                  value:
                    batch: { id: 5e6f7a8b-9c0d-4e1f-8a2b-3c4d5e6f7a8b, name: CAD Morning Batch }
                    date: '2026-10-16'
                    counts: { present: 1, absent: 1, total: 2 }
        '400':
          $ref: '#/components/responses/EssClassBad'
        '401':
          $ref: '#/components/responses/EssNotAuthenticated'
        '403':
          $ref: '#/components/responses/EssClassForbidden'
        '404':
          $ref: '#/components/responses/EssClassNotFound'
        '409':
          $ref: '#/components/responses/EssClassConflict'
        '429':
          $ref: '#/components/responses/EssRateLimited'
        '503':
