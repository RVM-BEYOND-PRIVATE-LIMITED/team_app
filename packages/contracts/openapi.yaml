  /ess/helpdesk/tickets:
    servers:
      - url: 'https://{essHost}/api'
        description: The ESS, on its own host name (ADR-0019).
        variables:
          essHost:
            default: team-api.rvmcad.org
            description: The ESS's own host name, chosen by KP on 16 Oct 2026 (ADR-0019).
    post:
      operationId: raiseHelpdeskTicket
      tags: [ESS]
      x-owner: ess
      summary: Raise a ticket (G2)
      description: |
        Either token kind, on any staff employee. `category` is a slug from `GET /ess/helpdesk/categories`; raising on a non-ticket row is 400 `HELPDESK_NOT_A_TICKET`, and an unknown or inactive slug is 404 `NOT_FOUND` with "That category was not found.".

        The subject and the body are 3 to 200 and 3 to 2,000 characters. `anonymous: true` hides the raiser's name from the team that answers (HR's own roles still see it); the deadlines are worked out at raise, on the raiser's branch's working calendar, and stored. Files arrive as the Wall's attachments do: up to five, each up to 1 MB decoded, and the reply carries 300-second signed links.

        A raise is one form with its own daily bucket of 20 tickets a day per employee (429 `RATE_LIMITED` with the Helpdesk's own words), on top of the ESS-wide limits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HelpdeskTicketCreate'
            examples:
              raise:
                value: { category: it_lab, subject: 'The lab PCs will not start.', body: 'Six machines in Lab 2 stay on the boot screen; the morning batch is waiting.' }
              anonymous:
                value: { category: grievance, subject: 'A matter to raise quietly.', body: 'The details, written for HR alone.', anonymous: true }
