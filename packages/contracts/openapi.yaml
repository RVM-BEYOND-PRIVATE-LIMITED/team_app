      x-owner: ess
      summary: Change an employee's personal details, for HR
      description: |
        The roles of `GET` on this path. Any of the ten fields, with the rules of `PUT /ess/me/personal`, plus:

        - `date_of_birth`: a real day, YYYY-MM-DD, from 1940-01-01 to the day 16 years before today (IST). Somebody born on 29 February turns 16 on the 28th.
        - `address_line1`, `address_line2`: up to 200 characters; `city`, `state`: up to 80; `pincode`: 6 digits, not starting with 0.
        - Not on one's own record: 409 `OWN_RECORD`. Another HR person changes it.
        - Only the fields sent are written; a save that would leave half an emergency contact with one made meanwhile is 409 `RECORD_CHANGED`, as for `PUT /ess/me/personal`.
        - Recorded in `hr_ess_audit` after the change, naming the fields that changed and never their values. If that row cannot be written the change still stands and the entry goes to the server log.
