            enum: [approvals, decisions, priority_tasks]

    # ───────────── Scheduler: portal sign-in ─────────────

    UserRole:
      type: string
      enum: [ceo, super_admin, hoo, hod, hod_placement, admin_manager, admin, accounts_admin, hr, hr_executive, faculty]
      description: A Scheduler portal role (users.role) that can sign in. Students have their own token, and the connector account cannot sign in.

    PortalLoginRequest:
      type: object
      required: [username, password, locationName]
      properties:
        username:
          type: string
          minLength: 1
          description: The username or the login phone number, matched exactly as stored. Not an email, not an employee code.
        password:
          type: string
          minLength: 1
        locationName:
          type: string
          minLength: 1
          description: A branch name exactly as the Scheduler stores it (the web offers Faridabad, Pune, Ahmedabad and Lucknow). It decides between accounts that share an identifier, and goes into the token.

    PortalSession:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: The portal JWT. 64 hours, no refresh.
        user:
          type: object
          required: [userId, username, role, locationId, locationName]
          properties:
            userId:
              type: string
              format: uuid
            username:
              type: [string, 'null']
              description: Null for an account that signs in by phone only.
            role:
              $ref: '#/components/schemas/UserRole'
            locationId:
              type: [integer, 'null']
              description: The account's Scheduler branch; null for accounts with no branch.
            locationName:
              type: [string, 'null']
              description: The branch name that was typed (sign-in) or echoed (verify), not checked against locationId.

    TwoFactorChallenge:
      type: object
      required: [two_factor_required, challenge_id, sent_to, expires_at, location_name]
      properties:
        two_factor_required:
          type: boolean
          const: true
        challenge_id:
          type: string
          format: uuid
        sent_to:
          type: string
          description: The email the code went to, masked, for example ra•••@rvmcad.org.
        expires_at:
          type: string
          format: date-time
        location_name:
          type: string
          description: The branch name from the sign-in, to send back to `/users/login/verify`.

    LoginVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^\s*(\d\s*){6}$'
          description: The six digits from the email; spaces are ignored.
        location_name:
          type: [string, 'null']
          description: The challenge's location_name, sent back unchanged.

    ForgotPasswordRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          description: A username or the account's email. A missing or unknown one still answers 200.

    ForgotPasswordConfirmRequest:
      type: object
      required: [identifier, code, new_password]
      properties:
        identifier:
          type: string
          description: The same identifier as the request step.
        code:
          type: string
          pattern: '^\s*(\d\s*){6}$'
        new_password:
          type: string
          minLength: 8
        confirm_password:
          type: string
          description: Optional. When present it must equal new_password.

    OkMessage:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
          const: true
        message:
          type: string

    MessageOnly:
      type: object
      required: [message]
      properties:
        message:
          type: string

    LegacyResetPasswordRequest:
      type: object
      description: The legacy reset's body at `c28b9ca`; the endpoint is still live. Never send it.
      required: [username, phone_number, new_password]
      properties:
        username:
          type: string
        phone_number:
          type: string
        locationName:
          type: string
        new_password:
          type: string

    # ───────────── Scheduler: attendance sign-in ─────────────

    AttendancePasswordLoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          minLength: 1
          description: The main phone on the HR record (+91, 91 or a leading 0 allowed), the email on it, or the employee code (any case).
        password:
          type: string
          minLength: 1

    AttendanceCodeRequest:
      type: object
      required: [identifier]
      properties:
        identifier:
          type: string
          minLength: 1
          description: The main phone on the HR record (a ten-digit Indian mobile; +91, 91 or a leading 0 allowed), or the email on it.

    AttendanceCodeSent:
      type: object
      required: [challenge_id, channel, sent_to, expires_at, ttl_minutes, sandbox]
      properties:
        challenge_id:
          type: string
          format: uuid
        channel:
          type: string
          enum: [sms, email]
        sent_to:
          type: string
          description: Where the code went, masked (••••••2345, or ra•••@rvmcad.org).
        expires_at:
          type: string
          format: date-time
        ttl_minutes:
          type: integer
          description: How long the code lives, in minutes. Always 10 at c28b9ca.
        sandbox:
          type: boolean
          description: True when the server is in console mode and the code was logged, not delivered.

    AttendanceCodeVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: '^\s*(\d\s*){6}$'
          description: The six digits; spaces are ignored.

    AttendanceSession:
      type: object
      required: [token, expires_in_days, employee, password_set, temporary]
      properties:
        token:
          type: string
          description: The attendance session. Opens /hr/my-attendance/* and /ess/* only.
        expires_in_days:
          type: integer
          description: How long the session lasts, in days. Always 30 at c28b9ca.
        employee:
          type: object
          required: [full_name]
          properties:
            full_name:
              type: string
        password_set:
          type: boolean
          description: False when the login has no password at all; offer to set one.
        temporary:
          type: boolean
          description: True while the password is still the one HR gave.

    AttendanceSetPasswordRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: At least 8 characters and at most 72 bytes; not one character repeated; not containing the main phone's ten digits; not HR's first-time password.

    AttendancePasswordSet:
      type: object
      required: [token, password_set]
      properties:
        token:
          type: string
          description: A fresh 30-day attendance session. Every older session of this login no longer works.
        password_set:
          type: boolean
          const: true

    # ───────────── Scheduler: attendance ─────────────

    MyAttendance:
      oneOf:
        - $ref: '#/components/schemas/MyAttendanceUnlinked'
        - $ref: '#/components/schemas/MyAttendanceMustSetPassword'
        - $ref: '#/components/schemas/MyAttendanceMonth'

    MyAttendanceUnlinked:
      type: object
      description: A portal login with no HR record linked.
      required: [linked, message]
      properties:
        linked:
          type: boolean
          const: false
        message:
          type: string

    MyAttendanceMustSetPassword:
      type: object
      description: A password session still on HR's first-time password. Show only "Choose your own password".
      required: [linked, must_set_password, employee]
      properties:
        linked:
          type: boolean
          const: true
        must_set_password:
          type: boolean
          const: true
        employee:
          type: object
          required: [id, full_name, employee_code]
          properties:
            id:
              type: string
              format: uuid
            full_name:
              type: string
            employee_code:
              type: [string, 'null']

    MyAttendanceMonth:
      type: object
      required: [linked, employee, branch, shift, week_off_days, holidays, upcoming_holidays, my_remarks, today, device, rules, month, days]
      properties:
        linked:
          type: boolean
          const: true
        employee:
          type: object
          required: [id, full_name, employee_code, geofence_exempt]
          properties:
            id:
              type: string
              format: uuid
            full_name:
              type: string
            employee_code:
              type: [string, 'null']
            geofence_exempt:
              type: boolean
              description: Field staff. The radius is not enforced; the location is still recorded.
        branch:
          type: [object, 'null']
          required: [id, name, latitude, longitude, radius_m, configured]
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            latitude:
              type: [number, 'null']
            longitude:
              type: [number, 'null']
            radius_m:
              type: integer
              description: The geofence radius in metres (25 to 2000; 150 unless HR set it).
            configured:
              type: boolean
              description: False until HR sets the branch's location; punches are then refused BRANCH_NOT_CONFIGURED unless geofence-exempt.
        shift:
          type: [object, 'null']
          description: The employee's shift. Null when they are not on one (they are marked by hand) or before migration 20261022000000.
          required: [name, start, end, grace_minutes]
          properties:
            name:
              type: string
            start:
              type: string
              pattern: '^\d{2}:\d{2}$'
              description: HH:MM, IST.
            end:
              type: string
              pattern: '^\d{2}:\d{2}$'
              description: HH:MM, IST.
            grace_minutes:
              type: integer
        week_off_days:
          type: [array, 'null']
          description: Weekly offs, 0 = Sunday to 6 = Saturday. Null before migration 20261022000000.
          items:
            type: integer
            minimum: 0
            maximum: 6
        holidays:
          type: array
          description: The month's holidays for the employee's branch or for every branch.
          items:
            $ref: '#/components/schemas/Holiday'
        upcoming_holidays:
          type: array
          description: The next holidays from today, up to 120 days ahead and at most 12.
          maxItems: 12
          items:
            $ref: '#/components/schemas/Holiday'
        my_remarks:
          type: array
          description: The employee's own remarks on the month's days.
          items:
            type: object
            required: [day, remarks, updated_at]
            properties:
              day:
                type: string
                format: date
              remarks:
                type: string
              updated_at:
                type: string
                format: date-time
        today:
          $ref: '#/components/schemas/Today'
        device:
          type: object
          required: [this_phone, has_registered_phone, registered_at]
          properties:
            this_phone:
              type: string
              enum: [own, other, revoked, unknown]
              description: What the rvm_att_dev cookie on this request says about this phone.
            has_registered_phone:
              type: boolean
              description: Whether the employee has an active registered phone, this one or another.
            registered_at:
              type: [string, 'null']
              format: date-time
        rules:
          type: object
          required: [max_accuracy_m, mobile_only]
          properties:
            max_accuracy_m:
              type: number
              description: A fix vaguer than this is refused ACCURACY_LOW.
            mobile_only:
              type: boolean
              description: Whether a punch needs a phone User-Agent.
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
        days:
          type: array
          description: The month's day rows, oldest first.
          items:
            $ref: '#/components/schemas/DayRow'

    Holiday:
      type: object
      required: [day, name]
      properties:
        day:
          type: string
          format: date
        name:
          type: string

    DayStatus:
      type: string
      enum: [present, absent, half_day, leave, week_off, holiday]

    Today:
      type: object
      description: Today (IST), from today's accepted punches and today's day row.
      required: [day, punched_in, done, first_in, last_out, punches, worked_minutes, kind, holiday, status, late_minutes, early_exit_minutes, late_count, late_half_day, late_excused]
      properties:
        day:
          type: string
          format: date
        punched_in:
          type: boolean
          description: The last accepted punch today was an in.
        done:
          type: boolean
          description: Punched out; no more punches until IST midnight (DAY_DONE).
        first_in:
          type: [string, 'null']
          format: date-time
        last_out:
          type: [string, 'null']
          format: date-time
        punches:
          type: array
          items:
            type: object
            required: [kind, at, distance_m]
            properties:
              kind:
                type: string
                enum: [in, out]
              at:
                type: string
                format: date-time
              distance_m:
                type: [number, 'null']
        worked_minutes:
          type: integer
          minimum: 0
          description: Counts up to the moment of the request while punched in.
        kind:
          type: string
          enum: [no_shift, holiday, week_off, working]
          description: What today is on the shift rules. no_shift means the employee is not on a shift and is marked by hand.
        holiday:
          type: [string, 'null']
          description: Today's holiday name.
        status:
          oneOf:
            - $ref: '#/components/schemas/DayStatus'
            - type: 'null'
        late_minutes:
          type: [integer, 'null']
        early_exit_minutes:
          type: [integer, 'null']
        late_count:
          type: [integer, 'null']
          description: Which late arrival of the month today is.
        late_half_day:
          type: boolean
          description: Today became a half day as the month's third late arrival.
        late_excused:
          type: boolean

    DayRow:
      type: object
      description: |
        One day's record (hr_staff_attendance). The fields from late_minutes on arrive with migration 20261022000000 and are missing before it.
      required: [day, status, leave_type, source, first_in, last_out, worked_minutes]
      properties:
        day:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/DayStatus'
        leave_type:
          type: [string, 'null']
          description: cl, lwp, leave, or an older free-text type.
        source:
          type: string
          enum: [manual, self_punch, override, auto]
          description: Who wrote the row. override is HR's word on the day; auto is the nightly job.
        first_in:
          type: [string, 'null']
          format: date-time
        last_out:
          type: [string, 'null']
          format: date-time
        worked_minutes:
          type: [integer, 'null']
        late_minutes:
          type: [integer, 'null']
        early_exit_minutes:
          type: [integer, 'null']
        late_count:
          type: [integer, 'null']
        late_half_day:
          type: boolean
        late_excused:
          type: boolean
        shift_start:
          type: [string, 'null']
          description: HH:MM:SS, the shift the day is judged by.
        shift_end:
          type: [string, 'null']
          description: HH:MM:SS.

    PunchChallenge:
      type: object
      required: [nonce, expires_at]
      properties:
        nonce:
          type: string
          description: Send it unchanged as the punch's nonce.
        expires_at:
          type: string
          format: date-time
          description: Two minutes after issue.

    PunchRequest:
      type: object
      required: [kind, nonce, latitude, longitude, accuracy_m]
      properties:
        kind:
          type: string
          enum: [in, out]
        nonce:
          type: string
          description: The nonce from GET /hr/my-attendance/challenge, unchanged.
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracy_m:
          type: number
          minimum: 0
          description: The fix's horizontal accuracy in metres. Required.
        client_at:
          type: string
          format: date-time
          description: The phone's clock at the fix. Kept beside the server time and never trusted.
        note:
          type: string
          description: The employee's own word on the punch, for HR. Trimmed and cut to 200 characters without an error; never changes how the punch is judged.

    PunchAccepted:
      type: object
      required: [kind, at, distance_m, inside_geofence, flags, device_registered, today]
      properties:
        kind:
          type: string
          enum: [in, out]
        at:
          type: string
          format: date-time
          description: The server's time of the punch.
        distance_m:
          type: [integer, 'null']
          description: Metres from the branch; null when the branch has no location (geofence-exempt staff).
        inside_geofence:
          type: [boolean, 'null']
        flags:
          type: array
          items:
            type: string
            enum: [new_device, suspicious_accuracy, exempt_outside, off_network, possible_proxy]
        device_registered:
          type: boolean
          description: True when this punch registered the phone and set the rvm_att_dev cookie.
        today:
          type: object
          description: The day after this punch. The fields after punched_in are missing before migration 20261022000000 or when the day has no row.
          required: [worked_minutes, punched_in]
          properties:
            worked_minutes:
              type: integer
              minimum: 0
            punched_in:
              type: boolean
            status:
              $ref: '#/components/schemas/DayStatus'
            late_minutes:
              type: [integer, 'null']
            early_exit_minutes:
              type: [integer, 'null']
            late_count:
              type: [integer, 'null']
            late_half_day:
              type: boolean

    PingRequest:
      type: object
      required: [latitude, longitude, accuracy_m]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        accuracy_m:
          type: number
          minimum: 0

    PingStored:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
          const: true

    RemarkRequest:
      type: object
      required: [day]
      properties:
        day:
          type: string
          format: date
          description: From the 1st of last month to today, IST.
        remarks:
          type: [string, 'null']
          description: Up to 500 characters after trimming. Empty, null or missing removes the remark.

    RemarkSaved:
      type: object
      required: [day, remarks]
      properties:
        day:
          type: string
          format: date
        remarks:
          type: [string, 'null']
          description: Null when the remark was removed.
        updated_at:
          type: string
          format: date-time
          description: Present when the remark was saved.

  examples:

    # ───────────── ESS ─────────────

    EssSignIn:
      summary: No token
      value:
        error: Please sign in.
        code: NOT_AUTHENTICATED
    EssNotAuthenticated:
      summary: An expired token
      value:
        error: Your sign-in has expired. Please sign in again.
        code: NOT_AUTHENTICATED
    EssSignInAgain:
      summary: A forged or malformed token, or one whose account is gone
      value:
        error: Please sign in again.
        code: NOT_AUTHENTICATED
    EssPasswordChanged:
      summary: An attendance session older than the last password change
      value:
        error: Your password was changed. Please sign in again.
        code: NOT_AUTHENTICATED
    EssNotAnEmployee:
      summary: A valid token that is not a staff login
      value:
        error: Team RVM is for staff. Sign in with your staff login.
        code: NOT_AN_EMPLOYEE
    EssNotLinked:
      summary: A portal login with no HR record linked
      value:
        error: Your login is not linked to an employee record yet. Ask HR or the tech team to link it.
        code: NOT_LINKED
    EssNotActive:
      summary: The employee has left
      value:
        error: Your employee record is no longer active, so Team RVM is closed for this login. Ask HR if this is wrong.
        code: NOT_ACTIVE
    EssNoAttendanceLogin:
      summary: The attendance login is missing
      value:
        error: You do not have an attendance login yet. Ask HR to create one for you.
        code: NO_ATTENDANCE_LOGIN
    EssAttendanceLoginOff:
      summary: HR switched the attendance login off
      value:
        error: Your attendance login is turned off. Ask HR.
        code: NO_ATTENDANCE_LOGIN
    EssPasswordChangeRequired:
      summary: Signed in with HR's first-time password, not yet replaced
      value:
        error: Set your own password first. The password HR gave you only works once.
        code: PASSWORD_CHANGE_REQUIRED
    EssRateLimited:
      value:
        error: Too many requests. Wait a minute and try again.
        code: RATE_LIMITED
    EssUnavailable:
      summary: The database could not be reached
      value:
        error: The server cannot reach the database right now. Try again in a minute.
        code: UNAVAILABLE
    EssModuleDisabled:
      summary: ESS_ENABLED is "false"
      value:
        error: Team RVM is switched off on the server for now. Try again later.
        code: MODULE_DISABLED
    EssNotInstalled:
      summary: The code is live before its migration
      value:
        error: Team RVM needs a database update that has not been applied yet (it cannot read hr_employees). Ask the tech team.
        code: MODULE_NOT_INSTALLED

    SessionTokensPortal:
      summary: A portal login kept
      value:
        session:
          id: 0c9d8e7f-6a5b-4c3d-9e2f-1a0b9c8d7e6f
          expires_at: '2027-01-14T04:30:00.000Z'
        access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.PAYLOAD.SIGNATURE
        access_expires_at: '2026-10-16T05:30:00.000Z'
        refresh_token: 3q2-7wAAAAB1rXkTl0dS9vNc_8yGhH4Jm0bQe1fPzKs
        login:
          kind: portal
          role: faculty
          user_id: 6d5c4b3a-2f1e-4d0c-9b8a-7f6e5d4c3b2a
    SessionTokensAttendance:
      summary: An attendance session kept, or refreshed
      value:
        session:
          id: 5e4d3c2b-1a09-4f8e-8d7c-6b5a4f3e2d1c
          expires_at: '2027-01-14T04:30:00.000Z'
        access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.PAYLOAD.SIGNATURE
        access_expires_at: '2026-10-16T05:30:00.000Z'
        refresh_token: Xk9_2bLmQ0aZ7rT4yWc1vN8sE3uI5oP6dF0gH2jK4lM
        login:
          kind: attendance
          role: null
          user_id: null
    EssSignInNotFresh:
      summary: The sign-in is more than 10 minutes old
      value:
        error: To stay signed in on this phone, sign in again and keep the sign-in within 10 minutes.
        code: SIGN_IN_NOT_FRESH
    EssAlreadyExchanged:
      value:
        error: This phone is already signed in. There is nothing more to do.
        code: ALREADY_EXCHANGED
    EssRefreshInProgress:
      value:
        error: Your sign-in is being renewed. Try again in a moment.
        code: REFRESH_IN_PROGRESS
    EssSessionNotFound:
      value:
        error: That sign-in is not one of yours, or it has already ended.
        code: NOT_FOUND
    EssBadInstallId:
      value:
        error: The app did not identify this phone correctly. Update the app and try again.
        code: BAD_INSTALL_ID
    EssBadDeviceLabel:
      value:
        error: The app sent a phone name the server cannot keep. Update the app and try again.
        code: BAD_DEVICE_LABEL
    EssBadIdentifier:
      value:
        error: Enter your phone number, email, employee code or username.
        code: BAD_IDENTIFIER
    EssInvalidJson:
      value:
        error: The request body is not valid JSON.
        code: INVALID_JSON
    MyPersonalDetails:
      summary: Everything recorded
      value:
        personal:
          date_of_birth: '1994-05-21'
          blood_group: B+
          address_line1: House 12, Sector 15
          address_line2: null
          city: Faridabad
          state: Haryana
          pincode: '121007'
          emergency_name: Sunita Yadav
          emergency_relation: Mother
          emergency_phone: '9876543210'
          updated_at: '2026-10-16T06:30:00+00:00'
          updated_by_name: Suresh Yadav
    EssUnknownField:
      value:
        error: The request has a field the server does not take.
        code: VALIDATION_FAILED
    EssBodyNotObject:
      value:
        error: The request body must be a JSON object.
        code: VALIDATION_FAILED
    EssInvalidId:
      value:
        error: That is not a valid id.
        code: VALIDATION_FAILED
    EssDateFormat:
      value:
        error: Dates must be real days written YYYY-MM-DD.
        code: VALIDATION_FAILED
    EssBranchId:
      value:
        error: branch_id must be a branch id.
        code: VALIDATION_FAILED
    EssHrAccessDenied:
      summary: A portal role outside HR
      value:
        error: Only HR, the CEO and super admins can open this.
        code: HR_ACCESS_DENIED
    EssAttendanceOverrideDenied:
      summary: A portal role outside HR, the CEO and super admins
      value:
        error: Only HR, the CEO and super admins can do this.
        code: ATTENDANCE_OVERRIDE_DENIED
    EssPortalLoginRequired:
      summary: HR signed in on an attendance session
      value:
        error: HR tools need your portal login. Sign in with your username or login phone.
        code: PORTAL_LOGIN_REQUIRED

    # ───────────── Scheduler ─────────────

    NoTokenProvided:
      summary: No Authorization header (no code)
      value:
        error: No token provided
    PleaseAuthenticate:
      summary: A rejected token, or a failed user lookup (no code)
      value:
        error: Please authenticate
    PunchPleaseSignIn:
      summary: No caller could be identified (defensive)
      value:
        error: Please sign in.
        code: NOT_AUTHENTICATED
    PunchSignInAgain:
      summary: The attendance session's employee record is gone
      value:
        error: Please sign in again.
        code: NOT_AUTHENTICATED
    PunchPasswordChanged:
      summary: The attendance session predates the last password change
      value:
        error: Your password was changed. Please sign in again.
        code: NOT_AUTHENTICATED
    PunchNotLinked:
      value:
        error: Your login is not linked to an employee record yet. Ask HR or the tech team to link it.
        code: NOT_LINKED
    PunchNotActive:
      value:
        error: Your employee record is not active, so punching is closed.
        code: NOT_ACTIVE
    NoAttendanceLoginYet:
      value:
        error: You do not have an attendance login yet. Ask HR to create one for you.
        code: NO_ATTENDANCE_LOGIN
    NoAttendanceLoginOff:
      value:
        error: Your attendance login is turned off. Ask HR.
        code: NO_ATTENDANCE_LOGIN
    HasPortalLogin:
      value:
        error: You have a portal login. Sign in to the portal and use the Punch button at the top.
        code: HAS_PORTAL_LOGIN
    NotMainPhone:
      value:
        error: This number is on your employee record as an extra number, not the main one. Ask HR to set it as your main phone number, or sign in with your email.
        code: NOT_MAIN_PHONE
    PasswordChangeRequired:
      value:
        error: Set your own password first. The password HR gave you only works once.
        code: PASSWORD_CHANGE_REQUIRED
    DeviceNotRegistered:
      value:
        error: Your attendance is registered to a different phone. Ask HR to reset your phone if you have changed it.
        code: DEVICE_NOT_REGISTERED
    HrModuleDisabled:
      summary: HR_MODULE_ENABLED=false
      value:
        error: The HR module is currently disabled.
        code: MODULE_DISABLED
    PunchNotInstalled:
      value:
        error: Punch attendance is not installed yet. Apply migration 20261020000000_hr_attendance_punch.sql.
        code: MODULE_NOT_INSTALLED
        module: HR
        migration: 20261020000000_hr_attendance_punch.sql
    AccountsNotInstalled:
      value:
        error: Attendance logins are not installed yet. Apply migration 20261021000000_hr_attendance_accounts.sql.
        code: MODULE_NOT_INSTALLED
        module: HR
        migration: 20261021000000_hr_attendance_accounts.sql
    RulesNotInstalled:
      value:
        error: Shifts and late rules are not installed yet. Apply migration 20261022000000_hr_attendance_shifts.sql.
        code: MODULE_NOT_INSTALLED
        module: HR
        migration: 20261022000000_hr_attendance_shifts.sql
    ApiRateLimited:
      summary: 300 a minute across /api (no code)
      value:
        error: Too many requests. Please slow down.
    LoginRateLimited:
      summary: 20 in 15 minutes per IP address (no code)
      value:
        error: Too many login attempts. Please try again in 15 minutes.
    CodeRequestsRateLimited:
      summary: 10 in 15 minutes per IP address (no code)
      value:
        error: Too many code requests. Wait fifteen minutes and try again.
    AttendanceSignInRateLimited:
      summary: 40 in 15 minutes per IP address
      value:
        error: Too many sign-in attempts from this network. Wait fifteen minutes and try again.
        code: RATE_LIMITED
    PortalBadCode:
      value:
        error: Enter the six-digit code from the email.
        code: BAD_CODE
    PortalNoLiveCode:
      value:
        error: No code is waiting. Request a new one.
        code: NO_LIVE_CODE
    PortalCodeExpired:
      value:
        error: That code has expired. Request a new one.
        code: EXPIRED
    PortalWrongCode:
      value:
        error: Wrong code. 4 attempts left.
        code: WRONG_CODE
    PortalAttemptsExhausted:
      value:
        error: Too many wrong codes. Request a new one.
        code: ATTEMPTS_EXHAUSTED

    # ───────────── C1-C12: requests, leave and approvals ─────────────

    EssRequestReason:
      value:
        error: Say the reason, in 5 to 1,000 characters.
        code: VALIDATION_FAILED
    EssRequestWindow:
      value:
        error: Requests can be for this month or last month only.
        code: REQUEST_WINDOW
    EssRequestClosed:
      value:
        error: Last month's requests closed on the 5th. Ask HR.
        code: REQUEST_CLOSED
    EssRequestFuture:
      value:
        error: That day has not happened yet.
        code: REQUEST_FUTURE
    EssTimesIncomplete:
      value:
        error: The day would still be missing an in or out time. Ask the employee for the full times.
        code: TIMES_INCOMPLETE
    EssDayLocked:
      value:
        error: That day is recorded as leave, a week off or a holiday. Change the day first.
        code: DAY_LOCKED
    EssDuplicateRequest:
      value:
        error: You already have a request for that day. Wait for it to be decided.
        code: DUPLICATE_REQUEST
    EssLimitReached:
      value:
        error: That is over this type's monthly limit. Check the balance on the form.
        code: LIMIT_REACHED
    EssRequestNotFound:
      value:
        error: That request was not found.
        code: NOT_FOUND
    EssRequestNotPending:
      value:
        error: Only a pending request can be withdrawn.
        code: REQUEST_NOT_PENDING
    EssAlreadyDecided:
      value:
        error: That request has already been decided.
        code: ALREADY_DECIDED
    EssNotAnApprover:
      value:
        error: Only the person's manager or HR can decide this request.
        code: NOT_AN_APPROVER
    EssNotLate:
      value:
        error: That day is not a late arrival.
        code: NOT_LATE
    EssCannotCancel:
      value:
        error: Only an approved request can be cancelled.
        code: CANNOT_CANCEL
    EssClTaken:
      value:
        error: This month's CL is already taken. Reject this request, or approve it as leave without pay.
        code: CL_LIMIT
    EssBalancesMonth:
      value:
        error: Look at this month or last month.
        code: DAY_OUT_OF_RANGE

    # ───────────── D5-D8: push devices and notifications ─────────────

    EssPushToken:
      value:
        error: The phone's push token is missing or not valid.
        code: VALIDATION_FAILED
    EssNotificationCategories:
      value:
        error: 'Choose the notification categories: approvals, decisions or priority_tasks.'
        code: VALIDATION_FAILED
    EssNotificationNotFound:
      value:
        error: That notification was not found.
        code: NOT_FOUND
    EssDeviceNotFound:
      value:
        error: That phone was not found.
        code: NOT_FOUND

  responses:

    # ───────────── ESS ─────────────

    EssNotAuthenticated:
      description: |
        `NOT_AUTHENTICATED`: the token is absent or rejected. That means no token, a bad signature, an expired token, a wrong algorithm, an attendance session issued before its login's `sessions_valid_from`, a token whose account no longer exists (including a teaching account whose faculty id no longer matches its token), or an access token whose kept sign-in has ended (its `sid` names no live sign-in of the same person). **This is the only reply on which the app signs out**; with a kept sign-in, it refreshes once first and signs out only if the refresh answers 401. The ESS never sends it for a database outage.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            noToken:
              $ref: '#/components/examples/EssSignIn'
            expired:
              $ref: '#/components/examples/EssNotAuthenticated'
            rejected:
              $ref: '#/components/examples/EssSignInAgain'
            passwordChanged:
              $ref: '#/components/examples/EssPasswordChanged'

    EssForbidden:
      description: |
        The token is good, but this person cannot use Team RVM as things stand. Show the message; do not sign out on its own.
        - `NOT_AN_EMPLOYEE`: a valid token that is not a staff login (a student or admission-undertaking token), or a portal token whose account is not staff (the connector account).
        - `NOT_LINKED`: a portal login with no linked HR record; HR links it.
        - `NOT_ACTIVE`: the employee has left.
        - `NO_ATTENDANCE_LOGIN`: an attendance session whose login is missing or switched off.
        - `PASSWORD_CHANGE_REQUIRED`: an attendance session signed in with HR's first-time password, before the person chose their own. Send them to "Choose your own password".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notAnEmployee:
              $ref: '#/components/examples/EssNotAnEmployee'
            notLinked:
              $ref: '#/components/examples/EssNotLinked'
            notActive:
              $ref: '#/components/examples/EssNotActive'
            noAttendanceLogin:
              $ref: '#/components/examples/EssNoAttendanceLogin'
            attendanceLoginOff:
              $ref: '#/components/examples/EssAttendanceLoginOff'
            passwordChangeRequired:
              $ref: '#/components/examples/EssPasswordChangeRequired'

    EssRateLimited:
      description: |
        `RATE_LIMITED`: more than 600 requests in a minute from this IP address (every path, counted before the token is checked), or more than 120 in a minute from this employee (after it). Wait for `Retry-After` seconds.

        The few paths with a tighter bucket of their own say so on the operation.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              $ref: '#/components/examples/EssRateLimited'

    EssUnavailable:
      description: |
        Not a reason to sign out; keep the session and try again later.
        - `UNAVAILABLE`: the database could not be reached, or answered something the ESS could not use.
        - `MODULE_DISABLED`: the ESS is switched off (`ESS_ENABLED=false`), checked before the token. The Scheduler's sign-in and punching still work.
        - `MODULE_NOT_INSTALLED`: a table, column or function this needs is missing, in the window between a deploy and KP applying its migration (ADR-0021). An access token of a kept sign-in answers it too while `hr_ess_sessions` is missing (before its migration, or after a rollback); sign in again with the Scheduler.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unavailable:
              $ref: '#/components/examples/EssUnavailable'
            moduleDisabled:
              $ref: '#/components/examples/EssModuleDisabled'
            notInstalled:
              $ref: '#/components/examples/EssNotInstalled'

    EssUnexpected:
      description: |
        Any other failure, in the same `{ error, code }` body. Today these are 404 `NOT_FOUND` for an address the ESS does not have, or a method it does not take there (OPTIONS included); 400 `INVALID_JSON` or `BAD_REQUEST`, 413 `PAYLOAD_TOO_LARGE` and 415 `UNSUPPORTED_MEDIA_TYPE` for a body it cannot read; and 500 `INTERNAL_ERROR` for a fault on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                error: There is nothing at this address.
                code: NOT_FOUND
            internal:
              value:
                error: Something went wrong on the server. Try again, and tell the tech team if it keeps happening.
                code: INTERNAL_ERROR

    EssBadSessionRequest:
      description: |
        Nothing is kept or ended.
        - `BAD_INSTALL_ID`: no install id, or not 16 to 128 of `A-Z a-z 0-9 . _ -`.
        - `BAD_DEVICE_LABEL`: a phone name over 80 characters, with a control character, or not a string.
        - `INVALID_JSON`, `BAD_REQUEST`: a body the ESS cannot read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badInstallId:
              $ref: '#/components/examples/EssBadInstallId'
            badDeviceLabel:
              $ref: '#/components/examples/EssBadDeviceLabel'
            invalidJson:
              $ref: '#/components/examples/EssInvalidJson'

    EssSessionRateLimited:
      description: |
        `RATE_LIMITED`: refresh and sign-out by refresh token allow 120 in 15 minutes from one address; keeping a sign-in allows one employee 10 in 15 minutes; and the ESS-wide limits apply as everywhere. Wait for `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              $ref: '#/components/examples/EssRateLimited'

    EssSignInRateLimited:
      description: |
        `RATE_LIMITED`: 40 in 15 minutes from one address, or 10 in 15 minutes for one identifier from any address. Wait for `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              $ref: '#/components/examples/EssRateLimited'

    EssHrForbidden:
      description: |
        Not a reason to sign out.
        - `PORTAL_LOGIN_REQUIRED`: an attendance session. HR's tools need the portal login.
        - `HR_ACCESS_DENIED`: a portal role other than `hr`, `hr_executive` or `super_admin`.
        - `NOT_AN_EMPLOYEE`, `NOT_LINKED`, `NOT_ACTIVE`, `NO_ATTENDANCE_LOGIN`, `PASSWORD_CHANGE_REQUIRED`: as for `GET /ess/me`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            hrAccessDenied:
              $ref: '#/components/examples/EssHrAccessDenied'
            portalLoginRequired:
              $ref: '#/components/examples/EssPortalLoginRequired'
            notAnEmployee:
              $ref: '#/components/examples/EssNotAnEmployee'
            notLinked:
              $ref: '#/components/examples/EssNotLinked'
            notActive:
              $ref: '#/components/examples/EssNotActive'
            noAttendanceLogin:
              $ref: '#/components/examples/EssNoAttendanceLogin'
            passwordChangeRequired:
              $ref: '#/components/examples/EssPasswordChangeRequired'

    EssAttendanceHrForbidden:
      description: |
        Not a reason to sign out.
        - `PORTAL_LOGIN_REQUIRED`: an attendance session. These tools need the portal login.
        - `ATTENDANCE_OVERRIDE_DENIED`: a portal role other than `hr`, `ceo` or `super_admin` (an `hr_executive` included).
        - `NOT_AN_EMPLOYEE`, `NOT_LINKED`, `NOT_ACTIVE`, `NO_ATTENDANCE_LOGIN`, `PASSWORD_CHANGE_REQUIRED`: as for `GET /ess/me`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            attendanceOverrideDenied:
              $ref: '#/components/examples/EssAttendanceOverrideDenied'
            portalLoginRequired:
              $ref: '#/components/examples/EssPortalLoginRequired'
            notAnEmployee:
              $ref: '#/components/examples/EssNotAnEmployee'
            notLinked:
              $ref: '#/components/examples/EssNotLinked'
            notActive:
              $ref: '#/components/examples/EssNotActive'
            noAttendanceLogin:
              $ref: '#/components/examples/EssNoAttendanceLogin'
            passwordChangeRequired:
              $ref: '#/components/examples/EssPasswordChangeRequired'

    EssBadPersonalDetails:
      description: |
        `VALIDATION_FAILED`: the message says which rule (the body, a field's format, or an incomplete emergency contact). `INVALID_JSON`, `BAD_REQUEST`: a body the ESS cannot read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            nothing:
              value: { error: Send at least one field to change., code: VALIDATION_FAILED }
            dateOfBirth:
              value: { error: 'Date of birth must be a real date (YYYY-MM-DD) from 1940 on, at least 16 years ago.', code: VALIDATION_FAILED }
            bloodGroup:
              value: { error: 'Blood group must be one of A+, A-, B+, B-, AB+, AB-, O+ or O-.', code: VALIDATION_FAILED }
            address:
              value: { error: 'Each address line can be up to 200 characters, and the city and state up to 80.', code: VALIDATION_FAILED }
            pincode:
              value: { error: The PIN code must be 6 digits., code: VALIDATION_FAILED }
            emergencyName:
              value: { error: The emergency contact name can be up to 100 characters., code: VALIDATION_FAILED }
            emergencyRelation:
              value: { error: The relation can be up to 50 characters., code: VALIDATION_FAILED }
            emergencyPhone:
              value: { error: The emergency contact phone must be a 10-digit Indian mobile number., code: VALIDATION_FAILED }
            incomplete:
              value: { error: 'An emergency contact needs both a name and a phone number, and a relation needs a name.', code: VALIDATION_FAILED }
            id:
              $ref: '#/components/examples/EssInvalidId'
            unknownField:
              $ref: '#/components/examples/EssUnknownField'
            notObject:
              $ref: '#/components/examples/EssBodyNotObject'

    EssBadHrListQuery:
      description: |
        `VALIDATION_FAILED`: a query value the message names (a status that is not offered, a day that is not real, a day outside 2000 to 2099, a range the wrong way round or over 366 days, a branch_id that is not a uuid), or one given more than once.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            date:
              $ref: '#/components/examples/EssDateFormat'
            range:
              value: { error: 'from must be on or before to, and at most 366 days before it.', code: VALIDATION_FAILED }
            outOfRange:
              value: { error: Dates must be from 2000-01-01 to 2099-12-31., code: VALIDATION_FAILED }
            branch:
              $ref: '#/components/examples/EssBranchId'
            status:
              value: { error: 'status must be active, revoked or all.', code: VALIDATION_FAILED }

    EssBranchNotFound:
      description: '`NOT_FOUND`: no branch has this `branch_id`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value: { error: That branch was not found., code: NOT_FOUND }

    EssEmployeeNotFound:
      description: '`NOT_FOUND`: no employee has this id.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value: { error: That employee was not found., code: NOT_FOUND }

    # ───────────── Scheduler ─────────────

    PunchAuthRejected:
      description: |
        The session is over, or the token was never good. Sign out on each of these, after the one check that the info section describes for "Please authenticate":
        - "No token provided" (no code): no `Authorization` header, or an empty one.
        - "Please authenticate" (no code): the token is neither a valid attendance session nor a valid portal token (expired, a bad signature, malformed, or its account is gone). An expired attendance session lands here, not on `NOT_AUTHENTICATED`. **Also sent when the Scheduler's user lookup fails during a database outage**, which is why the check comes first.
        - `NOT_AUTHENTICATED` "Please sign in again.": the attendance session's employee record no longer exists.
        - `NOT_AUTHENTICATED` "Your password was changed. Please sign in again.": the attendance session predates the last password set or reset.
        - `NOT_AUTHENTICATED` "Please sign in.": no caller could be identified (defensive; not expected).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchedulerError'
          examples:
            noToken:
              $ref: '#/components/examples/NoTokenProvided'
            pleaseAuthenticate:
              $ref: '#/components/examples/PleaseAuthenticate'
            signInAgain:
              $ref: '#/components/examples/PunchSignInAgain'
            passwordChanged:
              $ref: '#/components/examples/PunchPasswordChanged'
            pleaseSignIn:
              $ref: '#/components/examples/PunchPleaseSignIn'

    PunchIdentityForbidden:
      description: |
        - `NOT_LINKED`: a portal login with no HR record linked.
        - `NOT_ACTIVE`: the employee record is no longer active.
        - `NO_ATTENDANCE_LOGIN`: an attendance session whose login is missing or switched off.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchedulerError'
          examples:
            notLinked:
              $ref: '#/components/examples/PunchNotLinked'
            notActive:
              $ref: '#/components/examples/PunchNotActive'
            noLogin:
              $ref: '#/components/examples/NoAttendanceLoginYet'
            loginOff:
              $ref: '#/components/examples/NoAttendanceLoginOff'

    SchedulerApiRateLimited:
      description: '"Too many requests. Please slow down." (no code): 300 requests in a minute from this IP address, across all of `/api`.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchedulerError'
          examples:
            apiBucket:
              $ref: '#/components/examples/ApiRateLimited'

    HrUnavailable:
      description: |
        Not a reason to sign out.
        - `MODULE_DISABLED`: the HR module is switched off (`HR_MODULE_ENABLED=false`), which switches all of `/hr/my-attendance` off, sign-in included.
        - `MODULE_NOT_INSTALLED`: a table, column or function this needs is missing, in the window between a deploy and KP applying its migration. `migration` names the file.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchedulerError'
          examples:
            moduleDisabled:
              $ref: '#/components/examples/HrModuleDisabled'
            punchNotInstalled:
              $ref: '#/components/examples/PunchNotInstalled'
            accountsNotInstalled:
              $ref: '#/components/examples/AccountsNotInstalled'

    # ───────────── C1-C12: requests, leave and approvals ─────────────

    EssRequestBad:
      description: |
        `VALIDATION_FAILED`: the message says which rule — a type, a day, a reason, a place, a time, a body the ESS cannot read. `INVALID_JSON`, `BAD_REQUEST`: a body it cannot read. `DAY_OUT_OF_RANGE`: a month other than this one and the last.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            reason:
              $ref: '#/components/examples/EssRequestReason'
            window:
              $ref: '#/components/examples/EssRequestWindow'
            balancesMonth:
              $ref: '#/components/examples/EssBalancesMonth'
            pushToken:
              $ref: '#/components/examples/EssPushToken'
            notificationCategories:
              $ref: '#/components/examples/EssNotificationCategories'
            unknownField:
              $ref: '#/components/examples/EssUnknownField'
            invalidId:
              $ref: '#/components/examples/EssInvalidId'
            invalidJson:
              $ref: '#/components/examples/EssInvalidJson'

    EssRequestConflict:
      description: |
        The request cannot move. A `withdraw` of something decided is `REQUEST_NOT_PENDING`; a second decision is `ALREADY_DECIDED`. An approval may be refused with `REQUEST_CLOSED` or `REQUEST_WINDOW` (last month past the cut-off), `REQUEST_FUTURE` (a fix or an excuse for a day that has not happened), `NOT_LATE`, `TIMES_INCOMPLETE`, `DAY_LOCKED` or `CL_LIMIT`; the request then stays pending. A cancel of anything but an approved request is `CANNOT_CANCEL`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            duplicate:
              $ref: '#/components/examples/EssDuplicateRequest'
            limit:
              $ref: '#/components/examples/EssLimitReached'
            notPending:
              $ref: '#/components/examples/EssRequestNotPending'
            alreadyDecided:
              $ref: '#/components/examples/EssAlreadyDecided'
            closed:
              $ref: '#/components/examples/EssRequestClosed'
            window:
              $ref: '#/components/examples/EssRequestWindow'
            future:
              $ref: '#/components/examples/EssRequestFuture'
            notLate:
              $ref: '#/components/examples/EssNotLate'
            timesIncomplete:
              $ref: '#/components/examples/EssTimesIncomplete'
            dayLocked:
              $ref: '#/components/examples/EssDayLocked'
            clTaken:
              $ref: '#/components/examples/EssClTaken'
            cannotCancel:
              $ref: '#/components/examples/EssCannotCancel'

    EssNoSuchRequest:
      description: '`NOT_FOUND`: no request (or employee) has this id.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            request:
              $ref: '#/components/examples/EssRequestNotFound'
            notification:
              $ref: '#/components/examples/EssNotificationNotFound'
            device:
              $ref: '#/components/examples/EssDeviceNotFound'
            nothing:
              value:
                error: There is nothing at this address.
                code: NOT_FOUND

    EssApproverForbidden:
      description: |
        Not a reason to sign out.
        - `NOT_AN_APPROVER`: this request is not this caller's to decide or clear.
        - `NOT_AN_EMPLOYEE`, `NOT_LINKED`, `NOT_ACTIVE`, `NO_ATTENDANCE_LOGIN`, `PASSWORD_CHANGE_REQUIRED`: as for `GET /ess/me`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notAnApprover:
              $ref: '#/components/examples/EssNotAnApprover'
