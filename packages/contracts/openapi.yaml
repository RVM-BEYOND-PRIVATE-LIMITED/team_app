              examples:
                one:
                  value:
                    requests:
                      - id: 3f2e1d0c-9b8a-4f7e-8d6c-5b4a3f2e1d0c
                        family: attendance
                        type: fix_a_day
                        status: rejected
                        day: '2026-10-15'
                        reason: I forgot to punch out.
                        place: null
                        fix_in: null
