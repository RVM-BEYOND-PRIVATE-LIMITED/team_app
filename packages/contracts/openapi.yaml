  /ess/session/refresh:
    servers:
      - url: 'https://{essHost}/api'
        description: The ESS, on its own host name (ADR-0019).
        variables:
          essHost:
            default: team-api.rvmcad.org
            description: The ESS's own host name, chosen by KP on 16 Oct 2026 (ADR-0019).
    post:
      operationId: refreshSession
      tags: [ESS]
      x-owner: ess
      summary: Trade the refresh token for the next access and refresh token
      description: |
        No bearer. Send the newest refresh token and the install id it was issued to. On success the old refresh token is spent: store the new one before using the new access token.

        Answers, in the order they are decided:
        - **401 `NOT_AUTHENTICATED`**, with `reason`: the sign-in is over. Sign out, show `error`, and sign in again.
          - `unknown`: not a refresh token the ESS issued (or none, or a malformed one).
          - `expired`: unused for 90 days.
          - `signed_out`: signed out, here or from the session list.
          - `reuse`: this refresh token was presented again after it had been traded in (more than a minute later, or from another install), or by another install. The whole sign-in ends, its newest tokens with it.
          - `password_changed`: the attendance password was set or reset since the sign-in (`sessions_valid_from`), the login is back on a password HR gave, or the portal password is no longer the one the sign-in was kept with, however it was changed: on the profile page, by forgot-password, by an admin in User Management, by `POST /users/change-password` or by `POST /users/reset-password`.
          - `login_off`: HR switched the attendance login off, or removed it.
          - `left`: the employee has left.
          - `unlinked`: the portal login is no longer linked to this person's HR record, or is no longer a staff account.
        - **409 `REFRESH_IN_PROGRESS`**: this refresh token was traded in less than a minute ago by this same install, or another refresh with it is running now. Nothing ends: retry with the newest refresh token the app holds.
        - **400 `BAD_INSTALL_ID`**: no install id, or a malformed one. Nothing ends.
        - **503**: the database could not be reached. Nothing ends; try again.

        The person is checked as `GET /ess/me` checks them, and the next access token is built from the account as it is now, so a new role or branch shows within the hour. Its `iat` stays the original sign-in's.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
            examples:
              refresh:
                value:
                  refresh_token: 3q2-7wAAAAB1rXkTl0dS9vNc_8yGhH4Jm0bQe1fPzKs
                  install_id: 7f3c2a9e-1b4d-4c8a-9e2f-5d6a7b8c9d0e
      responses:
        '200':
          description: The next tokens, in the same sign-in, which now lasts 90 days from now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionTokens'
              examples:
                attendance:
                  $ref: '#/components/examples/SessionTokensAttendance'
        '400':
          $ref: '#/components/responses/EssBadSessionRequest'
        '401':
          description: |
            `NOT_AUTHENTICATED`, with `reason` (see the description): the sign-in is over. **Sign out.**
          headers:
            WWW-Authenticate:
              $ref: '#/components/headers/WwwAuthenticate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshRefused'
              examples:
                unknown:
                  value: { error: Please sign in again., code: NOT_AUTHENTICATED, reason: unknown }
                expired:
                  value: { error: Your sign-in has expired. Please sign in again., code: NOT_AUTHENTICATED, reason: expired }
                signedOut:
                  value: { error: You have signed out. Please sign in again., code: NOT_AUTHENTICATED, reason: signed_out }
                reuse:
                  value: { error: For your safety you have been signed out. Please sign in again., code: NOT_AUTHENTICATED, reason: reuse }
                passwordChanged:
                  value: { error: Your password was changed. Please sign in again., code: NOT_AUTHENTICATED, reason: password_changed }
                loginOff:
                  value: { error: Your attendance login is turned off. Ask HR., code: NOT_AUTHENTICATED, reason: login_off }
                left:
                  value: { error: 'Your employee record is no longer active, so Team RVM is closed for this login. Ask HR if this is wrong.', code: NOT_AUTHENTICATED, reason: left }
                unlinked:
                  value: { error: Your login is no longer linked to your employee record. Ask HR or the tech team., code: NOT_AUTHENTICATED, reason: unlinked }
        '409':
          description: '`REFRESH_IN_PROGRESS`: retry with the newest refresh token the app holds. Nothing ended.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                inProgress:
                  $ref: '#/components/examples/EssRefreshInProgress'
        '429':
          $ref: '#/components/responses/EssSessionRateLimited'
        '503':
          $ref: '#/components/responses/EssUnavailable'
        default:
          $ref: '#/components/responses/EssUnexpected'
      x-notes:
        - >-
          Refresh when the access token is about to expire (access_expires_at), or on a 401 from either host; never on a timer from several screens at once. Two refreshes with one token are answered 200 and 409.
        - >-
          A lost reply is not recoverable: the token it spent is reuse a minute later, and the sign-in ends. Keep the refresh token and the install id together, and never restore them from a backup.

