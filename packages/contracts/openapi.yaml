    get:
      operationId: listApprovals
      tags: [ESS]
      x-owner: ess
      summary: The approvals Inbox (D1, H6)
      description: |
        - A manager sees their own direct reports' requests, whatever their login role (an attendance session included). `status` must be `pending` for them.
        - HR, the CEO and super admins (the Scheduler's `ATTENDANCE_OVERRIDE_ROLES`; an HR Executive is not among them) see everybody's, and may filter by any status: `pending` (the default), `approved`, `rejected`, `withdrawn`, `cancelled` or `all`.
        - `counts` is always the pending count this caller can still decide, archived ones left out.
        - Each request carries its context: how much of that kind the person has this month (pending + approved; minutes for a short leave), the month's limit, the day's late marks (attendance only), and who else is off that day — never the leave's type or reason, and at most 5 names.
        - Archiving (`POST /ess/approvals/{family}/{id}/archive`) clears a request from the caller's own Inbox without deciding it.
        - The reporting line a request waits on, with who may decide it now, is `GET /ess/approvals/{family}/{id}/chain`.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, withdrawn, cancelled, all]
            default: pending
      responses:
        '200':
          description: The requests and the counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalsList'
              examples:
                manager:
                  value:
                    counts: { attendance: 1, leave: 0, total: 1 }
                    truncated: false
                    requests:
                      - id: 3f2e1d0c-9b8a-4f7e-8d6c-5b4a3f2e1d0c
                        family: attendance
                        type: excuse_late
                        status: pending
                        day: '2026-10-15'
                        reason: The bus broke down near the depot.
                        place: null
                        fix_in: null
                        fix_out: null
