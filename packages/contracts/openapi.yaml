              examples:
                one:
                  value:
                    requests:
                      - id: 3f2e1d0c-9b8a-4f7e-8d6c-5b4a3f2e1d0c
                        family: attendance
                        type: fix_a_day
                        status: rejected
                        day: '2026-10-15'
                        reason: I forgot to punch out.
                        place: null
                        fix_in: null
                        fix_out: '18:00'
                        created_at: '2026-10-14T05:00:00+00:00'
                        decided_at: '2026-10-15T05:00:00+00:00'
                        decided_by_name: Priya Sharma
                        decision_note: The branch closed at 17:30 that day. Ask HR to set it.
                        cancelled_at: null
                        cancelled_by_name: null
                        cancel_reason: null
        '401':
