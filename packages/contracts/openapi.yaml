          device.this_phone says whether this phone can punch, and it depends on the rvm_att_dev cookie, so the cookie jar must send it. own: the employee's registered phone. unknown: no cookie, or one nobody registered; the first accepted punch registers it when has_registered_phone is false, otherwise punches get 403 DEVICE_NOT_REGISTERED. other: another employee's phone. revoked: HR reset this phone.
        - >-
          Read rules.max_accuracy_m and rules.mobile_only from here; never hard-code them.
        - >-
          today.worked_minutes counts up to the moment of the request while punched in.
        - >-
          The day rows carry neither the day's note nor HR's remark, and my_remarks holds only the employee's own remarks. An ESS endpoint will serve the note and HR's remark (task B1, Wave 2), because the Scheduler is not changed (ADR-0018).
