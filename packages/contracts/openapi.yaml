  # ═════════════════ Scheduler: attendance sign-in ═════════════════

  /hr/my-attendance/password-login:
    post:
      operationId: signInAttendancePassword
      tags: ['Scheduler (existing)']
      x-owner: scheduler
      x-source: 'routes/hr.js:66-74,197; controllers/hr/attendanceOtpController.js:114-172,380-449; middleware/punchCodeLimiter.js:19-26'
      summary: Sign in to an attendance login with its password
      description: |
        No token. For staff with no portal login, on an attendance login HR created. `identifier` is the main phone on the HR record, the email on it, or the employee code (any case). Answers with a 30-day attendance session.

        Checked in this order, and the first failure answers: the identifier's form; a password is present; exactly one active employee owns the identifier; that employee has an active attendance login; the login has a password; the login is not locked; the try is claimed on the counter; the password itself.

        Five wrong passwords lock the login for 15 minutes (429 `LOCKED`), and the count starts again after the lock. The way out of a lock or a forgotten password is the code route (`otp/request`, then `otp/verify`).

        `temporary: true` means the password is still the one HR gave. Such a session cannot punch until the person chooses their own with `POST /hr/my-attendance/password`; until then `GET /hr/my-attendance` answers `must_set_password: true`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendancePasswordLoginRequest'
            examples:
              byEmployeeCode:
                value:
                  identifier: RVM-0217
                  password: a longer pass phrase
      responses:
        '201':
          description: Signed in. Store the token; it opens `/hr/my-attendance/*` and `/ess/*` only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSession'
              examples:
                firstTimePassword:
                  summary: Signed in with the password HR gave
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.PAYLOAD.SIGNATURE
                    expires_in_days: 30
                    employee:
                      full_name: Suresh Yadav
                    password_set: true
                    temporary: true
        '400':
          description: |
            - `BAD_IDENTIFIER`: empty, or not a phone, email or employee code ("Enter your phone number, email or employee code."), or a malformed email ("That is not a valid email address.").
            - `BAD_PASSWORD`: no password.
            - `WRONG_CREDENTIALS`: nobody has that identifier (no `attempts_left`, the same words as a wrong password), or the password is wrong (`attempts_left` says how many tries remain before the lock).
            - An HTML page, not JSON: the body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                badIdentifier:
                  value:
                    error: Enter your phone number, email or employee code.
                    code: BAD_IDENTIFIER
                badEmail:
                  value:
                    error: That is not a valid email address.
                    code: BAD_IDENTIFIER
                noPassword:
                  value:
                    error: Enter your password.
                    code: BAD_PASSWORD
                unknownIdentifier:
                  value:
                    error: Wrong phone number, email, employee code or password.
                    code: WRONG_CREDENTIALS
                wrongPassword:
                  value:
                    error: Wrong phone number, email, employee code or password. 3 attempts left.
                    code: WRONG_CREDENTIALS
                    attempts_left: 3
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlPage'
        '403':
          description: |
            Answered before the password is checked:
            - `NOT_ACTIVE`: the only matching employee record is no longer active.
            - `HAS_PORTAL_LOGIN`: this person has a portal login and no active attendance login. Sign them in with `POST /users/login`.
            - `NO_ATTENDANCE_LOGIN`: HR has not created an attendance login, or has switched it off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                notActive:
                  $ref: '#/components/examples/PunchNotActive'
                hasPortalLogin:
                  $ref: '#/components/examples/HasPortalLogin'
                noLogin:
                  $ref: '#/components/examples/NoAttendanceLoginYet'
                loginOff:
                  $ref: '#/components/examples/NoAttendanceLoginOff'
        '404':
          description: |
            `NOT_MAIN_PHONE`: the number is one of the employee's extra phones, not the main one. Only an unknown identifier is folded into `WRONG_CREDENTIALS`; this one is not.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                notMainPhone:
                  $ref: '#/components/examples/NotMainPhone'
        '409':
          description: |
            - `AMBIGUOUS`: the identifier is on more than one active employee record.
            - `PASSWORD_NOT_SET`: the login has no password yet; sign in with a code and set one.
            - `TRY_AGAIN`: another try on the same login landed at the same moment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                ambiguous:
                  value:
                    error: This employee code is on more than one employee record. Ask HR to correct it.
                    code: AMBIGUOUS
                passwordNotSet:
                  value:
                    error: You have not set a password yet. Use "Get a code" to sign in and set one.
                    code: PASSWORD_NOT_SET
                tryAgain:
                  value:
                    error: Please try again.
                    code: TRY_AGAIN
        '429':
          description: |
            - `LOCKED`: five wrong passwords; the login is locked for 15 minutes. The message gives the time in IST, or says "in 15 minutes" on the fifth wrong try.
            - `RATE_LIMITED`: 40 sign-in requests in 15 minutes from this IP address, one bucket shared by `password-login`, `otp/request` and `otp/verify`.
            - "Too many requests. Please slow down." (no code): 300 a minute across `/api`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                lockedNow:
                  value:
                    error: Too many wrong passwords. Try again in 15 minutes, or use "Get a code".
                    code: LOCKED
                stillLocked:
                  value:
                    error: Too many wrong passwords. Try again after 03:30 pm, or use "Get a code".
                    code: LOCKED
                signInBucket:
                  $ref: '#/components/examples/AttendanceSignInRateLimited'
                apiBucket:
                  $ref: '#/components/examples/ApiRateLimited'
        '500':
          description: '"Failed to sign in." (no code): an unexpected failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                unexpected:
                  value:
                    error: Failed to sign in.
        '503':
          description: |
            - `MODULE_DISABLED`: the HR module is switched off (`HR_MODULE_ENABLED=false`), which switches attendance sign-in off too.
            - `MODULE_NOT_INSTALLED`: a migration this needs is not applied yet; `migration` names it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                moduleDisabled:
                  $ref: '#/components/examples/HrModuleDisabled'
                accountsNotInstalled:
                  $ref: '#/components/examples/AccountsNotInstalled'
                punchNotInstalled:
                  $ref: '#/components/examples/PunchNotInstalled'
      x-notes:
        - >-
          Drive the "choose your own password" screen from GET /hr/my-attendance (must_set_password), not from temporary: a code sign-in may punch while HR's password is still set, and only a password session is held back.
        - >-
          Show the 403, 404 and 409 messages as they are: they tell the person exactly whom to ask.
        - >-
          The phone is normalised (+91, 91 and a leading 0 are dropped), unlike the portal sign-in.
        - >-
          The 40-in-15-minutes bucket is per IP address and shared with the code routes, where one code sign-in costs two requests: a branch signing in from one office Wi-Fi on the first morning can fill it.

  /hr/my-attendance/otp/request:
    post:
      operationId: requestAttendanceCode
      tags: ['Scheduler (existing)']
      x-owner: scheduler
      x-source: 'routes/hr.js:66-74,193; controllers/hr/attendanceOtpController.js:92-261; supabase/migrations/20261020000000_hr_attendance_punch.sql (hr_attendance_otp_issue)'
      summary: Send a sign-in code to the phone or email on the HR record
      description: |
        No token. `identifier` is the main phone (by SMS) or the email on the HR record, never one of the extra phones. When exactly one active employee owns it and they have an active attendance login, a six-digit code is sent; it lives 10 minutes and allows 5 wrong tries.

        Codes are capped per requester, which is this phone when it sends its `rvm_att_dev` cookie and otherwise the IP address: 3 in 15 minutes and 10 in 24 hours. Across every requester except the employee's own registered phone there is also a ceiling of 20 a day per employee. HR can clear them.
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceCookie'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCodeRequest'
            examples:
              byPhone:
                value:
                  identifier: '+91 98100 12345'
      responses:
        '201':
          description: The code is on its way.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceCodeSent'
              examples:
                sms:
                  value:
                    challenge_id: 7c6b5a49-3827-4615-a504-f3e2d1c0b9a8
                    channel: sms
                    sent_to: ••••••2345
                    expires_at: '2026-10-16T03:40:00.000+00:00'
                    ttl_minutes: 10
                    sandbox: false
        '400':
          description: |
            - `BAD_IDENTIFIER`: empty, a malformed email, or not a ten-digit Indian mobile number.
            - An HTML page, not JSON: the body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                empty:
                  value:
                    error: Enter the phone number or email on your employee record.
                    code: BAD_IDENTIFIER
                badEmail:
                  value:
                    error: That is not a valid email address.
                    code: BAD_IDENTIFIER
                badPhone:
                  value:
                    error: Enter a ten-digit Indian mobile number, or your email.
                    code: BAD_IDENTIFIER
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlPage'
        '403':
          description: |
            - `NOT_ACTIVE`: the only matching employee record is no longer active.
            - `HAS_PORTAL_LOGIN`: this person has a portal login and no active attendance login.
            - `NO_ATTENDANCE_LOGIN`: no attendance login yet, or switched off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                notActive:
                  $ref: '#/components/examples/PunchNotActive'
                hasPortalLogin:
                  $ref: '#/components/examples/HasPortalLogin'
                noLogin:
                  $ref: '#/components/examples/NoAttendanceLoginYet'
                loginOff:
                  $ref: '#/components/examples/NoAttendanceLoginOff'
        '404':
          description: |
            - `NOT_MAIN_PHONE`: the number is one of the employee's extra phones.
            - `NOT_FOUND`: no active employee has this phone or email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                notMainPhone:
                  $ref: '#/components/examples/NotMainPhone'
                notFound:
                  value:
                    error: We could not find an employee with this phone number. Ask HR to add it to your employee record, or contact the tech team.
                    code: NOT_FOUND
        '409':
          description: '`AMBIGUOUS`: the phone or email is on more than one active employee record.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                ambiguous:
                  value:
                    error: This phone number is on more than one employee record. Ask HR to correct it.
                    code: AMBIGUOUS
        '429':
          description: |
            - `TOO_MANY_CODES`: a cap on codes was reached (this requester's 15-minute or daily allowance, or the employee's daily ceiling, which HR can clear).
            - `RATE_LIMITED`: 40 sign-in requests in 15 minutes from this IP address (shared bucket).
            - "Too many requests. Please slow down." (no code): 300 a minute across `/api`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                window:
                  value:
                    error: Too many codes asked for. Wait fifteen minutes and try again.
                    code: TOO_MANY_CODES
                ceiling:
                  value:
                    error: Too many codes have been asked for on this employee today. Contact HR -- they can clear it.
                    code: TOO_MANY_CODES
                day:
                  value:
                    error: Too many codes asked for today. Contact HR or the tech team.
                    code: TOO_MANY_CODES
                signInBucket:
                  $ref: '#/components/examples/AttendanceSignInRateLimited'
                apiBucket:
                  $ref: '#/components/examples/ApiRateLimited'
        '500':
          description: '"Failed to send the code." (no code): an unexpected failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                unexpected:
                  value:
                    error: Failed to send the code.
        '502':
          description: '`SMS_FAILED` or `MAIL_FAILED`: the provider refused the message. The code was retired, so ask again or use the other channel.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                smsFailed:
                  value:
                    error: The code could not be sent. Try again in a minute, or use your email.
                    code: SMS_FAILED
                mailFailed:
                  value:
                    error: The code could not be sent. Try again in a minute.
                    code: MAIL_FAILED
        '503':
          description: |
            - `SMS_NOT_CONFIGURED` or `MAIL_NOT_CONFIGURED`: that channel is not set up on the server; offer the other one.
            - `MODULE_DISABLED`: the HR module is switched off.
            - `MODULE_NOT_INSTALLED`: a migration this needs is not applied yet; `migration` names it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                smsNotConfigured:
                  value:
                    error: Codes cannot be sent by SMS right now (SMS_PROVIDER is not set). Try the other option, or contact the tech team.
                    code: SMS_NOT_CONFIGURED
                mailNotConfigured:
                  value:
                    error: Codes cannot be sent by email right now (missing ZEPTOMAIL_API_TOKEN). Try the other option, or contact the tech team.
                    code: MAIL_NOT_CONFIGURED
                moduleDisabled:
                  $ref: '#/components/examples/HrModuleDisabled'
                punchNotInstalled:
                  $ref: '#/components/examples/PunchNotInstalled'
                accountsNotInstalled:
                  $ref: '#/components/examples/AccountsNotInstalled'
      x-notes:
        - >-
          sandbox: true means the server is in console mode: the code was written to the server log, not delivered. Say so on screen instead of leaving the person waiting for an SMS.
        - >-
          Send the rvm_att_dev cookie when the jar holds one (its path covers this URL): the employee's own phone then counts as its own requester and sits outside the daily ceiling, so colleagues cannot use up its codes.
        - >-
          Unlike the portal reset, this tells the person whether their number or email is on file (NOT_FOUND, NOT_MAIN_PHONE). That is by design: RVM wants someone who is stuck told to go to HR.
        - >-
          The phone is normalised (+91, 91 and a leading 0 are dropped) and matched against the main phone on the HR record only.

  /hr/my-attendance/otp/verify:
    post:
      operationId: verifyAttendanceCode
      tags: ['Scheduler (existing)']
      x-owner: scheduler
      x-source: 'routes/hr.js:66-74,194; controllers/hr/attendanceOtpController.js:263-325'
      summary: Turn a sign-in code into an attendance session
      description: |
        No token. A right code answers with a 30-day attendance session. The employee is checked again at this point, so an exit, or HR switching the login off, between the request and the code is refused here, after the code has been spent.

        `password_set: false` means the login has no password yet: offer to set one with `POST /hr/my-attendance/password`, which a code sign-in may do for 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCodeVerifyRequest'
            examples:
              verify:
                value:
                  challenge_id: 7c6b5a49-3827-4615-a504-f3e2d1c0b9a8
                  code: '305618'
      responses:
        '201':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceSession'
              examples:
                noPasswordYet:
                  summary: The login has no password yet
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.PAYLOAD.SIGNATURE
                    expires_in_days: 30
                    employee:
                      full_name: Suresh Yadav
                    password_set: false
                    temporary: false
        '400':
          description: |
            - `NO_LIVE_CODE`: `challenge_id` is not a uuid ("Ask for a code first."), or the code is spent or unknown.
            - `BAD_CODE`: not six digits (spaces are ignored).
            - `EXPIRED`: older than 10 minutes.
            - `ATTEMPTS_EXHAUSTED`: the tries are used up.
            - `WRONG_CODE`: wrong code; `attempts_left` says how many tries remain.
            - An HTML page, not JSON: the body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                noChallenge:
                  value:
                    error: Ask for a code first.
                    code: NO_LIVE_CODE
                noLiveCode:
                  value:
                    error: No code is waiting. Ask for a new one.
                    code: NO_LIVE_CODE
                badCode:
                  value:
                    error: Enter the six-digit code.
                    code: BAD_CODE
                expired:
                  value:
                    error: That code has expired. Ask for a new one.
                    code: EXPIRED
                exhausted:
                  value:
                    error: Too many wrong codes. Ask for a new one.
                    code: ATTEMPTS_EXHAUSTED
                wrongCode:
                  value:
                    error: Wrong code. 2 attempts left.
                    code: WRONG_CODE
                    attempts_left: 2
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlPage'
        '403':
          description: |
            - `NOT_ACTIVE`: the employee record stopped being active after the code was sent.
            - `HAS_PORTAL_LOGIN`: the person now has a portal login and no active attendance login.
            - `NO_ATTENDANCE_LOGIN`: HR has no attendance login for them, or switched it off.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                notActive:
                  $ref: '#/components/examples/PunchNotActive'
                hasPortalLogin:
                  $ref: '#/components/examples/HasPortalLogin'
                noLogin:
                  $ref: '#/components/examples/NoAttendanceLoginYet'
                loginOff:
                  $ref: '#/components/examples/NoAttendanceLoginOff'
        '409':
          description: '`TRY_AGAIN`: another try on the same code landed at the same moment and took the slot.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                tryAgain:
                  value:
                    error: That code was just tried from somewhere else. Wait a moment and try again.
                    code: TRY_AGAIN
        '429':
          description: |
            - `RATE_LIMITED`: 40 sign-in requests in 15 minutes from this IP address (shared bucket).
            - "Too many requests. Please slow down." (no code): 300 a minute across `/api`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                signInBucket:
                  $ref: '#/components/examples/AttendanceSignInRateLimited'
                apiBucket:
                  $ref: '#/components/examples/ApiRateLimited'
        '500':
          description: '"Failed to check the code." (no code): an unexpected failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                unexpected:
                  value:
                    error: Failed to check the code.
        '503':
          $ref: '#/components/responses/HrUnavailable'
      x-notes:
        - >-
          Each try is claimed on the counter before the code is compared, so two phones guessing at once get 409 TRY_AGAIN rather than extra tries.
        - >-
          The 15-minute window for setting a password is counted from this token's issue time. After it, sign in with a code again to set or change the password.

  /hr/my-attendance/password:
    post:
      operationId: setAttendancePassword
      tags: ['Scheduler (existing)']
      x-owner: scheduler
      x-source: 'routes/hr.js:66-74,198; controllers/hr/attendanceOtpController.js:327-378; services/attendancePunch.js:241-266'
      summary: Choose your own attendance password
      description: |
        Attendance session only. Allowed in two cases:
        - within 15 minutes of signing in with a code; or
        - from a password session while the password is still the one HR gave.

        The rules for the new password: at least 8 characters, at most 72 bytes, not one character repeated, not containing the ten digits of the employee's main phone (even split up by other characters), and not the same as HR's first-time password.

        On success every other session of this login stops working, and the reply carries a fresh 30-day session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceSetPasswordRequest'
            examples:
              choose:
                value:
                  password: a longer pass phrase
      responses:
        '200':
          description: The password is set. Store `token` in place of the old one before any other call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendancePasswordSet'
              examples:
                set:
                  value:
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.PAYLOAD.SIGNATURE
                    password_set: true
        '400':
          description: |
            - `WEAK_PASSWORD`: the message names the rule that failed.
            - `SAME_AS_HR_PASSWORD`: it is the password HR gave.
            - An HTML page, not JSON: the body is not valid JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                tooShort:
                  value:
                    error: Use at least 8 characters.
                    code: WEAK_PASSWORD
                tooLong:
                  value:
                    error: That password is too long. Use at most 72 characters.
                    code: WEAK_PASSWORD
                repeated:
                  value:
                    error: Do not repeat one character. Mix letters and numbers.
                    code: WEAK_PASSWORD
                phoneNumber:
                  value:
                    error: Do not use your phone number as your password.
                    code: WEAK_PASSWORD
                hrPassword:
                  value:
                    error: Choose a new password, not the one HR gave you.
                    code: SAME_AS_HR_PASSWORD
            text/html:
              schema:
                $ref: '#/components/schemas/HtmlPage'
        '401':
          $ref: '#/components/responses/PunchAuthRejected'
        '403':
          description: |
            - `PORTAL_ACCOUNT`: a portal token. Portal passwords are not changed here.
            - `CODE_REQUIRED`: neither case applies (more than 15 minutes after a code sign-in, or a password session on the person's own password). Sign in with a code first.
            - `NOT_ACTIVE`, `NO_ATTENDANCE_LOGIN`: as on every `/hr/my-attendance` endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                portalAccount:
                  value:
                    error: Your portal password is changed from your profile, not here.
                    code: PORTAL_ACCOUNT
                codeRequired:
                  value:
                    error: To set your password, sign in with a code first ("Get a code").
                    code: CODE_REQUIRED
                notActive:
                  $ref: '#/components/examples/PunchNotActive'
                noLogin:
                  $ref: '#/components/examples/NoAttendanceLoginYet'
                loginOff:
                  $ref: '#/components/examples/NoAttendanceLoginOff'
        '429':
          $ref: '#/components/responses/SchedulerApiRateLimited'
        '500':
          description: '"Failed to set the password." (no code): an unexpected failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                unexpected:
                  value:
                    error: Failed to set the password.
        '503':
          $ref: '#/components/responses/HrUnavailable'
      x-notes:
        - >-
          Replace the stored token with the one in the reply before making any other call: the old one now answers 401 NOT_AUTHENTICATED "Your password was changed. Please sign in again.".
        - >-
          CODE_REQUIRED is checked before the session itself, so an old code session can get 403 CODE_REQUIRED rather than 401.
        - >-
          Only the 300-a-minute bucket applies here; there is no sign-in bucket.

