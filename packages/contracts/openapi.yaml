  responses:

    EssNotAuthenticated:
      description: |
        `NOT_AUTHENTICATED`: the token is absent or rejected. That means no token, a bad signature, an expired token, a wrong algorithm, an attendance session issued before its login's `sessions_valid_from`, a token whose account no longer exists (including a teaching account whose faculty id no longer matches its token), or an access token whose kept sign-in has ended (its `sid` names no live sign-in of the same person). **This is the only reply on which the app signs out**; with a kept sign-in, it refreshes once first and signs out only if the refresh answers 401. The ESS never sends it for a database outage.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WwwAuthenticate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            noToken:
              $ref: '#/components/examples/EssSignIn'
            expired:
              $ref: '#/components/examples/EssNotAuthenticated'
            rejected:
              $ref: '#/components/examples/EssSignInAgain'
            passwordChanged:
              $ref: '#/components/examples/EssPasswordChanged'

    EssForbidden:
      description: |
        The token is good, but this person cannot use Team RVM as things stand. Show the message; do not sign out on its own.
        - `NOT_AN_EMPLOYEE`: a valid token that is not a staff login (a student or admission-undertaking token), or a portal token whose account is not staff (the connector account).
        - `NOT_LINKED`: a portal login with no linked HR record; HR links it.
        - `NOT_ACTIVE`: the employee has left.
        - `NO_ATTENDANCE_LOGIN`: an attendance session whose login is missing or switched off.
        - `PASSWORD_CHANGE_REQUIRED`: an attendance session signed in with HR's first-time password, before the person chose their own. Send them to "Choose your own password".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notAnEmployee:
              $ref: '#/components/examples/EssNotAnEmployee'
            notLinked:
              $ref: '#/components/examples/EssNotLinked'
            notActive:
              $ref: '#/components/examples/EssNotActive'
            noAttendanceLogin:
              $ref: '#/components/examples/EssNoAttendanceLogin'
            attendanceLoginOff:
              $ref: '#/components/examples/EssAttendanceLoginOff'
            passwordChangeRequired:
              $ref: '#/components/examples/EssPasswordChangeRequired'

    EssRateLimited:
      description: |
        `RATE_LIMITED`: more than 600 requests in a minute from this IP address (every path, counted before the token is checked), or more than 120 in a minute from this employee (after it). Wait for `Retry-After` seconds.

        The few paths with a tighter bucket of their own say so on the operation.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              $ref: '#/components/examples/EssRateLimited'

    EssUnavailable:
      description: |
        Not a reason to sign out; keep the session and try again later.
        - `UNAVAILABLE`: the database could not be reached, or answered something the ESS could not use.
        - `MODULE_DISABLED`: the ESS is switched off (`ESS_ENABLED=false`), checked before the token. The Scheduler's sign-in and punching still work.
        - `MODULE_NOT_INSTALLED`: a table, column or function this needs is missing, in the window between a deploy and KP applying its migration (ADR-0021). An access token of a kept sign-in answers it too while `hr_ess_sessions` is missing (before its migration, or after a rollback); sign in again with the Scheduler.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            unavailable:
              $ref: '#/components/examples/EssUnavailable'
            moduleDisabled:
              $ref: '#/components/examples/EssModuleDisabled'
            notInstalled:
              $ref: '#/components/examples/EssNotInstalled'

    EssUnexpected:
      description: |
        Any other failure, in the same `{ error, code }` body. Today these are 404 `NOT_FOUND` for an address the ESS does not have, or a method it does not take there (OPTIONS included); 400 `INVALID_JSON` or `BAD_REQUEST`, 413 `PAYLOAD_TOO_LARGE` and 415 `UNSUPPORTED_MEDIA_TYPE` for a body it cannot read; and 500 `INTERNAL_ERROR` for a fault on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notFound:
              value:
                error: There is nothing at this address.
                code: NOT_FOUND
            internal:
              value:
                error: Something went wrong on the server. Try again, and tell the tech team if it keeps happening.
                code: INTERNAL_ERROR

    EssBadSessionRequest:
      description: |
        Nothing is kept or ended.
        - `BAD_INSTALL_ID`: no install id, or not 16 to 128 of `A-Z a-z 0-9 . _ -`.
        - `BAD_DEVICE_LABEL`: a phone name over 80 characters, with a control character, or not a string.
        - `INVALID_JSON`, `BAD_REQUEST`: a body the ESS cannot read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            badInstallId:
              $ref: '#/components/examples/EssBadInstallId'
            badDeviceLabel:
              $ref: '#/components/examples/EssBadDeviceLabel'
            invalidJson:
              $ref: '#/components/examples/EssInvalidJson'

    EssSessionRateLimited:
      description: |
        `RATE_LIMITED`: refresh and sign-out by refresh token allow 120 in 15 minutes from one address; keeping a sign-in allows one employee 10 in 15 minutes; and the ESS-wide limits apply as everywhere. Wait for `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              $ref: '#/components/examples/EssRateLimited'

    EssSignInRateLimited:
      description: |
        `RATE_LIMITED`: 40 in 15 minutes from one address, or 10 in 15 minutes for one identifier from any address. Wait for `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            rateLimited:
              $ref: '#/components/examples/EssRateLimited'

    EssHrForbidden:
      description: |
        Not a reason to sign out.
        - `PORTAL_LOGIN_REQUIRED`: an attendance session. HR's tools need the portal login.
        - `HR_ACCESS_DENIED`: a portal role other than `hr`, `hr_executive` or `super_admin`.
        - `NOT_AN_EMPLOYEE`, `NOT_LINKED`, `NOT_ACTIVE`, `NO_ATTENDANCE_LOGIN`, `PASSWORD_CHANGE_REQUIRED`: as for `GET /ess/me`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            hrAccessDenied:
              $ref: '#/components/examples/EssHrAccessDenied'
            portalLoginRequired:
              $ref: '#/components/examples/EssPortalLoginRequired'
            notAnEmployee:
              $ref: '#/components/examples/EssNotAnEmployee'
            notLinked:
              $ref: '#/components/examples/EssNotLinked'
            notActive:
              $ref: '#/components/examples/EssNotActive'
            noAttendanceLogin:
              $ref: '#/components/examples/EssNoAttendanceLogin'
            passwordChangeRequired:
              $ref: '#/components/examples/EssPasswordChangeRequired'

    EssAttendanceHrForbidden:
      description: |
        Not a reason to sign out.
        - `PORTAL_LOGIN_REQUIRED`: an attendance session. These tools need the portal login.
        - `ATTENDANCE_OVERRIDE_DENIED`: a portal role other than `hr`, `ceo` or `super_admin` (an `hr_executive` included).
        - `NOT_AN_EMPLOYEE`, `NOT_LINKED`, `NOT_ACTIVE`, `NO_ATTENDANCE_LOGIN`, `PASSWORD_CHANGE_REQUIRED`: as for `GET /ess/me`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            attendanceOverrideDenied:
              $ref: '#/components/examples/EssAttendanceOverrideDenied'
            portalLoginRequired:
              $ref: '#/components/examples/EssPortalLoginRequired'
            notAnEmployee:
              $ref: '#/components/examples/EssNotAnEmployee'
            notLinked:
              $ref: '#/components/examples/EssNotLinked'
            notActive:
              $ref: '#/components/examples/EssNotActive'
            noAttendanceLogin:
              $ref: '#/components/examples/EssNoAttendanceLogin'
            passwordChangeRequired:
              $ref: '#/components/examples/EssPasswordChangeRequired'

    EssBadPersonalDetails:
      description: |
        `VALIDATION_FAILED`: the message says which rule (the body, a field's format, or an incomplete emergency contact). `INVALID_JSON`, `BAD_REQUEST`: a body the ESS cannot read.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            nothing:
              value: { error: Send at least one field to change., code: VALIDATION_FAILED }
            dateOfBirth:
              value: { error: 'Date of birth must be a real date (YYYY-MM-DD) from 1940 on, at least 16 years ago.', code: VALIDATION_FAILED }
            bloodGroup:
              value: { error: 'Blood group must be one of A+, A-, B+, B-, AB+, AB-, O+ or O-.', code: VALIDATION_FAILED }
            address:
              value: { error: 'Each address line can be up to 200 characters, and the city and state up to 80.', code: VALIDATION_FAILED }
            pincode:
              value: { error: The PIN code must be 6 digits., code: VALIDATION_FAILED }
            emergencyName:
              value: { error: The emergency contact name can be up to 100 characters., code: VALIDATION_FAILED }
            emergencyRelation:
              value: { error: The relation can be up to 50 characters., code: VALIDATION_FAILED }
            emergencyPhone:
              value: { error: The emergency contact phone must be a 10-digit Indian mobile number., code: VALIDATION_FAILED }
            incomplete:
              value: { error: 'An emergency contact needs both a name and a phone number, and a relation needs a name.', code: VALIDATION_FAILED }
            id:
              $ref: '#/components/examples/EssInvalidId'
            unknownField:
              $ref: '#/components/examples/EssUnknownField'
            notObject:
              $ref: '#/components/examples/EssBodyNotObject'

    EssBadHrListQuery:
      description: |
        `VALIDATION_FAILED`: a query value the message names (a status that is not offered, a day that is not real, a day outside 2000 to 2099, a range the wrong way round or over 366 days, a branch_id that is not a uuid), or one given more than once.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            date:
              $ref: '#/components/examples/EssDateFormat'
            range:
              value: { error: 'from must be on or before to, and at most 366 days before it.', code: VALIDATION_FAILED }
            outOfRange:
              value: { error: Dates must be from 2000-01-01 to 2099-12-31., code: VALIDATION_FAILED }
            branch:
              $ref: '#/components/examples/EssBranchId'
            status:
              value: { error: 'status must be active, revoked or all.', code: VALIDATION_FAILED }

    EssBranchNotFound:
      description: '`NOT_FOUND`: no branch has this `branch_id`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
