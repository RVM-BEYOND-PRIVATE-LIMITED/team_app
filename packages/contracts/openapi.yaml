        - `kind`: `correct` or `delete`. `details`: what should change, 5 to 2,000 characters after trimming (counted as characters, so an emoji is one).
        - The body takes these two fields and no others: an unknown field is refused, never ignored. There is no employee id: a request is always about the caller.
