          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                notActive:
                  $ref: '#/components/examples/PunchNotActive'
                hasPortalLogin:
                  $ref: '#/components/examples/HasPortalLogin'
                noLogin:
                  $ref: '#/components/examples/NoAttendanceLoginYet'
                loginOff:
                  $ref: '#/components/examples/NoAttendanceLoginOff'
        '409':
          description: '`TRY_AGAIN`: another try on the same code landed at the same moment and took the slot.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                tryAgain:
                  value:
                    error: That code was just tried from somewhere else. Wait a moment and try again.
                    code: TRY_AGAIN
        '429':
          description: |
            - `RATE_LIMITED`: 40 sign-in requests in 15 minutes from this IP address (shared bucket).
            - "Too many requests. Please slow down." (no code): 300 a minute across `/api`.
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                signInBucket:
                  $ref: '#/components/examples/AttendanceSignInRateLimited'
                apiBucket:
                  $ref: '#/components/examples/ApiRateLimited'
        '500':
          description: '"Failed to check the code." (no code): an unexpected failure.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerError'
              examples:
                unexpected:
                  value:
                    error: Failed to check the code.
        '503':
          $ref: '#/components/responses/HrUnavailable'
      x-notes:
        - >-
