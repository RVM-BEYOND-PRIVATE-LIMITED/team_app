              examples:
                portalAsTyped:
                  value: { kind: portal, login_with: as_typed, location_names: [Faridabad, Pune, Ahmedabad, Lucknow] }
                portalUsernameOrPhone:
                  value: { kind: portal, login_with: username_or_phone }
                attendance:
                  value: { kind: attendance, methods: [code, password] }
                attendanceNoLogin:
                  value: { kind: attendance, methods: [] }
                unknown:
                  value: { kind: unknown }
        '400':
          description: |
            - `BAD_IDENTIFIER`: no identifier, an empty one, or one longer than 254 characters.
            - `INVALID_JSON`, `BAD_REQUEST`: a body the ESS cannot read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                badIdentifier:
                  $ref: '#/components/examples/EssBadIdentifier'
                invalidJson:
                  $ref: '#/components/examples/EssInvalidJson'
        '429':
          $ref: '#/components/responses/EssSignInRateLimited'
        '503':
          $ref: '#/components/responses/EssUnavailable'
        default:
          $ref: '#/components/responses/EssUnexpected'

