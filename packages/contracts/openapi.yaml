  /ess/approvals/{family}/{id}/decide:
    servers:
      - url: 'https://{essHost}/api'
        description: The ESS, on its own host name (ADR-0019).
        variables:
          essHost:
            default: team-api.rvmcad.org
            description: The ESS's own host name, chosen by KP on 16 Oct 2026 (ADR-0019).
    post:
      operationId: decideRequest
      tags: [ESS]
      x-owner: ess
      summary: Decide a request — approve or reject (D1, H6)
      description: |
        The manager on the HR record, or HR, the CEO or a super admin (task D1). An attendance session may decide as a manager; the HR-wide decision needs the portal role. With multi-level approvals (D4), the FIRST unskipped level of the reporting line may decide -- a level above an active manager may not.

        - `decision`: `approve` or `reject`. `note`: up to 1,000 characters; a rejection needs one (at least 3), because the employee is owed the reason.
        - An approval writes the official day through the Scheduler's override function, in one transaction with the request's status and history; a second decision on the same request is 409 `ALREADY_DECIDED` whatever two approvers do at the same moment.
        - What a decision can refuse: `NOT_LATE` (excusing a day that is not a late), `TIMES_INCOMPLETE` (the fix would leave the day without an in or out), `DAY_LOCKED` (a fix on a day recorded as leave, a week off or a holiday), `CL_LIMIT` (a second CL in the month), `REQUEST_CLOSED`/`REQUEST_WINDOW` (last month past the cut-off), `REQUEST_FUTURE` (a fix or excuse for a day that has not happened). A refused decision changes nothing.
        - An approved on_duty day for a FUTURE date is not written yet: the morning job writes it on the day itself, so the day is never locked before it happens.
      parameters:
        - name: family
          in: path
          required: true
          description: '`attendance` or `leave`.'
          schema:
            type: string
            enum: [attendance, leave]
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                note:
                  type: [string, 'null']
                  maxLength: 1000
            examples:
              approve:
                value: { decision: approve, note: Checked with the branch. }
              reject:
                value: { decision: reject, note: The branch needs him that day. }
      responses:
        '200':
          description: Decided. The reply is the request as it now stands.
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request:
                    $ref: '#/components/schemas/AttendanceRequest'
              examples:
                approved:
                  value:
                    request:
                      id: 3f2e1d0c-9b8a-4f7e-8d6c-5b4a3f2e1d0c
                      family: attendance
                      type: on_duty
                      status: approved
                      day: '2026-10-15'
                      reason: College drive at the Pune centre.
                      place: Pune centre
                      fix_in: null
                      fix_out: null
                      minutes: null
                      created_at: '2026-10-14T05:00:00+00:00'
                      decided_at: '2026-10-16T06:30:00+00:00'
                      decided_by_name: Priya Sharma
                      decision_note: null
                      cancelled_at: null
                      cancelled_by_name: null
                      cancel_reason: null
                      employee: { id: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e, full_name: Suresh Yadav, employee_code: RVM-0217 }
