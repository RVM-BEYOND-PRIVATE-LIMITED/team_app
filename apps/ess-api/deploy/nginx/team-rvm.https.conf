# Team RVM ESS on its own host name (ADR-0019).
#
# Written by team_app's deploy (apps/ess-api/deploy/configure-nginx.sh) to
# /etc/nginx/sites-available/team-rvm. Do not edit it on the server: the next
# deploy rewrites it. __ESS_HOST__ is replaced with the repository variable
# ESS_HOST, and __ESS_PORT__ with the port pm2 gives the ESS
# (apps/ess-api/ecosystem.config.cjs), before the file is written.
#
# The Scheduler's own files (sites-available/scheduler and student) are never
# touched from this repository.
server {
    listen 80;
    server_name __ESS_HOST__;

    # certbot renews this certificate over HTTP through the same directory it
    # was issued with, so the challenge path stays open on port 80.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/team-rvm-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __ESS_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__ESS_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__ESS_HOST__/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads (documents, helpdesk photos) are capped by the ESS itself. This
    # limit only stops anything larger before it reaches the process.
    client_max_body_size 12m;

    location /api/ess/ {
        proxy_pass         http://127.0.0.1:__ESS_PORT__;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # The ESS trusts exactly one proxy hop (trust proxy 1), which is this one.
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Nothing else lives on this host. A JSON 404 keeps the app's error
    # handling simple: it never has to parse an HTML page from here.
    location / {
        default_type application/json;
        return 404 '{"error":"Not found","code":"NOT_FOUND"}';
    }
}
