# Team RVM ESS, first stage: HTTP only, until the certificate exists.
#
# Written by team_app's deploy (apps/ess-api/deploy/configure-nginx.sh) to
# /etc/nginx/sites-available/team-rvm. Do not edit it on the server: the next
# deploy rewrites it. __ESS_HOST__ is replaced with the repository variable
# ESS_HOST before the file is written.
#
# This stage exists only so certbot can prove the host name. The API is not
# served over plain HTTP, because every request carries a sign-in token.
server {
    listen 80;
    server_name __ESS_HOST__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/team-rvm-acme;
        default_type text/plain;
    }

    location / {
        default_type application/json;
        return 503 '{"error":"The Team RVM server is still being set up. Please try again later.","code":"UNAVAILABLE"}';
    }
}
